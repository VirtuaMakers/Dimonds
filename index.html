          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            <GoldBtn onClick={()=>{setPlayerName(nameInput.trim()||"You");startGame();}}>
              Deal Me In ◆
            </GoldBtn>
            <GoldBtn onClick={()=>setShowRules(true)} secondary small>
              How to Play
            </GoldBtn>
          </div>
        </div>

        {showRules && <RulesPanel onClose={()=>setShowRules(false)}/>}
      </div>
    );
  }

  // ============================================================
  // RENDER: GAME TABLE
  // ============================================================
  const playerHand = sortHand(hands[0] || []);
  const canPlay = isPlayerTurn && selectedCard;

  // Can player lead with a diamond? Only if broken or no other cards
  const canLeadDiamond = diamondsBroken || playerHand.filter(c=>!isDiamond(c)&&!c.isJoker).length===0;

  // Validate if selected card is legal to play
  const selectedIsLegal = selectedCard && (
    mustOpenWith2C
      ? (selectedCard.rank==="2" && selectedCard.suit==="♣")
      : selectedCard.isJoker
      ? true
      : trickPlays.length === 0
      ? (!isDiamond(selectedCard) || canLeadDiamond)
      : (
          !ledSuit ||
          selectedCard.suit === ledSuit ||
          !playerHand.some(c=>!c.isJoker && c.suit===ledSuit)
        )
  );

  return (
    <div style={{
      height:"100dvh",
      maxHeight:"100dvh",
      background:"radial-gradient(ellipse at 50% 22%, #15564c 0%, #0d3b34 45%, #061d19 100%)",
      display:"flex",flexDirection:"column",
      fontFamily:FONT_UI,color:"#fff",
      userSelect:"none",
      overflow:"hidden",
      WebkitOverflowScrolling:"touch",
    }}>

      <FlyingCardsOverlay flyers={flyingCards} deckTheme={deckTheme}/>

      {/* TOP BAR */}
      <div style={{
        display:"flex",justifyContent:"space-between",alignItems:"center",
        padding:"10px 16px",
        borderBottom:"1px solid rgba(75,195,175,0.15)",
        background:"linear-gradient(180deg, rgba(8,35,31,0.78), rgba(8,35,31,0.45))",
        backdropFilter:"blur(14px) saturate(1.2)",
        WebkitBackdropFilter:"blur(14px) saturate(1.2)",
        flexShrink:0,
      }}>
        <div style={{
          fontFamily:FONT_DISPLAY, fontSize:17, fontWeight:800,
          background:`linear-gradient(90deg,${VM.tealLight},${VM.gold})`,
          WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",
          letterSpacing:3,
        }}>◆ DIMONDS</div>
        <div style={{display:"flex",gap:12,alignItems:"center"}}>
          <span style={{color:VM.tealLight+"99",fontSize:11,fontFamily:FONT_UI}}>Round <strong style={{color:VM.tealLight}}>{roundNum}</strong></span>
          <span style={{color:VM.tealLight+"99",fontSize:11,fontFamily:FONT_UI}}>Tricks <strong style={{color:VM.tealLight}}>{tricksPlayed}</strong></span>
        </div>
        <div style={{display:"flex",gap:6,alignItems:"center"}}>
          <GoldBtn onClick={()=>setShowRules(true)} small secondary>Rules</GoldBtn>
          <GoldBtn onClick={()=>setScreen("menu")} small secondary>Menu</GoldBtn>
          <button
            onClick={()=>setSoundOn(s=>!s)}
            aria-label={soundOn ? "Mute sounds" : "Unmute sounds"}
            title={soundOn ? "Mute all sounds" : "Unmute all sounds"}
            style={{
              background:"transparent",
              border:`1px solid ${soundOn ? VM.tealLight+"55" : "#66666655"}`,
              borderRadius:10,
              padding:"4px 7px",
              fontSize:13,
              lineHeight:1,
              color:soundOn ? VM.tealLight : "#888",
              cursor:"pointer",
              fontFamily:"inherit",
            }}
          >{soundOn ? "🔊" : "🔇"}</button>
        </div>
      </div>

      {/* SCORES */}
      <div style={{
        display:"flex",gap:4,padding:"6px 10px",
        borderBottom:"1px solid #ffffff0a",flexShrink:0,
        overflowX:"auto",
      }}>
        {allNames.map((n,i)=>{
          const isLeading = i===turnOrder[currentTurn] && phase==="playing";
          const total = totalScores[i]||0;
          const pct = Math.min(100, Math.round(total/WIN_SCORE*100));
          return (
            <div key={n} ref={el => scorePanelRefs.current[i] = el} style={{
              background: isLeading?"rgba(75,195,175,0.16)":"rgba(255,255,255,0.04)",
              border:`1px solid ${isLeading?VM.tealLight+"66":"rgba(75,195,175,0.10)"}`,
              borderRadius:10,padding:"5px 8px",
              textAlign:"center",flex:1,minWidth:56,
              transition:"all 0.2s",
              boxShadow: isLeading?`0 0 16px ${VM.tealLight}22`:"none",
            }}>
              <div style={{fontSize:9,color:VM.tealLight+"aa",letterSpacing:1,marginBottom:1,fontFamily:FONT_UI}}>{n.slice(0,7)}</div>
              <AnimatedNumber value={total} style={{
                fontSize:20,fontWeight:800,fontFamily:FONT_DISPLAY,
                color:isLeading?VM.gold:"#ffffffcc",
                lineHeight:1.1,display:"block",
              }}/>
              {/* +N round-running display removed — was confusing because the big total
                  doesn't change until round end. Round-end events show points earned. */}
              <div style={{height:11,lineHeight:1}}/>
              {/* Progress bar toward 80 */}
              <div style={{
                marginTop:3,height:3,borderRadius:2,
                background:"#ffffff11",overflow:"hidden",
              }}>
                <div style={{
                  height:"100%",borderRadius:2,
                  width:`${pct}%`,
                  background: pct>=75?VM.gold:pct>=50?`linear-gradient(90deg,${VM.tealMid},${VM.gold})`:VM.tealMid,
                  transition:"width 0.4s ease",
                }}/>
              </div>
            </div>
          );
        })}
      </div>

      {/* AI OPPONENTS */}
      <div style={{display:"flex",gap:6,padding:"8px 12px",flexShrink:0}}>
        {[1,2,3].map(i=>{
          const isActive = turnOrder[currentTurn]===i && phase==="playing";
          return (
            <div key={i} style={{
              flex:1,background:isActive?"rgba(75,195,175,0.14)":"rgba(255,255,255,0.04)",
              border:`1px solid ${isActive?VM.tealLight+"55":"rgba(75,195,175,0.10)"}`,
              borderRadius:10,padding:"6px 8px",transition:"all 0.2s",
              boxShadow: isActive?`0 0 14px ${VM.tealLight}1f`:"none",
            }}>
              <div style={{display:"flex",alignItems:"center",gap:4,marginBottom:4}}>
                <span style={{fontSize:14}}>{AI_PERSONAS[i-1].emoji}</span>
                <span style={{fontSize:10,color:"#ffffffcc",fontWeight:700,fontFamily:FONT_UI}}>{AI_NAMES[i-1]}</span>
                {isActive&&<span style={{fontSize:8,color:VM.tealLight,marginLeft:"auto",animation:"pulse 1s infinite",fontFamily:FONT_UI}}>thinking…</span>}
              </div>
              {/* Fanned face-down cards for AI */}
              <div style={{display:"flex",position:"relative",height:22,marginLeft:2}}>
                {(hands[i]||[]).map((_,ci)=>(
                  <div key={ci} style={{
                    position:"absolute",left:ci*7,
                    width:14,height:20,borderRadius:2,
                    border:"1.5px solid #fff",
                    boxShadow:"0 1px 3px #00000033",
                    zIndex:ci,
                    overflow:"hidden",
                    imageRendering:"pixelated",
                  }}>
                    <PixelCardBack theme={deckTheme} w={14} h={20}/>
                  </div>
                ))}
              </div>
            </div>
          );
        })}
      </div>

      {/* TRICK AREA — flexes to fill leftover vertical space; centered content */}
      <div style={{
        display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
        padding:"6px 12px 8px",
        background:`radial-gradient(ellipse at 50% 50%,${VM.tealLight}0d,transparent 70%)`,
        flex:"1 1 auto",
        minHeight: 190, // never smaller than this (label + ledSuit + cards)
        boxSizing:"border-box",
      }}>
        <div style={{color:VM.tealLight+"77",fontSize:9,letterSpacing:3,marginBottom:4,textTransform:"uppercase",fontFamily:FONT_UI,height:13,lineHeight:"13px"}}>Current Trick</div>
        {/* Led suit row — always present (reserves space); content shown only when ledSuit set */}
        <div style={{height:22,marginBottom:10,display:"flex",alignItems:"center",justifyContent:"center"}}>
          {ledSuit && (
            <div style={{color:VM.tealLight,fontSize:11,fontWeight:700,fontFamily:FONT_UI}}>
              Led suit: <span style={{fontSize:16}}>{ledSuit}</span>
            </div>
          )}
        </div>
        {/* Cards row — fixed height matches a mobile card (115) + name label (~14) */}
        <div ref={trickAreaRef} style={{display:"flex",gap:10,justifyContent:"center",height:130,alignItems:"center",flexWrap:"nowrap"}}>
          {trickPlays.length===0 ? (
            <div style={{color:"#ffffff1a",fontSize:12,fontStyle:"italic",fontFamily:FONT_UI}}>Waiting for first card…</div>
          ) : (
            trickPlays.map((p,i)=>(
              <div key={`${p.playerIdx}-${p.card.id}`} style={{
                textAlign:"center",
                animation:"cardLand 0.28s cubic-bezier(0.2,0.8,0.3,1)",
              }}>
                <CardComp card={p.card} played/>
                <div style={{color:VM.tealLight+"99",fontSize:9,marginTop:4,letterSpacing:1,fontFamily:FONT_UI}}>{allNames[p.playerIdx]}</div>
              </div>
            ))
          )}
        </div>
      </div>

      {/* SPACER — small visual gap; fan wrapper's paddingTop provides headroom for the lifted card */}
      <div style={{ height:16, flexShrink:0 }} />

      {/* PLAYER HAND — fixed-height block so the row never jumps */}
      <div style={{
        flexShrink:0,
        display:"flex",flexDirection:"column",
        padding:"4px 10px 16px",
        height: 226, // fixed: label 14 + fan paddingTop 36 + cards 125 + indicator/button row 42 + slack
        boxSizing:"border-box",
      }}>
        <div style={{
          color: isPlayerTurn?VM.tealLight:"#ffffff44",
          fontSize:9,letterSpacing:2,
          textTransform:"uppercase",textAlign:"center",marginBottom:4,
          fontWeight:700, flexShrink:0, fontFamily:FONT_UI,
          height:14, lineHeight:"14px",
        }}>
          {isPlayerTurn ? mustOpenWith2C ? "Play the 2♣ to open" : "Your Turn — Tap a Card" : `${allNames[turnOrder[currentTurn]]}'s Turn`}
        </div>

        {/* FANNED HAND */}
        <div ref={handAreaRef} style={{
          overflowX:"hidden",
          overflowY:"visible",
          paddingTop:36, // headroom for the lifted selected card (which rises 20px)
          flexShrink:0,
        }}>
          <div style={{
            position:"relative",
            height: 125, // taller cards (115px) + 10px bottom padding for lift
            width:"100%",
            display:"flex",
            alignItems:"flex-end",
            justifyContent:"center",
          }}>
          {(() => {
            // Compute fan layout based on the STARTING hand size (always 13 at deal time),
            // not the current hand size. This way overlap stays constant as cards are played,
            // and the row doesn't slide/expand on each play.
            const total = playerHand.length;
            const cardW = 80;
            const SAFETY = 20; // px of breathing room on each side
            const STARTING_HAND_SIZE = 13;
            const availW = (typeof window !== 'undefined' ? window.innerWidth : 360) - SAFETY * 2;
            // Lock overlap to what it would be at full hand size (13 cards).
            const maxOverlap = Math.floor((availW - cardW) / (STARTING_HAND_SIZE - 1));
            const OVERLAP = Math.min(22, Math.max(8, maxOverlap));
            const totalWidth = OVERLAP * (total - 1) + cardW;
            const startX = -totalWidth / 2;
            const selIdx = playerHand.findIndex(c => c.id === selectedCard?.id);
            return playerHand.map((card, ci) => {
              const isLegal = mustOpenWith2C
                ? (card.rank==="2" && card.suit==="♣")
                : card.isJoker
                ? true
                : trickPlays.length === 0
                ? (!isDiamond(card) || canLeadDiamond)
                : (!ledSuit || card.suit===ledSuit || !playerHand.some(c=>!c.isJoker&&c.suit===ledSuit));
              const isSelected = selectedCard?.id === card.id;
              // Neighbor spread: cards near the selected one ease outward to make room.
              let spread = 0;
              if (selIdx >= 0 && !isSelected) {
                const dist = ci - selIdx;
                const mag = Math.max(0, 10 - Math.abs(dist) * 3); // falls off with distance
                spread = dist > 0 ? mag : -mag;
              }
              const xPos = startX + ci * OVERLAP + spread;
              const showGlow = isPlayerTurn && isLegal && !isSelected;

              return (
                <div
                  key={card.id}
                  onClick={isPlayerTurn ? ()=>setSelectedCard(isSelected ? null : card) : undefined}
                  style={{
                    position:"absolute",
                    left:`calc(50% + ${xPos}px)`,
                    bottom: isSelected ? 20 : 0,
                    zIndex: isSelected ? total + 10 : ci,
                    cursor: isPlayerTurn ? "pointer" : "default",
                    transition:"bottom 0.15s ease, left 0.18s ease, filter 0.2s ease",
                    filter: (!isPlayerTurn || !isLegal)
                      ? "brightness(0.55)"
                      : showGlow
                      ? "drop-shadow(0 0 0 rgba(75,195,175,0))"
                      : "none",
                    animation: dealing
                      ? `dealIn 0.42s cubic-bezier(0.2,0.8,0.3,1) ${ci*0.06}s both`
                      : showGlow ? `legalRipple 2.4s ease-in-out ${ci*0.12}s infinite` : "none",
                    // deck origin: cards fly up from bottom-center
                    "--deal-dx": `${-xPos*0.5}px`,
                    "--deal-dy": "120px",
                    "--deal-rot": `${(ci-6)*1.5}deg`,
                  }}
                >
                  <CardComp
                    card={card}
                    selected={isSelected}
                    dimmed={false}
                    deckTheme={deckTheme}
                  />
                </div>
              );
            });
          })()}
          {playerHand.length===0 && (
            <div style={{color:"#00000044",fontSize:12,fontStyle:"italic"}}>No cards left</div>
          )}
          </div>
        </div>

        <div style={{display:"flex",justifyContent:"center",gap:10,marginTop:6,height:42,alignItems:"center",flexShrink:0}}>
          {selectedCard && isPlayerTurn && (
            <div style={{
              background:VM.tealLight+"14",border:`1px solid ${VM.tealLight}33`,
              borderRadius:8,padding:"5px 12px",
              color:VM.tealLight+"aa",fontSize:11,fontWeight:700,fontFamily:FONT_UI,
              display:"flex",alignItems:"center",gap:6,
            }}>
              Playing: <strong style={{color:VM.tealLight}}>{selectedCard.isJoker?"🃏 Joker":selectedCard.rank+selectedCard.suit}</strong>
              {!selectedIsLegal&&<span style={{color:"#ff6666",fontSize:10}}>{mustOpenWith2C?" ✗ must open with 2♣":" ✗ must follow "+ledSuit}</span>}
            </div>
          )}
          <GoldBtn
            onClick={()=>{ if(selectedCard&&selectedIsLegal) playCard(selectedCard); }}
            disabled={!canPlay||!selectedIsLegal}
          >
            {isPlayerTurn ? "Play Card" : "Waiting…"}
          </GoldBtn>
        </div>
      </div>

      {/* MODALS */}
      {phase==="kidnap"&&kidnapState&&kidnapState.jokerPlayerIdx===0&&(
        <KidnapModal
          hands={hands}
          jokerPlayerIdx={0}
          allNames={allNames}
          onSteal={handleKidnap}
          deckTheme={deckTheme}
        />
      )}

      {phase==="rescue"&&rescueState&&rescueState.acePlayerIdx===0&&(
        <RescueModal
          hands={hands}
          acePlayerIdx={0}
          allNames={allNames}
          onRescue={handleRescue}
          deckTheme={deckTheme}
        />
      )}

      {/* Aces Low — offer modal (only when it's the human's choice) */}
      {phase==="aceslow_offer" && acesLowState && acesLowState.playerIdx === 0 && (
        <div style={{
          position:"fixed", inset:0,
          background:"rgba(4,18,15,0.78)",
          display:"flex", alignItems:"center", justifyContent:"center",
          zIndex:200, padding:16,
          backdropFilter:"blur(4px)", WebkitBackdropFilter:"blur(4px)",
        }}>
          <div style={{
            background:"linear-gradient(155deg,#0f3c38,#08231f)",
            border:`2.5px solid #0a0a0a`,
            borderRadius:20, padding:"28px 32px",
            maxWidth:400, width:"100%",
            boxShadow:`0 0 40px #00000088, 0 20px 60px #000000cc`,
            textAlign:"center",
            display:"flex", flexDirection:"column", alignItems:"center",
          }}>
            <div style={{fontSize:40, marginBottom:8, lineHeight:1}}>✈️</div>
            <div style={{
              color:VM.goldBright,
              fontSize:13, fontWeight:900,
              letterSpacing:3, textTransform:"uppercase",
              fontFamily:FONT_DISPLAY, marginBottom:16,
              textShadow:`0 0 12px ${VM.gold}44`,
            }}>Aces Low</div>
            <div style={{
              width:"100%",
              display:"flex", flexDirection:"column",
              alignItems:"center", gap:12,
            }}>
              <div style={{color:"#fff",fontSize:18,fontWeight:800,fontFamily:FONT_DISPLAY}}>
                You've gathered all four aces.
              </div>
              <div style={{color:"#e2c97ecc",fontSize:13,fontFamily:FONT_UI,fontStyle:"italic",lineHeight:1.5}}>
                Cash in for <strong style={{color:VM.gold,fontStyle:"normal"}}>+{ACES_LOW_BONUS} pts</strong>,<br/>
                or hold them for a chance at bigger sets.
              </div>
            </div>
            <div style={{display:"flex", gap:10, marginTop:20}}>
              <button onClick={declineAcesLow} style={{
                background:"transparent",
                color:VM.tealLight,
                border:`1.5px solid ${VM.tealLight}66`,
                borderRadius:10, padding:"12px 22px",
                fontSize:13, fontWeight:900, cursor:"pointer",
                letterSpacing:2, textTransform:"uppercase",
                fontFamily:FONT_DISPLAY,
              }}>Hold</button>
              <button onClick={acceptAcesLow} style={{
                background:`linear-gradient(135deg,${VM.gold},#c9a84c)`,
                color:"#0a2320", border:"none", borderRadius:10,
                padding:"12px 28px", fontSize:13,
                fontWeight:900, cursor:"pointer",
                letterSpacing:2, textTransform:"uppercase",
                fontFamily:FONT_DISPLAY,
                boxShadow:`0 4px 14px ${VM.gold}33`,
              }}>Cash It +{ACES_LOW_BONUS}</button>
            </div>
          </div>
        </div>
      )}

      {/* Aces Low — cash-in event box (after cashing, before play resumes) */}
      {phase==="aceslow_event" && acesLowState && (
        <EventBox
          borderColor="#0a0a0a"
          emoji="✈️"
          title="Aces Low!"
          btnLabel="PROCEED"
          onContinue={dismissAcesLowEvent}
        >
          <div style={{color:"#fff",fontSize:22,fontWeight:800,fontFamily:FONT_DISPLAY}}>
            {allNames[acesLowState.playerIdx]}
          </div>
          <div style={{color:"#e2c97ecc",fontSize:13,fontFamily:FONT_UI,fontStyle:"italic"}}>
            Four aces gathered — cashed in for the bonus.
          </div>
          <div style={{
            background:"rgba(10,10,10,0.4)", border:"1px solid #ffffff22",
            borderRadius:10, padding:"8px 20px", display:"inline-block",
          }}>
            <span style={{color:VM.gold,fontSize:16,fontWeight:800,fontFamily:FONT_DISPLAY}}>+{ACES_LOW_BONUS} pts ✈️</span>
          </div>
        </EventBox>
      )}

      {phase==="trickresult"&&trickResult&&(
        <TrickResultModal
          result={trickResult}
          allNames={allNames}
          onContinue={afterTrickResult}
          isGameOver={pendingFireworks || totalScores.some(s=>s>=WIN_SCORE)}
          isHandOver={trickResult?.americanFamily || hands.every(h=>h.length===0)}
        />
      )}

      {phase==="roundover"&&(
        <RoundOverModal
          scores={totalScores}
          allNames={allNames}
          roundScores={roundScores}
          onContinue={startNextRound}
        />
      )}

      {phase==="gameover"&&(
        <GameOverModal
          scores={totalScores}
          allNames={allNames}
          onRestart={()=>{ setScreen("menu"); }}
        />
      )}

      {showRules&&<RulesPanel onClose={()=>setShowRules(false)}/>}

      {/* CUTTING YOUR TEETH — interrupts immediately when a diamond is played */}
      {phase==="cuttingteeth_interrupt" && (
        <EventBox
          borderColor="#cc1111"
          emoji="💎"
          title="Cutting Your Teeth!"
          btnLabel="PROCEED"
          onContinue={() => {
            const cont = pendingPlayContinuation;
            setPendingPlayContinuation(null);
            setPhase("playing");
            if (cont) continuePlayFlow(cont.playerIdx, cont.card, cont.newPlays, cont.newHands);
          }}
        >
          <div style={{
            color:"#e2c97ecc", fontSize:14,
            fontFamily:FONT_UI, lineHeight:1.9,
          }}>
            Dimonds are broken<br/>
            <span style={{color:"#e2c97e",fontWeight:700}}>— dimonds become trump suit!</span>
          </div>
        </EventBox>
      )}

      {/* FIREWORKS */}
      {showFireworks && (
        <Fireworks onDone={()=>{ setShowFireworks(false); setPhase("gameover"); }}/>
      )}

      <style>{`
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
        @keyframes slideIn { from{opacity:0;transform:translateX(-50%) translateY(-10px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
        @keyframes pop { 0%{transform:scale(0.5);opacity:0} 60%{transform:scale(1.2)} 100%{transform:scale(1);opacity:1} }
        /* Card lands into the trick — drops in from above with a slight settle */
        @keyframes cardLand {
          0% { opacity:0; transform:translateY(-46px) scale(1.08); }
          70% { opacity:1; transform:translateY(3px) scale(1.0); }
          100% { opacity:1; transform:translateY(0) scale(1.0); }
        }
        /* Legal-card hint — a soft teal glow that breathes */
        @keyframes legalGlow {
          0%,100% { box-shadow:0 2px 10px #00000033, 0 0 0px rgba(75,195,175,0); }
          50% { box-shadow:0 2px 10px #00000033, 0 0 14px rgba(75,195,175,0.55); }
        }
        @keyframes legalRipple {
          0%,100% { filter: drop-shadow(0 0 0 rgba(75,195,175,0)); }
          50% { filter: drop-shadow(0 0 6px rgba(75,195,175,0.6)); }
        }
        /* Trick cards sweep away toward the winner */
        @keyframes trickSweep {
          0% { opacity:1; transform:scale(1) translate(0,0); }
          100% { opacity:0; transform:scale(0.6) translate(0,-40px); }
        }
        /* Deal-out — card flies in from the deck origin */
        @keyframes dealIn {
          from { opacity:0; transform:translate(var(--deal-dx,0), var(--deal-dy,-200px)) scale(0.7) rotate(var(--deal-rot,0deg)); }
          to { opacity:1; transform:translate(0,0) scale(1) rotate(0deg); }
        }
        ::-webkit-scrollbar { width: 0; height: 0; background: transparent; }
        * { scrollbar-width: none; }
      `}</style>
    </div>
  );
}

const _container = document.getElementById("root");
const _root = ReactDOM.createRoot(_container);
_root.render(React.createElement(DiamondsGame));
</script>
</body>
</html>
