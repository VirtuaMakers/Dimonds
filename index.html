// React hooks pulled from global scope (CDN bundle)
const { useState, useEffect, useCallback, useRef } = React;
// ============================================================
// SOUND ENGINE — Web Audio API
// ============================================================
function createAudioCtx() {
  try { return new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { return null; }
}
let _audioCtx = null;
function getAudioCtx() {
  if (!_audioCtx) _audioCtx = createAudioCtx();
  if (_audioCtx?.state === "suspended") _audioCtx.resume();
  return _audioCtx;
}

// Global sound on/off flag — toggled by the speaker icon in the top bar
let SOUND_ENABLED = true;
function setSoundEnabled(v) { SOUND_ENABLED = !!v; }
function isSoundEnabled() { return SOUND_ENABLED; }

function playTone({ freq=440, type="sine", duration=0.18, volume=0.18, attack=0.01, decay=0.15, delay=0 }) {
  if (!SOUND_ENABLED) return;
  const ctx = getAudioCtx(); if (!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain); gain.connect(ctx.destination);
  osc.type = type;
  osc.frequency.value = freq;
  const t = ctx.currentTime + delay;
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(volume, t + attack);
  gain.gain.exponentialRampToValueAtTime(0.001, t + attack + decay);
  osc.start(t); osc.stop(t + attack + decay + 0.05);
}

// Muted plonk when any card is played
function soundCardPlay() {
  playTone({ freq:220, type:"triangle", duration:0.2, volume:0.28, attack:0.005, decay:0.18 });
  playTone({ freq:165, type:"triangle", duration:0.15, volume:0.20, attack:0.005, decay:0.12, delay:0.03 });
}

// Jingly sound when trick won with diamonds
function soundDiamondTrick() {
  [523, 659, 784, 1047].forEach((f, i) =>
    playTone({ freq:f, type:"sine", volume:0.13, attack:0.01, decay:0.18, delay:i*0.07 })
  );
}

// Victorious plonk when round is complete
function soundRoundWin() {
  [392, 494, 587, 740, 988].forEach((f, i) =>
    playTone({ freq:f, type:"triangle", volume:0.16, attack:0.01, decay:0.28, delay:i*0.09 })
  );
}

// American Family — 5 note bright triumphant celebration
function soundAmericanFamily() {
  [523, 659, 784, 880, 1047].forEach((f, i) =>
    playTone({ freq:f, type:"sine", volume:0.2, attack:0.01, decay:0.4, delay:i*0.11 })
  );
  [262, 330].forEach((f, i) =>
    playTone({ freq:f, type:"triangle", volume:0.15, attack:0.02, decay:0.5, delay:i*0.14 })
  );
}

// Ace of Spades success — 5 note darker, minor-ish melody
function soundAceSuccess() {
  [330, 277, 311, 262, 220].forEach((f, i) =>
    playTone({ freq:f, type:"triangle", volume:0.18, attack:0.01, decay:0.38, delay:i*0.11 })
  );
  [110, 131].forEach((f, i) =>
    playTone({ freq:f, type:"sawtooth", volume:0.12, attack:0.02, decay:0.5, delay:i*0.15 })
  );
}

// Ace of Spades Rescue — heroic yet dark 5-note melody
// E3 → G3 → B3 → C4 → G3, brass-like timbre with octave-below shadow
function soundAceRescue() {
  const notes = [164.81, 196.00, 246.94, 261.63, 196.00];
  notes.forEach((f, i) => {
    // Heroic brass-like layer
    playTone({ freq:f, type:"sawtooth", volume:0.15, attack:0.015, decay:0.42, delay:i*0.11 });
    // Warm body
    playTone({ freq:f, type:"triangle", volume:0.18, attack:0.01,  decay:0.40, delay:i*0.11 });
    // Dark octave-below shadow for gravitas
    playTone({ freq:f/2, type:"sine",   volume:0.14, attack:0.02,  decay:0.45, delay:i*0.11 });
  });
}

// Cutting Your Teeth — first diamond played
function soundCuttingYourTeeth() {
  playTone({ freq:440, type:"sawtooth", volume:0.1, attack:0.005, decay:0.08 });
  playTone({ freq:330, type:"sawtooth", volume:0.08, attack:0.005, decay:0.12, delay:0.06 });
  playTone({ freq:220, type:"triangle", volume:0.12, attack:0.01, decay:0.2, delay:0.1 });
}

// Joker Kidnaps — sneaky descending heist sting
function soundJokerKidnaps() {
  [466, 392, 311, 233].forEach((f, i) =>
    playTone({ freq:f, type:"triangle", volume:0.15, attack:0.01, decay:0.22, delay:i*0.08 })
  );
  playTone({ freq:147, type:"sawtooth", volume:0.1, attack:0.02, decay:0.4, delay:0.32 });
}

// ============================================================
// FIREWORKS COMPONENT
// ============================================================
// Firework boom — deep, low, loud
function soundFireworkBoom() {
  // Low sub-bass thud
  playTone({ freq:55,  type:"sine",     volume:0.55, attack:0.005, decay:0.55 });
  // Mid-low body
  playTone({ freq:110, type:"triangle", volume:0.40, attack:0.005, decay:0.45, delay:0.01 });
  // Subtle high crack for sparkle
  playTone({ freq:880, type:"square",   volume:0.10, attack:0.001, decay:0.08, delay:0.005 });
}

function Fireworks({ onDone }) {
  const canvasRef = useRef(null);
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const particles = [];
    // Whites and golds only — elegant, refined palette
    const colors = ["#ffffff","#fff8e0","#fceabb","#e2c97e","#c9a84c","#f4d97a","#fff2c4"];

    function spawnBurst(x, y) {
      // More particles, slower outward velocity → softer, longer cascade
      const count = 70;
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + Math.random() * 0.05;
        // Gentler initial velocity — explosion is graceful, not violent
        const speed = 1.2 + Math.random() * 2.2;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 0.5, // slight upward initial bias
          color: colors[Math.floor(Math.random() * colors.length)],
          life: 1,
          // Slower decay → particles linger and waterfall down
          decay: 0.004 + Math.random() * 0.006,
          size: 2.5 + Math.random() * 3.5,
          // Each particle gets a slight twinkle phase
          twinkle: Math.random() * Math.PI * 2,
        });
      }
    }

    // More bursts, scattered across the screen
    const burstPositions = [
      [canvas.width * 0.20, canvas.height * 0.25],
      [canvas.width * 0.75, canvas.height * 0.22],
      [canvas.width * 0.50, canvas.height * 0.35],
      [canvas.width * 0.30, canvas.height * 0.45],
      [canvas.width * 0.70, canvas.height * 0.50],
      [canvas.width * 0.45, canvas.height * 0.20],
      [canvas.width * 0.85, canvas.height * 0.40],
      [canvas.width * 0.15, canvas.height * 0.55],
    ];
    let burstIdx = 0;
    // Slower interval between bursts — let each one breathe and cascade
    const burstTimer = setInterval(() => {
      if (burstIdx < burstPositions.length) {
        spawnBurst(...burstPositions[burstIdx++]);
        soundFireworkBoom();
      } else clearInterval(burstTimer);
    }, 550);

    let animId;
    let frameCount = 0;
    function animate() {
      // Slightly slower fade so trails persist longer (waterfall effect)
      ctx.fillStyle = "rgba(0,0,0,0.08)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      frameCount++;
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy;
        // Lighter gravity → waterfall cascade is gentle, not a fast plunge
        p.vy += 0.05;
        // Air drag — slows horizontal travel for that floaty waterfall feel
        p.vx *= 0.992;
        p.life -= p.decay;
        if (p.life <= 0) { particles.splice(i, 1); continue; }

        // Twinkle: vary brightness slightly per frame
        const tw = 0.85 + 0.15 * Math.sin(frameCount * 0.18 + p.twinkle);
        ctx.globalAlpha = p.life * tw;
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
      if (particles.length > 0 || burstIdx < burstPositions.length) {
        animId = requestAnimationFrame(animate);
      } else {
        setTimeout(onDone, 800);
      }
    }
    animId = requestAnimationFrame(animate);
    return () => { cancelAnimationFrame(animId); clearInterval(burstTimer); };
  }, []);

  return (
    <canvas ref={canvasRef} style={{
      position:"fixed", inset:0, zIndex:500, pointerEvents:"none",
    }}/>
  );
}

function PixelCardBack({ theme, w, h }) {
  const tiny = w < 45;
  const px = tiny ? 3 : 5; // pixel block size

  if (theme === "spring") return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} style={{position:"absolute",inset:0,display:"block"}}>
      <rect width={w} height={h} fill="#88cc44"/>
      {/* Pixel flower grid */}
      {[0,1,2,3,4,5].map(row=>[0,1,2,3,4,5,6].map(col=>{
        const x = col*(px+1)+2, y = row*(px+2)+2;
        const isPetal = (row+col)%3===0;
        const isCenter = (row+col)%5===0;
        return <rect key={`${row}-${col}`} x={x} y={y} width={px} height={px}
          fill={isCenter?"#ffee00":isPetal?"#ff88cc":"#55aa22"} opacity={0.9}/>;
      }))}
      {/* Border */}
      <rect x={1} y={1} width={w-2} height={h-2} fill="none" stroke="#ffffff55" strokeWidth={1}/>
      <rect x={3} y={3} width={w-6} height={h-6} fill="none" stroke="#ffffff33" strokeWidth={1}/>
    </svg>
  );

  if (theme === "summer") return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} style={{position:"absolute",inset:0,display:"block"}}>
      <rect width={w} height={h} fill="#0066cc"/>
      {/* Sky gradient blocks */}
      {[0,1,2].map(row=><rect key={row} x={0} y={row*(h/6)} width={w} height={h/6} fill={`hsl(210,80%,${55+row*8}%)`} opacity={0.7}/>)}
      {/* Sun */}
      <rect x={w/2-px} y={px} width={px*2} height={px*2} fill="#ffdd00"/>
      <rect x={w/2-px*2} y={px*2} width={px} height={px} fill="#ffdd00"/>
      <rect x={w/2+px} y={px*2} width={px} height={px} fill="#ffdd00"/>
      {/* Wave rows */}
      {[0,1,2,3].map(i=>(
        <g key={i}>
          {[0,1,2,3,4,5].map(j=>(
            <rect key={j} x={j*(px+1)+2} y={h-px*3-i*(px+1)} width={px} height={px}
              fill={(i+j)%2===0?"#55ccff":"#0099ee"} opacity={0.85}/>
          ))}
        </g>
      ))}
      {/* Palm tree hint */}
      <rect x={px} y={h/2} width={px-1} height={h/3} fill="#886633"/>
      <rect x={px-px} y={h/2-px} width={px*3} height={px} fill="#44aa22"/>
      <rect x={0} y={h/2-px*2} width={px*4} height={px} fill="#44aa22" opacity={0.7}/>
      <rect x={1} y={1} width={w-2} height={h-2} fill="none" stroke="#ffffff44" strokeWidth={1}/>
    </svg>
  );

  if (theme === "autumn") return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} style={{position:"absolute",inset:0,display:"block"}}>
      <rect width={w} height={h} fill="#884411"/>
      {/* Pixel leaf scatter */}
      {[0,1,2,3,4,5,6,7].map(row=>[0,1,2,3,4,5].map(col=>{
        const x = col*(px+1)+1, y = row*(px+1)+1;
        const colors = ["#dd6600","#ff8800","#cc4400","#ffaa00","#993300"];
        const c = colors[(row*3+col)%colors.length];
        const skip = (row+col)%4===0;
        if (skip) return null;
        return <rect key={`${row}-${col}`} x={x} y={y} width={px} height={px} fill={c} opacity={0.9}/>;
      }))}
      {/* Ground strip */}
      <rect x={0} y={h-px*2} width={w} height={px*2} fill="#663300"/>
      <rect x={1} y={1} width={w-2} height={h-2} fill="none" stroke="#ffcc6644" strokeWidth={1}/>
      <rect x={3} y={3} width={w-6} height={h-6} fill="none" stroke="#ffcc6633" strokeWidth={1}/>
    </svg>
  );

  // Winter
  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} style={{position:"absolute",inset:0,display:"block"}}>
      <rect width={w} height={h} fill="#224477"/>
      {/* Snowflake pixel grid */}
      {[0,1,2,3,4,5,6].map(row=>[0,1,2,3,4,5].map(col=>{
        const x = col*(px+1)+1, y = row*(px+1)+1;
        const isCross = col===2||row===2;
        const isDot = (row+col)%3===0;
        return <rect key={`${row}-${col}`} x={x} y={y} width={px} height={px}
          fill={isCross?"#aaddff":isDot?"#ffffff":"#3366aa"} opacity={isCross?0.9:isDot?0.7:0.5}/>;
      }))}
      {/* Snow ground */}
      <rect x={0} y={h-px*2} width={w} height={px*2} fill="#cceeff" opacity={0.6}/>
      <rect x={1} y={1} width={w-2} height={h-2} fill="none" stroke="#aaddff55" strokeWidth={1}/>
      <rect x={3} y={3} width={w-6} height={h-6} fill="none" stroke="#aaddff33" strokeWidth={1}/>
    </svg>
  );
}

function sortHand(hand) {
  return [...hand].sort((a, b) => {
    if (a.isJoker) return 1;  // Joker always last
    if (b.isJoker) return -1;
    const suitDiff = HAND_SUIT_ORDER[a.suit] - HAND_SUIT_ORDER[b.suit];
    if (suitDiff !== 0) return suitDiff;
    return RANK_VALUE[a.rank] - RANK_VALUE[b.rank]; // low to high within suit
  });
}

// DECK HELPERS
// ============================================================
function buildDeck() {
  const cards = [];
  for (const s of SUITS) {
    for (const r of RANKS) {
      cards.push({ suit:s, rank:r, id:`${r}${s}`, isJoker:false });
    }
  }
  cards.push({ suit:"🃏", rank:"🃏", id:"JOKER", isJoker:true });
  return cards;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function cardRankVal(card) {
  if (card.isJoker) return 99;
  return RANK_VALUE[card.rank];
}
function cardSuitVal(card) {
  if (card.isJoker) return 99;
  return SUIT_VALUE[card.suit];
}
function isBatman(card) { return !card.isJoker && card.rank==="A" && card.suit==="♠"; }
function isDiamond(card) { return !card.isJoker && card.suit==="♦"; }
function diamondPoints(card) {
  if (!isDiamond(card)) return 0;
  if (card.rank==="K") return 5;
  if (card.rank==="Q") return 4;
  if (card.rank==="J") return 3;
  if (card.rank==="A") return 2;
  return 1;
}

function dealCards() {
  const deck = shuffle(buildDeck()); // 53 cards
  // Deal: one player gets 14, others get 13. Rotate by round elsewhere.
  const hands = [[],[],[],[]];
  deck.forEach((c,i) => hands[i%4].push(c));
  return hands;
}

// Who leads: player holding 2♣
function findLeader(hands) {
  for (let i=0; i<4; i++) {
    if (hands[i].find(c => c.rank==="2" && c.suit==="♣")) return i;
  }
  return 0;
}

// American Family check: J♦ Q♦ K♦ A♦ all in hand
function checkAmericanFamily(hand) {
  const needed = ["J♦","Q♦","K♦","A♦"];
  return needed.every(id => hand.find(c => c.id===id));
}

// Determine trick winner index (within trick players array)
function resolveTrick(plays, trumpBroken=true) {
  const ledSuit = plays[0].card.isJoker ? null : plays[0].card.suit;
  const jokerPlay = plays.find(p => p.card.isJoker);
  const batmanPlay = plays.find(p => isBatman(p.card));

  if (jokerPlay && !batmanPlay) {
    return { winnerIdx: jokerPlay.playerIdx, jokerWin: true, jokerPlayerIdx: jokerPlay.playerIdx };
  }
  if (jokerPlay && batmanPlay) {
    return { winnerIdx: batmanPlay.playerIdx, jokerWin: false, batmanWin: true };
  }
  return resolveNormal(plays, ledSuit, trumpBroken);
}

function resolveNormal(plays, ledSuit, trumpBroken=true) {
  // Diamonds are trump — if any diamond is played and diamonds are broken,
  // highest diamond wins (regardless of led suit), unless Joker is in play
  const diamondPlays = plays.filter(p => !p.card.isJoker && isDiamond(p.card));
  if (trumpBroken && diamondPlays.length > 0 && ledSuit !== "♦") {
    // Trump overrides — highest diamond wins
    let winner = diamondPlays[0];
    for (let i=1; i<diamondPlays.length; i++) {
      if (cardRankVal(diamondPlays[i].card) > cardRankVal(winner.card)) winner = diamondPlays[i];
    }
    return { winnerIdx: winner.playerIdx, jokerWin: false };
  }
  // Normal: highest card of led suit wins
  const followers = ledSuit ? plays.filter(p => !p.card.isJoker && p.card.suit === ledSuit) : plays;
  const pool = followers.length > 0 ? followers : plays.filter(p => !p.card.isJoker);
  if (pool.length === 0) return { winnerIdx: plays[0].playerIdx, jokerWin: false };
  let winner = pool[0];
  for (let i=1; i<pool.length; i++) {
    const p = pool[i];
    if (cardRankVal(p.card) > cardRankVal(winner.card)) winner = p;
    else if (cardRankVal(p.card) === cardRankVal(winner.card) && cardSuitVal(p.card) > cardSuitVal(winner.card)) winner = p;
  }
  return { winnerIdx: winner.playerIdx, jokerWin: false };
}

// ============================================================
// AI LOGIC — Maximum difficulty
// ============================================================

// AI role rotation per round — cycles 1→2→3→1→2→3...
// Role A: Family hunter, Role B: Ace hunter, Role C: Pure strong play
function aiRoleForRound(playerIdx, roundNum) {
  // Each round, roles shift: round 1: [A,B,C], round 2: [C,A,B], round 3: [B,C,A]
  const roles = ["family","ace","strong"];
  return roles[(playerIdx - 1 + (roundNum - 1)) % 3];
}

// Score a card's value for winning a trick (higher = better to win with)
function cardScore(card) {
  if (card.isJoker) return 200;
  return cardRankVal(card) * 4 + cardSuitVal(card);
}

// Best card to steal: highest value diamond first, then highest non-diamond
function bestCardToSteal(hand) {
  const diamonds = hand.filter(c => isDiamond(c));
  if (diamonds.length > 0) return diamonds.reduce((a,b) => diamondPoints(b) > diamondPoints(a) ? b : a);
  const nonJoker = hand.filter(c => !c.isJoker);
  if (nonJoker.length > 0) return nonJoker.reduce((a,b) => cardScore(b) > cardScore(a) ? b : a);
  return hand[0];
}

function aiChooseCard(hand, role, trickPlays, ledSuit, gameState) {
  if (hand.length === 0) return null;

  const joker = hand.find(c => c.isJoker);
  const batman = hand.find(c => isBatman(c));
  const trickHasJoker = trickPlays.some(p => p.card.isJoker);
  const trickHasBatman = trickPlays.some(p => isBatman(p.card));
  const trickDiamondPoints = trickPlays.filter(p => isDiamond(p.card)).reduce((s,p) => s+diamondPoints(p.card), 0);
  const familyIds = ["J♦","Q♦","K♦","A♦"];
  const familyInHand = hand.filter(c => familyIds.includes(c.id));

  // Helper: can the Ace of Spades legally be played right now?
  // Rule: must follow suit if possible. The Ace can be played freely only when:
  //   (a) led suit is spades (Ace IS spades — always legal), OR
  //   (b) no led suit at all (you're the leader, or Joker led), OR
  //   (c) hand has no cards of the led suit (so you're off-suit anyway).
  const canPlayBatmanLegally = !ledSuit
    || ledSuit === "♠"
    || !hand.some(c => !c.isJoker && c.suit === ledSuit);

  // ---- ACE HUNTER: hold Batman, wait for Joker ----
  if (role === "ace" && batman) {
    // Play A♠ if Joker is in the trick AND it's legal to play (follows-suit rules respected)
    if (trickHasJoker && !trickHasBatman && canPlayBatmanLegally) return batman;
    // Otherwise protect A♠ — never discard it, play anything else
    const mustFollow = ledSuit ? hand.filter(c => !c.isJoker && c.suit === ledSuit) : [];
    const mustFollowNoBatman = mustFollow.filter(c => !isBatman(c));
    if (mustFollowNoBatman.length > 0) return mustFollowNoBatman.sort((a,b) => cardScore(a)-cardScore(b))[0];
    if (mustFollow.length > 0) return mustFollow.filter(c => !isBatman(c))[0] || mustFollow[0];
    const safe = hand.filter(c => !isBatman(c) && !c.isJoker);
    if (safe.length > 0) return safe.sort((a,b) => cardScore(a)-cardScore(b))[0];
  }

  // ---- FAMILY HUNTER: protect J♦ Q♦ K♦ A♦, use Joker to steal them ----
  if (role === "family" && familyInHand.length >= 2) {
    const trickHasFamilyCard = trickPlays.some(p => familyIds.includes(p.card.id));
    if (joker && trickHasFamilyCard && !trickHasBatman) return joker;
    const mustFollow = ledSuit ? hand.filter(c => !c.isJoker && c.suit === ledSuit) : [];
    const mustFollowNonFamily = mustFollow.filter(c => !familyIds.includes(c.id));
    if (mustFollowNonFamily.length > 0) return mustFollowNonFamily.sort((a,b) => cardScore(a)-cardScore(b))[0];
    if (mustFollow.length > 0) return mustFollow.sort((a,b) => cardScore(a)-cardScore(b))[0];
    const nonFamily = hand.filter(c => !familyIds.includes(c.id) && !c.isJoker);
    if (nonFamily.length > 0) return nonFamily.sort((a,b) => cardScore(a)-cardScore(b))[0];
  }

  // ---- STRONG PLAY (all roles fall through here) ----
  let currentWinner = null;
  if (trickPlays.length > 0) {
    const res = resolveTrick(trickPlays, gameState.trumpBroken ?? true);
    currentWinner = trickPlays.find(p => p.playerIdx === res.winnerIdx);
  }

  const mustFollow = ledSuit ? hand.filter(c => !c.isJoker && c.suit === ledSuit) : [];
  const canFollow = mustFollow.length > 0;

  // Only deploy the Ace of Spades against the Joker when it's LEGAL to do so
  if (batman && trickHasJoker && !trickHasBatman && canPlayBatmanLegally) return batman;
  if (joker && trickPlays.length > 0 && trickDiamondPoints >= 2 && !trickHasBatman) return joker;
  if (joker && trickPlays.length === 0 && hand.length <= 4) return joker;

  if (canFollow) {
    const sorted = mustFollow.sort((a,b) => cardScore(b) - cardScore(a));
    if (!currentWinner || currentWinner.playerIdx !== trickPlays[0]?.playerIdx) return sorted[0];
    return sorted[sorted.length - 1];
  }

  const safe = hand.filter(c => !isDiamond(c) && !familyIds.includes(c.id) && !c.isJoker && !isBatman(c));
  if (safe.length > 0) return safe.sort((a,b) => cardScore(a) - cardScore(b))[0];
  const dimonds = hand.filter(c => isDiamond(c) && !c.isJoker);
  if (dimonds.length > 0) return dimonds.sort((a,b) => diamondPoints(a) - diamondPoints(b))[0];
  return hand.sort((a,b) => cardScore(a)-cardScore(b))[0];
}

function aiChooseKidnapTarget(hands, playerIdx) {
  // PRIORITY 1: American Family completion.
  // If we hold 3 of {J♦,Q♦,K♦,A♦} and an opponent holds the 4th, steal it.
  // This intentionally makes the Joker→Kidnap→Family chain happen often
  // during playtesting so players see the full event sequence.
  const familyIds = ["J♦","Q♦","K♦","A♦"];
  const myHand = hands[playerIdx] || [];
  const myFamily = familyIds.filter(id => myHand.some(c => c.id === id));
  if (myFamily.length === 3) {
    const missingId = familyIds.find(id => !myFamily.includes(id));
    for (let i=0; i<4; i++) {
      if (i === playerIdx || hands[i].length === 0) continue;
      const idx = hands[i].findIndex(c => c.id === missingId);
      if (idx !== -1) {
        return { fromPlayer: i, cardIdx: idx };
      }
    }
    // 4th card not held by any opponent (shouldn't happen pre-AF-check, but safe)
  }

  // PRIORITY 2: If we hold 2 of the family, lean toward stealing a 3rd family card
  // when one is available — sets up a future Family completion attempt.
  if (myFamily.length === 2) {
    const wantedIds = familyIds.filter(id => !myFamily.includes(id));
    let bestFamily = null, bestFamilyPlayer = -1, bestFamilyIdx = -1, bestFamilyVal = -1;
    for (let i=0; i<4; i++) {
      if (i === playerIdx || hands[i].length === 0) continue;
      hands[i].forEach((card, ci) => {
        if (wantedIds.includes(card.id)) {
          const val = diamondPoints(card) * 10 + cardScore(card);
          if (val > bestFamilyVal) {
            bestFamilyVal = val; bestFamily = card; bestFamilyPlayer = i; bestFamilyIdx = ci;
          }
        }
      });
    }
    if (bestFamilyPlayer !== -1) {
      return { fromPlayer: bestFamilyPlayer, cardIdx: bestFamilyIdx };
    }
  }

  // PRIORITY 3 (fallback): pick the best card from any opponent's hand
  let bestCard = null, bestPlayer = -1, bestIdx = -1, bestVal = -1;
  for (let i=0; i<4; i++) {
    if (i === playerIdx || hands[i].length === 0) continue;
    hands[i].forEach((card, ci) => {
      const val = isDiamond(card) ? diamondPoints(card) * 10 + cardScore(card) : cardScore(card);
      if (val > bestVal) { bestVal = val; bestCard = card; bestPlayer = i; bestIdx = ci; }
    });
  }
  if (bestPlayer === -1) return null;
  return { fromPlayer: bestPlayer, cardIdx: bestIdx };
}

      transition: "transform 0.18s ease, opacity 0.2s ease, box-shadow 0.15s ease",
      display:"flex", flexDirection:"column",
      padding:"2px 3px",
      position:"relative", flexShrink:0,
      userSelect:"none", overflow:"hidden",
    }}>

      {/* ---- JOKER ---- */}
      {isJoker && (
        <>
          <div style={{
            position:"absolute", inset:0,
            borderRadius:4,
            overflow:"hidden",
            zIndex:1,
          }}>
            <img
              src={JOKER_IMG}
              style={{width:"100%", height:"100%", objectFit:"cover", display:"block"}}
              alt="The Joker"
            />
          </div>
        </>
      )}

      {/* ---- ACE OF SPADES ---- */}
      {batman && (
        <>
          <div style={{
            position:"absolute", inset:0,
            borderRadius:4,
            overflow:"hidden",
            zIndex:1,
          }}>
            <img
              src={BATMAN_IMG}
              style={{width:"100%", height:"100%", objectFit:"cover", display:"block"}}
              alt="Ace of Spades"
            />
          </div>
        </>
      )}

      {/* ---- NORMAL CARD ---- */}
      {!isJoker && !batman && (() => {
        const isFace = card.rank==="J" || card.rank==="Q" || card.rank==="K";
        const isAce = card.rank==="A";
        const idxColor = card.suit==="♦" ? "#b89a4a"
          : card.suit==="♥" ? VM.coral
          : VM.tealDeep;
        const cornerPip = tiny ? 7 : isDesktop ? 12 : 10;
        const cornerFont = tiny ? 9 : isDesktop ? 18 : 15;
        // pip area inset within the card
        const layout = PIP_LAYOUTS[card.rank] || [];
        const bodyPip = tiny ? 9 : isDesktop ? 18 : 15;

        return (
          <>
            {/* Top-left index: rank glyph + mini suit pip */}
            <div style={{
              position:"absolute", top:tiny?2:4, left:tiny?3:5,
              display:"flex", flexDirection:"column", alignItems:"center",
              lineHeight:1, zIndex:2,
            }}>
              <span style={{
                fontSize:cornerFont, fontWeight:900, color:idxColor,
                fontFamily:"'Trebuchet MS',Avenir,sans-serif",
                letterSpacing:-0.5,
              }}>{card.rank}</span>
              <div style={{marginTop:1}}><PipShape suit={card.suit} size={cornerPip}/></div>
            </div>

            {/* Bottom-right index (rotated) */}
            <div style={{
              position:"absolute", bottom:tiny?2:4, right:tiny?3:5,
              display:"flex", flexDirection:"column", alignItems:"center",
              lineHeight:1, transform:"rotate(180deg)", zIndex:2,
            }}>
              <span style={{
                fontSize:cornerFont, fontWeight:900, color:idxColor,
                fontFamily:"'Trebuchet MS',Avenir,sans-serif",
                letterSpacing:-0.5,
              }}>{card.rank}</span>
              <div style={{marginTop:1}}><PipShape suit={card.suit} size={cornerPip}/></div>
            </div>

            {/* CENTER CONTENT */}
            {isFace ? (
              card.suit === "♦" ? (
                // Diamond face card — minimalist isometric royal portrait
                <div style={{
                  position:"absolute", inset:0,
                  display:"flex", alignItems:"center", justifyContent:"center",
                }}>
                  <DiamondRoyalFace rank={card.rank} size={tiny?22:isDesktop?62:46}/>
                </div>
              ) : (
                // Other suits — geometric VM letterform (unchanged)
                <div style={{
                  position:"absolute", inset:0,
                  display:"flex", alignItems:"center", justifyContent:"center",
                }}>
                  <VMLetter ch={card.rank} suit={card.suit} size={tiny?28:isDesktop?78:58}/>
                </div>
              )
            ) : isAce ? (
              // Ace — single large showpiece pip (the gem, if a diamond)
              <div style={{
                position:"absolute", inset:0,
                display:"flex", alignItems:"center", justifyContent:"center",
              }}>
                <PipShape suit={card.suit} size={tiny?22:isDesktop?56:44}/>
              </div>
            ) : (
              // Number card — rank-many pips in rosette layout
              <div style={{
                position:"absolute",
                top:tiny?12:16, bottom:tiny?12:16,
                left:tiny?14:18, right:tiny?14:18,
              }}>
                {layout.map(([fx,fy],i)=>{
                  const lower = fy > 0.5;
                  return (
                    <div key={i} style={{
                      position:"absolute",
                      left:`${fx*100}%`, top:`${fy*100}%`,
                      transform:`translate(-50%,-50%) ${lower?"rotate(180deg)":""}`,
                    }}>
                      <PipShape suit={card.suit} size={bodyPip}/>
                    </div>
                  );
                })}
              </div>
            )}

            {/* Diamond point-value badge for face/ace diamonds */}
            {isDiamond(card) && diamondPoints(card) > 1 && (
              <div style={{
                position:"absolute",top:tiny?2:3,right:tiny?2:4,
                background:VM.gold,color:VM.ink,
                fontSize:tiny?6:9,fontWeight:900,
                borderRadius:3,padding:"1px 3px",
                lineHeight:1.2,fontFamily:"'Trebuchet MS',sans-serif",
                zIndex:3,
              }}>{diamondPoints(card)}</div>
            )}
          </>
        );
      })()}
    </div>
  );
}

function GoldBtn({ onClick, children, disabled, small, secondary }) {
  return (
    <button onClick={onClick} disabled={disabled} style={{
      background: disabled
        ? "#ffffff11"
        : secondary
        ? "transparent"
        : "linear-gradient(90deg,#e2c97e,#c9a84c)",

}

// KIDNAP MODAL — full hand inspection, pick best card
// ============================================================
function KidnapModal({ hands, jokerPlayerIdx, allNames, onSteal, deckTheme }) {
  const targets = [0,1,2,3].filter(i => i!==jokerPlayerIdx && hands[i].length>0);
  const [chosenPlayer, setChosenPlayer] = useState(targets[0] ?? null);
  const [chosenCardIdx, setChosenCardIdx] = useState(null);

  const displayHand = chosenPlayer !== null ? sortHand(hands[chosenPlayer]) : [];

  // Map sorted card back to original index in hands[chosenPlayer]
  function getOriginalIdx(card) {
    return hands[chosenPlayer].findIndex(c => c.id === card.id);
  }

  function confirm() {
    if (chosenPlayer === null || chosenCardIdx === null) return;
    onSteal(chosenPlayer, chosenCardIdx);
  }

  return (
    <Modal>
      <div>
        <div style={{textAlign:"center",marginBottom:16}}>
          <div style={{color:"#c9a84c",fontSize:11,letterSpacing:3,textTransform:"uppercase",marginBottom:4}}>The Joker Strikes</div>
          <h2 style={{color:"#fff",margin:"0 0 4px",fontSize:22,fontFamily:"Georgia,serif"}}>Choose a card to kidnap.</h2>
          <p style={{color:"#ffffff55",fontSize:11,margin:0}}>Inspect any hand, then take your pick.</p>
        </div>

        {/* Player tabs */}
        <div style={{display:"flex",gap:6,marginBottom:14,justifyContent:"center"}}>
          {targets.map(i => (
            <div key={i} onClick={()=>{ setChosenPlayer(i); setChosenCardIdx(null); }} style={{
              background: chosenPlayer===i ? "#c9a84c22" : "#ffffff08",
              border:`1.5px solid ${chosenPlayer===i ? "#c9a84c" : "#ffffff22"}`,
              borderRadius:10, padding:"8px 14px", cursor:"pointer",
              transition:"all 0.15s", textAlign:"center", flex:1,
            }}>
              <div style={{fontSize:18}}>{i===0?"😎":AI_PERSONAS[i-1]?.emoji}</div>
              <div style={{color:chosenPlayer===i?"#c9a84c":"#ffffffcc",fontSize:12,fontWeight:700}}>{allNames[i]}</div>
              <div style={{color:"#ffffff44",fontSize:10}}>{hands[i].length} cards</div>
            </div>
          ))}
        </div>

        {/* Face-up hand display */}
        {chosenPlayer !== null && (
          <div style={{
            background:"#ffffff08", borderRadius:12, padding:"12px 8px",
            marginBottom:16, minHeight:100,
          }}>
            <div style={{color:"#c9a84c66",fontSize:9,letterSpacing:2,textAlign:"center",marginBottom:8,textTransform:"uppercase"}}>
              {allNames[chosenPlayer]}'s Hand — tap to select
            </div>
            <div style={{display:"flex",flexWrap:"wrap",gap:4,justifyContent:"center"}}>
              {displayHand.map((card) => {
                const origIdx = getOriginalIdx(card);
                const isSelected = chosenCardIdx === origIdx;
                return (
                  <div key={card.id} onClick={()=>setChosenCardIdx(origIdx)} style={{cursor:"pointer"}}>
                    <CardComp
                      card={card}
                      selected={isSelected}
                      tiny
                      deckTheme={deckTheme}
                    />
                  </div>
                );
              })}
            </div>
          </div>
        )}

        <div style={{textAlign:"center"}}>
          <GoldBtn onClick={confirm} disabled={chosenCardIdx===null}>
            Kidnap This Card 🃏
          </GoldBtn>
        </div>
      </div>
    </Modal>
  );
}

function TrickResultModal({ result, allNames, onContinue, isGameOver, isHandOver }) {
  if (!result) return null;

  const aceCard = result.plays?.find(p => isBatman(p.card))?.card;
  const winningPlay = result.plays?.find(p => p.playerIdx === result.winnerIdx);
  const pointsWon = result.diamondsCaptured?.reduce((s,c)=>s+diamondPoints(c),0) || 0;
  const btnLabel = isGameOver ? "END"
    : result.pendingAmericanFamily ? "PROCEED"
    : result.americanFamily ? "PROCEED"
    : isHandOver ? "PROCEED"
    : "NEXT TRICK →";

  // ===== AMERICAN FAMILY =====
  if (result.americanFamily) {
    return (
      <EventBox borderColor="#ffffff" emoji="🇺🇸" title="The American Family Together!" btnLabel={btnLabel} onContinue={onContinue}>
        <div style={{color:"#fff",fontSize:22,fontWeight:800,fontFamily:"Georgia,serif"}}>
          {allNames[result.winnerIdx]}
        </div>
        <div style={{display:"flex",gap:4,justifyContent:"center",flexWrap:"wrap"}}>
          {(result.familyCards||[]).map(c=><CardComp key={c.id} card={c} tiny/>)}
        </div>
        <div style={{
          background:"#ffffff11", border:"1px solid #ffffff33",
          borderRadius:10, padding:"8px 20px", display:"inline-block",
        }}>
          <span style={{color:"#e2c97e",fontSize:16,fontWeight:800}}>+{AMERICAN_FAMILY_BONUS} points! Round Over!</span>
        </div>
      </EventBox>
    );
  }

  // ===== ACE OF SPADES STOPS THE JOKER =====
  if (result.batmanBlocked) {
    return (
      <EventBox borderColor="#4466ff" emoji="🌃" title="Ace of Spades Stops The Joker!" btnLabel={btnLabel} onContinue={onContinue}>
        <div style={{color:"#fff",fontSize:22,fontWeight:800,fontFamily:"Georgia,serif"}}>
          {allNames[result.winnerIdx]}
        </div>
        {aceCard && (
          <div style={{display:"flex",justifyContent:"center"}}>
            <CardComp card={aceCard}/>
          </div>
        )}
        <div style={{
          background:"#4466ff11", border:"1px solid #4466ff44",
          borderRadius:10, padding:"8px 20px", display:"inline-block",
        }}>
          <span style={{color:"#e2c97e",fontSize:16,fontWeight:800}}>+35 pts bonus!</span>
        </div>
      </EventBox>
    );
  }

  // ===== THE JOKER KIDNAPS =====
  if (result.jokerWin) {
    return (
      <EventBox borderColor="#7700cc" emoji="💸" title="The Joker Kidnaps!" btnLabel={btnLabel} onContinue={onContinue}>
        <div style={{color:"#fff",fontSize:22,fontWeight:800,fontFamily:"Georgia,serif"}}>
          {allNames[result.winnerIdx]}
        </div>
        {result.stolenCard && (
          <div style={{color:"#e2c97ecc",fontSize:13,fontFamily:"Georgia,serif",fontStyle:"italic"}}>
            {allNames[result.winnerIdx]} kidnaps the{" "}
            <strong style={{color:"#e2c97e",fontStyle:"normal"}}>
              {result.stolenCard.isJoker ? "Joker" : `${result.stolenCard.rank}${result.stolenCard.suit}`}
            </strong>{" "}from{" "}
            <strong style={{color:"#e2c97e",fontStyle:"normal"}}>{allNames[result.stolenFrom]}</strong>
          </div>
        )}
        {pointsWon > 0 && (
          <div style={{
            background:"#7700cc11", border:"1px solid #7700cc44",
            borderRadius:10, padding:"8px 20px", display:"inline-block",
          }}>
            <span style={{color:"#e2c97e",fontSize:16,fontWeight:800}}>+{pointsWon} pt{pointsWon!==1?"s":""} 💎</span>
          </div>
        )}
      </EventBox>
    );
  }

  // ===== AUTO-CLAIM SWEEP =====
  if (result.autoClaim) {
    return (
      <EventBox borderColor="#c9a84c" emoji="✨" title="Unopposed Sweep" btnLabel={btnLabel} onContinue={onContinue}>
        <div style={{color:"#fff",fontSize:22,fontWeight:800,fontFamily:"Georgia,serif"}}>
          {allNames[result.winnerIdx]}
        </div>
        <div style={{color:"#e2c97ecc",fontSize:13,fontFamily:"Georgia,serif",fontStyle:"italic",lineHeight:1.6}}>
          No opponents remain.<br/>
          <span style={{color:"#e2c97e",fontWeight:700,fontStyle:"normal"}}>
            Claims all remaining cards automatically!
          </span>
        </div>
      </EventBox>
    );
  }

  // ===== ACE OF SPADES RESCUE =====
  if (result.aceRescued) {
    const rescuerIdx = result.aceRescuerIdx ?? result.winnerIdx;
    return (
      <EventBox borderColor="#4466ff" emoji="🗡️" title="Ace of Spades Rescue!" btnLabel={btnLabel} onContinue={onContinue}>
        <div style={{color:"#fff",fontSize:22,fontWeight:800,fontFamily:"Georgia,serif"}}>
          {allNames[rescuerIdx]}
        </div>
        {result.rescuedCard && (
          <div style={{color:"#e2c97ecc",fontSize:13,fontFamily:"Georgia,serif",fontStyle:"italic"}}>
            {allNames[rescuerIdx]} rescues the{" "}
            <strong style={{color:"#e2c97e",fontStyle:"normal"}}>
              {result.rescuedCard.isJoker ? "Joker" : `${result.rescuedCard.rank}${result.rescuedCard.suit}`}
            </strong>{" "}from{" "}
            <strong style={{color:"#e2c97e",fontStyle:"normal"}}>{allNames[result.rescuedFrom]}</strong>
          </div>
        )}
        {pointsWon > 0 && (
          <div style={{
            background:"#4466ff11", border:"1px solid #4466ff44",
            borderRadius:10, padding:"8px 20px", display:"inline-block",
          }}>
            <span style={{color:"#e2c97e",fontSize:16,fontWeight:800}}>+{pointsWon} pt{pointsWon!==1?"s":""} 💎 (to {allNames[result.winnerIdx]})</span>
          </div>
        )}
      </EventBox>
    );
  }

  // ===== NORMAL TRICK WON =====
  return (
    <EventBox borderColor="#c9a84c" emoji="🎩" title="Trick Won" btnLabel={btnLabel} onContinue={onContinue}>
      <div style={{color:"#fff",fontSize:22,fontWeight:800,fontFamily:"Georgia,serif"}}>
        {allNames[result.winnerIdx]}
      </div>
      {winningPlay && (
        <div style={{display:"flex",justifyContent:"center"}}>
          <CardComp card={winningPlay.card}/>
        </div>
      )}
      {pointsWon > 0 && (
        <div style={{
          background:"#c9a84c11", border:"1px solid #c9a84c44",
          borderRadius:10, padding:"8px 20px", display:"inline-block",
        }}>
          <span style={{color:"#e2c97e",fontSize:16,fontWeight:800}}>+{pointsWon} pt{pointsWon!==1?"s":""} 💎</span>
        </div>
      )}
    </EventBox>
  );
}

// ============================================================
// MAIN GAME COMPONENT
// ============================================================
function DiamondsGame() {
  const [screen, setScreen] = useState("menu"); // menu | game | gameover
  const [playerName, setPlayerName] = useState("You");
  const [nameInput, setNameInput] = useState("");
  const [showRules, setShowRules] = useState(false);
  const [deckTheme, setDeckTheme] = useState("spring");
  const [soundOn, setSoundOn] = useState(true);

  // Keep the module-level sound flag in sync with React state
  useEffect(() => { setSoundEnabled(soundOn); }, [soundOn]);

  // Lock body scroll on menu, allow it during gameplay
  useEffect(() => {
    if (typeof document === "undefined") return;
    if (screen === "menu") {
      document.body.removeAttribute("data-scroll");
    } else {
      document.body.setAttribute("data-scroll", "1");
    }
  }, [screen]);

  // Game state
  const [hands, setHands] = useState([[],[],[],[]]);
  const [totalScores, setTotalScores] = useState([0,0,0,0]);
  const [roundScores, setRoundScores] = useState([0,0,0,0]);
  const [trickPlays, setTrickPlays] = useState([]); // [{playerIdx, card}]
  const [currentLeader, setCurrentLeader] = useState(0);
  const [currentTurn, setCurrentTurn] = useState(0); // index in turn order
  const [turnOrder, setTurnOrder] = useState([0,1,2,3]);
  const [selectedCard, setSelectedCard] = useState(null);
  const [phase, setPhase] = useState("playing"); // playing | kidnap | rescue | trickresult | roundover | gameover
  const [trickResult, setTrickResult] = useState(null);
  const [kidnapState, setKidnapState] = useState(null);
  const [rescueState, setRescueState] = useState(null);
  const [roundNum, setRoundNum] = useState(1);
  const [tricksPlayed, setTricksPlayed] = useState(0);
  const [isFirstTrick, setIsFirstTrick] = useState(true);
  const [gameLog, setGameLog] = useState([]);
  const [pendingAF, setPendingAF] = useState(false); // american family detected
  const [showFireworks, setShowFireworks] = useState(false);
  const [showAceCelebration, setShowAceCelebration] = useState(false);
  const [pendingFireworks, setPendingFireworks] = useState(false);
  const [diamondsBroken, setDiamondsBroken] = useState(false);
  const [pendingPlayContinuation, setPendingPlayContinuation] = useState(null); // CYT interrupt
  const allNames = [playerName, ...AI_NAMES];

  const isPlayerTurn = phase==="playing" && turnOrder[currentTurn]===0;
  const ledSuit = trickPlays.length > 0 && !trickPlays[0].card.isJoker ? trickPlays[0].card.suit : null;
  const mustOpenWith2C = isFirstTrick && trickPlays.length === 0 && isPlayerTurn;

  // Auto-skip human player if their hand is empty
  useEffect(() => {
    if (!isPlayerTurn || hands[0]?.length > 0) return;
    const timer = setTimeout(() => {
      const remaining = turnOrder.slice(currentTurn + 1).filter(p => hands[p]?.length > 0);
      if (remaining.length === 0 && trickPlays.length > 0) {
        resolveTrickComplete(trickPlays, hands);
      } else {
        setCurrentTurn(t => t + 1);
      }
    }, 300);
    return () => clearTimeout(timer);
  }, [isPlayerTurn, currentTurn]);

  // Auto-claim sweep: if any player (including human) starts a trick alone with cards,
  // they sweep all their remaining cards automatically — no manual play required.
  useEffect(() => {
    if (phase !== "playing") return;
    if (trickPlays.length > 0) return; // only at the start of a trick
    const playersWithCards = hands.map((h, i) => h.length > 0 ? i : -1).filter(i => i >= 0);
    if (playersWithCards.length !== 1) return;
    const solo = playersWithCards[0];
    const timer = setTimeout(() => {
      setTrickResult({ winnerIdx: solo, plays: [], diamondsCaptured: [], autoClaim: true });
      setPhase("trickresult");
    }, 400);
    return () => clearTimeout(timer);
  }, [phase, currentTurn, hands, trickPlays.length]);

  function addLog(msg) {
    setGameLog(prev => [msg, ...prev].slice(0,30));
  }

  // ---- Start a new round ----
  function startRound(existingScores) {
    const newHands = dealCards();
    const leader = findLeader(newHands);
    const order = [0,1,2,3].map(i=>(leader+i)%4);
    setHands(newHands);
    setTrickPlays([]);
    setCurrentLeader(leader);
    setCurrentTurn(0);
    setTurnOrder(order);
    setSelectedCard(null);
    setPhase("playing");
    setTrickResult(null);
    setKidnapState(null);
    setRescueState(null);
    setRoundScores([0,0,0,0]);
    setTricksPlayed(0);
    setIsFirstTrick(true);
    setDiamondsBroken(false);
  }

  function startGame() {
    setTotalScores([0,0,0,0]);
    setRoundNum(1);
    setGameLog([]);
    setScreen("game");
    const newHands = dealCards();
    const leader = findLeader(newHands);
    const order = [0,1,2,3].map(i=>(leader+i)%4);
    setHands(newHands);
    setTrickPlays([]);
    setCurrentLeader(leader);
    setCurrentTurn(0);
    setTurnOrder(order);
    setSelectedCard(null);
    setPhase("playing");
    setTrickResult(null);
    setKidnapState(null);
    setRescueState(null);
    setRoundScores([0,0,0,0]);
    setTricksPlayed(0);
    setIsFirstTrick(true);
    setDiamondsBroken(false);
  }

  // ---- Play a card ----
  function playCard(card) {
    if (!isPlayerTurn) return;
    // Joker is ALWAYS playable — no restrictions
    if (card.isJoker) { submitPlay(0, card); return; }
    if (mustOpenWith2C && !(card.rank==="2" && card.suit==="♣")) return;
    // Trump rule: can't lead with a diamond until diamonds are broken
    if (!diamondsBroken && trickPlays.length === 0 && isDiamond(card)) {
      const nonDiamonds = hands[0].filter(c => !isDiamond(c) && !c.isJoker);
      if (nonDiamonds.length > 0) return;
    }
    // Follow suit if possible
    if (ledSuit) {
      const hasSuit = hands[0].some(c => !c.isJoker && c.suit === ledSuit);
      if (hasSuit && card.suit !== ledSuit) return;
    }
    submitPlay(0, card);
  }

  function submitPlay(playerIdx, card) {
    soundCardPlay();

    const newPlays = [...trickPlays, { playerIdx, card }];
    const newHands = hands.map((h,i) => i===playerIdx ? h.filter(c=>c.id!==card.id) : h);
    setHands(newHands);
    setTrickPlays(newPlays);

    // Cutting Your Teeth — INTERRUPT the trick immediately on first diamond played
    const justBrokeDimonds = !diamondsBroken && isDiamond(card);
    if (justBrokeDimonds) {
      setDiamondsBroken(true);
      soundCuttingYourTeeth();
      addLog("♦ Cutting Your Teeth — Dimonds are now in play!");
      // Stash continuation; PROCEED on CYT modal will resume the trick flow
      setPendingPlayContinuation({ playerIdx, card, newPlays, newHands });
      setPhase("cuttingteeth_interrupt");
      return;
    }

    continuePlayFlow(playerIdx, card, newPlays, newHands);
  }

  function continuePlayFlow(playerIdx, card, newPlays, newHands) {
    // Check American Family for any player after each play
    for (let i=0; i<4; i++) {
      if (checkAmericanFamily(newHands[i])) {
        handleAmericanFamily(i, newHands, newPlays);
        return;
      }
    }

    // AUTO-CLAIM: if everyone but one player is out of cards, that player
    // automatically wins all their remaining cards as solo tricks.
    const playersWithCards = newHands.map((h, i) => h.length > 0 ? i : -1).filter(i => i >= 0);
    if (playersWithCards.length === 1 && newPlays.length === 4) {
      // Trick fully played AND only one player has cards left → resolve this trick,
      // then auto-claim will trigger from afterTrickResult on the next round-end check.
      resolveTrickComplete(newPlays, newHands);
      return;
    }
    if (playersWithCards.length <= 1) {
      // Mid-trick or after this play, only one player has cards.
      // Resolve whatever plays we have now, then auto-claim remaining.
      resolveTrickComplete(newPlays, newHands);
      return;
    }

    if (newPlays.length === 4) {
      // Trick complete
      resolveTrickComplete(newPlays, newHands);
    } else {
      // Advance currentTurn, skipping any players with no cards
      let nextTurn = currentTurn + 1;
      while (nextTurn < 4 && newHands[turnOrder[nextTurn]]?.length === 0) {
        nextTurn++;
      }
      if (nextTurn >= 4) {
        // No more players have cards in this trick → resolve what we have
        resolveTrickComplete(newPlays, newHands);
      } else {
        setCurrentTurn(nextTurn);
        setTrickPlays(newPlays);
        setHands(newHands);
      }
    }
  }

  function handleAmericanFamily(playerIdx, currentHands, currentPlays) {
    const newRoundScores = [...roundScores];
    newRoundScores[playerIdx] += AMERICAN_FAMILY_BONUS;

    const newTotal = totalScores.map((s,i)=>s+(newRoundScores[i]||0));
    setRoundScores(newRoundScores);
    setTotalScores(newTotal);
    addLog(`🇺🇸 ${allNames[playerIdx]} completes The American Family! +${AMERICAN_FAMILY_BONUS} pts`);
    soundAmericanFamily();

    // Collect the family cards for display
    const familyCards = ["J♦","Q♦","K♦","A♦"].map(id =>
      [...currentHands[playerIdx], ...currentPlays.map(p=>p.card)].find(c=>c.id===id)
    ).filter(Boolean);

    setTrickResult({
      winnerIdx: playerIdx,
      americanFamily: true,
      familyCards,
      plays: currentPlays,
      diamondsCaptured: [],
    });
    setPhase("trickresult");
    // Note: pendingAF removed — afterTrickResult handles AF via the americanFamily flag
  }

  function resolveTrickComplete(plays, currentHands) {
    const result = resolveTrick(plays, diamondsBroken);
    const winner = result.winnerIdx;
    const trickCards = plays.map(p=>p.card);
    const capturedDiamonds = trickCards.filter(c=>isDiamond(c));
    const batmanBlocked = !!result.batmanWin;

    const newRoundScores = [...roundScores];
    const pointsWon = capturedDiamonds.reduce((sum,c)=>sum+diamondPoints(c),0);
    newRoundScores[winner] += pointsWon;

    // Ace of Spades bonus — +35 for blocking The Joker
    const aceBonus = batmanBlocked ? 35 : 0;
    if (batmanBlocked) {
      newRoundScores[winner] += aceBonus;
      soundAceSuccess();
    }

    // ACE OF SPADES RESCUE: A♠ played and NO Joker in trick → rescue power fires
    // for the player who played the Ace, regardless of whether they win the trick.
    const acePlay = plays.find(p => isBatman(p.card));
    const trickHasJoker = plays.some(p => p.card.isJoker);
    const aceRescueTriggered = acePlay && !trickHasJoker;
    const acePlayerIdx = aceRescueTriggered ? acePlay.playerIdx : null;

    // Play sound based on outcome
    if (pointsWon > 0 && !batmanBlocked && !aceRescueTriggered) soundDiamondTrick();

    addLog(batmanBlocked
      ? `♠ ${allNames[winner]} (Ace of Spades) stops The Joker! +${aceBonus} pts bonus!`
      : aceRescueTriggered
      ? `🗡️ ${allNames[acePlayerIdx]} played the Ace of Spades — preparing rescue...`
      : `${allNames[winner]} wins trick (+${pointsWon}💎)`);

    setRoundScores(newRoundScores);

    // Check if any player has hit 80 mid-trick
    const newTotal = totalScores.map((s,i)=>s+(newRoundScores[i]||0));
    const gameWon = newTotal.some(s=>s>=WIN_SCORE);

    const resultObj = {
      winnerIdx: winner,
      jokerWin: result.jokerWin,
      batmanBlocked,
      plays,
      diamondsCaptured: capturedDiamonds,
    };

    if (result.jokerWin) {
      setTimeout(() => {
        // Guard: if no opponent has cards to steal, skip the kidnap modal entirely
        // and resolve the trick normally (prevents end-of-round freeze).
        const hasTargets = currentHands.some((h, i) => i !== winner && h.length > 0);
        if (!hasTargets) {
          addLog(`🃏 ${allNames[winner]} wins with the Joker (no cards left to kidnap)`);
          setTrickResult({ ...resultObj, jokerWin: true });
          const allEmpty = currentHands.every(h=>h.length===0);
          if (allEmpty || gameWon) {
            setTotalScores(newTotal);
            if (gameWon) setPendingFireworks(true);
          }
          setPhase("trickresult");
          return;
        }
        setKidnapState({ jokerPlayerIdx: winner, hands: currentHands, resultObj });
        setPhase("kidnap");
      }, 600);
    } else if (aceRescueTriggered) {
      setTimeout(() => {
        // Guard: if no opponent has cards to rescue, just show normal trick result
        const hasTargets = currentHands.some((h, i) => i !== acePlayerIdx && h.length > 0);
        if (!hasTargets) {
          addLog(`♠ ${allNames[acePlayerIdx]} played the Ace of Spades (no cards left to rescue)`);
          setTrickResult(resultObj);
          const allEmpty = currentHands.every(h=>h.length===0);
          if (allEmpty || gameWon) {
            setTotalScores(newTotal);
            if (gameWon) setPendingFireworks(true);
          }
          setPhase("trickresult");
          return;
        }
        setRescueState({ acePlayerIdx, hands: currentHands, resultObj });
        setPhase("rescue");
      }, 600);
    } else {
      setTimeout(() => {
        // Store result for after Cutting Your Teeth if needed
        setTrickResult(resultObj);
        const allEmpty = currentHands.every(h=>h.length===0);
        if (allEmpty || gameWon) {
          setTotalScores(newTotal);
          if (gameWon) setPendingFireworks(true);
        }
        setPhase("trickresult");
      }, 600);
    }
  }

  function checkRoundOver(currentHands, currentRoundScores, lastWinner) {
    // No longer needed — handled inline
  }

  function handleKidnap(fromPlayer, cardIdx) {
    if (!kidnapState) return; // safety guard
    const currentHands = kidnapState.hands; // use snapshot, not stale closure
    const stolenCard = currentHands[fromPlayer][cardIdx];
    const jokerPlayerIdx = kidnapState.jokerPlayerIdx;

    const newHands = currentHands.map((h,i) => {
      if (i === fromPlayer) return h.filter((_,ci)=>ci!==cardIdx);
      if (i === jokerPlayerIdx) return [...h, stolenCard];
      return h;
    });

    addLog(`🃏 ${allNames[jokerPlayerIdx]} kidnaps from ${allNames[fromPlayer]}!`);
    soundJokerKidnaps();

    for (let i=0; i<4; i++) {
      if (checkAmericanFamily(newHands[i])) {
        setHands(newHands);
        // Show the Joker Kidnaps event box FIRST, then chain to American Family
        // on PROCEED. The pendingAmericanFamily payload is consumed in afterTrickResult.
        setTrickResult({
          ...kidnapState.resultObj,
          jokerWin: true,
          stolenCard,
          stolenFrom: fromPlayer,
          pendingAmericanFamily: {
            playerIdx: i,
            hands: newHands,
            plays: kidnapState.resultObj.plays,
          },
        });
        setKidnapState(null);
        setPhase("trickresult");
        return;
      }
    }

    setHands(newHands);
    const resultObj = { ...kidnapState.resultObj, jokerWin: true, stolenCard, stolenFrom: fromPlayer };
    setTrickResult(resultObj);
    setKidnapState(null);
    setPhase("trickresult");

    const allEmpty = newHands.every(h=>h.length===0);
    if (allEmpty) {
      const newTotal = totalScores.map((s,i)=>s+(roundScores[i]||0));
      setTotalScores(newTotal);
      if (newTotal.some(s=>s>=WIN_SCORE)) setPendingFireworks(true);
    }
  }

  // ---- Ace of Spades Rescue: A♠ wins trick with no Joker present → rescue a card ----
  function handleRescue(fromPlayer, cardIdx) {
    if (!rescueState) return;
    const currentHands = rescueState.hands;
    const rescuedCard = currentHands[fromPlayer][cardIdx];
    const acePlayerIdx = rescueState.acePlayerIdx;

    const newHands = currentHands.map((h,i) => {
      if (i === fromPlayer) return h.filter((_,ci)=>ci!==cardIdx);
      if (i === acePlayerIdx) return [...h, rescuedCard];
      return h;
    });

    addLog(`🗡️ ${allNames[acePlayerIdx]} rescues from ${allNames[fromPlayer]}!`);
    soundAceRescue();

    // Check American Family on the Ace player's new hand
    for (let i=0; i<4; i++) {
      if (checkAmericanFamily(newHands[i])) {
        setHands(newHands);
        setTrickResult({
          ...rescueState.resultObj,
          aceRescued: true,
          aceRescuerIdx: acePlayerIdx,
          rescuedCard,
          rescuedFrom: fromPlayer,
          pendingAmericanFamily: {
            playerIdx: i,
            hands: newHands,
            plays: rescueState.resultObj.plays,
          },
        });
        setRescueState(null);
        setPhase("trickresult");
        return;
      }
    }

    setHands(newHands);
    const resultObj = { ...rescueState.resultObj, aceRescued: true, aceRescuerIdx: acePlayerIdx, rescuedCard, rescuedFrom: fromPlayer };
    setTrickResult(resultObj);
    setRescueState(null);
    setPhase("trickresult");

    const allEmpty = newHands.every(h=>h.length===0);
    if (allEmpty) {
      const newTotal = totalScores.map((s,i)=>s+(roundScores[i]||0));
      setTotalScores(newTotal);
      if (newTotal.some(s=>s>=WIN_SCORE)) setPendingFireworks(true);
    }
  }

  // AI picks a card to rescue — prioritize American Family completion, else highest value
  function aiChooseRescueTarget(currentHands, playerIdx) {
    const myHand = currentHands[playerIdx];
    const familyIds = ["J♦","Q♦","K♦","A♦"];
    const myFamily = myHand.filter(c => familyIds.includes(c.id));

    // P1: AmFamily completion
    if (myFamily.length === 3) {
      const missing = familyIds.find(id => !myFamily.some(c => c.id === id));
      for (let i=0; i<4; i++) {
        if (i === playerIdx) continue;
        const idx = currentHands[i].findIndex(c => c.id === missing);
        if (idx >= 0) return { fromPlayer:i, cardIdx:idx };
      }
    }
    if (myFamily.length === 2) {
      const missing = familyIds.filter(id => !myFamily.some(c => c.id === id));
      for (let i=0; i<4; i++) {
        if (i === playerIdx) continue;
        for (const m of missing) {
          const idx = currentHands[i].findIndex(c => c.id === m);
          if (idx >= 0) return { fromPlayer:i, cardIdx:idx };
        }
      }
    }
    // P2: highest-value card from any opponent
    let best = null;
    for (let i=0; i<4; i++) {
      if (i === playerIdx) continue;
      currentHands[i].forEach((c, ci) => {
        const score = c.isJoker ? 999 : (isDiamond(c) ? 100 + diamondPoints(c)*5 : cardScore(c));
        if (!best || score > best.score) best = { fromPlayer:i, cardIdx:ci, score };
      });
    }
    return best ? { fromPlayer:best.fromPlayer, cardIdx:best.cardIdx } : null;
  }

  function afterTrickResult() {
    // Delay before firing fireworks, to let the event's tune finish playing
    const FIREWORKS_DELAY = 1000;

    // If the Joker Kidnaps event is queued with a pending AF, fire AF now.
    // (User just dismissed the kidnap box; show The American Family Together next.)
    if (trickResult?.pendingAmericanFamily) {
      const af = trickResult.pendingAmericanFamily;
      handleAmericanFamily(af.playerIdx, af.hands, af.plays);
      return;
    }

    // American Family win — end round immediately
    if (trickResult?.americanFamily) {
      const gameOver = totalScores.some(s=>s>=WIN_SCORE);
      if (gameOver) {
        setTimeout(() => { soundRoundWin(); setShowFireworks(true); }, FIREWORKS_DELAY);
      } else {
        soundRoundWin();
        setPhase("roundover");
        setRoundNum(r=>r+1);
      }
      return;
    }

    // If fireworks were pending (game won mid-trick), fire now after modal dismissed
    if (pendingFireworks) {
      setPendingFireworks(false);
      setTimeout(() => { soundRoundWin(); setShowFireworks(true); }, FIREWORKS_DELAY);
      return;
    }

    const allEmpty = hands.every(h=>h.length===0);
    if (allEmpty) {
      const newRoundScores = [...roundScores];
      let leftoverLog = [];
      for (let i=0; i<4; i++) {
        const leftover = hands[i].filter(c => isDiamond(c));
        const pts = leftover.reduce((s,c) => s+diamondPoints(c), 0);
        if (pts > 0) {
          newRoundScores[i] += pts;
          leftoverLog.push(`${allNames[i]} +${pts}💎`);
        }
      }
      if (leftoverLog.length > 0) {
        addLog(`Leftover dimonds scored: ${leftoverLog.join(", ")}`);
        setRoundScores(newRoundScores);
      }
      const newTotal = totalScores.map((s,i)=>s+(newRoundScores[i]||0));
      setTotalScores(newTotal);
      const gameOver = newTotal.some(s=>s>=WIN_SCORE);
      if (gameOver) {
        setTimeout(() => { soundRoundWin(); setShowFireworks(true); }, FIREWORKS_DELAY);
      } else {
        soundRoundWin();
        setPhase("roundover");
        setRoundNum(r=>r+1);
      }
      return;
    }

    // AUTO-CLAIM: if only one player has cards left, they win all their remaining cards
    // (each remaining card scores its dimond value to that player; cards are not played out)
    const playersWithCards = hands.map((h, i) => h.length > 0 ? i : -1).filter(i => i >= 0);
    if (playersWithCards.length === 1) {
      const soloPlayer = playersWithCards[0];
      const soloCards = hands[soloPlayer];
      const dimondPts = soloCards.filter(c => isDiamond(c)).reduce((s,c) => s+diamondPoints(c), 0);
      const newRoundScores = [...roundScores];
      newRoundScores[soloPlayer] += dimondPts;
      if (dimondPts > 0) {
        addLog(`✨ ${allNames[soloPlayer]} sweeps ${soloCards.length} unopposed card${soloCards.length!==1?"s":""} (+${dimondPts}💎)`);
      } else {
        addLog(`✨ ${allNames[soloPlayer]} sweeps ${soloCards.length} unopposed card${soloCards.length!==1?"s":""}`);
      }
      setRoundScores(newRoundScores);
      // Empty all hands — round is functionally over
      setHands([[],[],[],[]]);

      const newTotal = totalScores.map((s,i)=>s+(newRoundScores[i]||0));
      setTotalScores(newTotal);
      const gameOver = newTotal.some(s=>s>=WIN_SCORE);
      if (gameOver) {
        setTimeout(() => { soundRoundWin(); setShowFireworks(true); }, FIREWORKS_DELAY);
      } else {
        soundRoundWin();
        setPhase("roundover");
        setRoundNum(r=>r+1);
        setTrickResult(null);
      }
      return;
    }

    const winner = trickResult.winnerIdx;
    const newOrder = [0,1,2,3].map(i=>(winner+i)%4);
    setTurnOrder(newOrder);
    setCurrentTurn(0);
    setTrickPlays([]);
    setSelectedCard(null);
    setTricksPlayed(t=>t+1);
    setIsFirstTrick(false);
    // Show Cutting Your Teeth BEFORE resuming play if it was just triggered
    setPhase("playing");
    setTrickResult(null);
  }

  function finishRound(fromAF) {
    const gameOver = totalScores.some(s=>s>=WIN_SCORE);
    setPhase(gameOver ? "gameover" : "roundover");
    setRoundNum(r=>r+1);
    setPendingAF(false);
  }

  function startNextRound() {
    startRound(totalScores);

  // ---- AI turns ----
  useEffect(() => {
    if (phase !== "playing") return;
    const currentPlayer = turnOrder[currentTurn];
    if (currentPlayer === undefined || currentPlayer === 0) return; // human's turn or out of bounds

    const timer = setTimeout(() => {
      const hand = hands[currentPlayer];

      // If AI has no cards, skip their turn — advance to next player with cards
      if (!hand || hand.length === 0) {
        // Find next player in turn order who has cards
        let nextTurn = currentTurn + 1;
        while (nextTurn < 4 && (hands[turnOrder[nextTurn]]?.length || 0) === 0) {
          nextTurn++;
        }
        if (nextTurn >= 4) {
          // No one else has cards — resolve whatever plays we have, or fall through to auto-claim
          if (trickPlays.length > 0) {
            resolveTrickComplete(trickPlays, hands);
          } else {
            // No plays AND no players with cards — auto-claim path: pretend a trick just ended
            // by setting a synthetic trickResult so afterTrickResult fires the auto-claim
            const playersWithCards = hands.map((h, i) => h.length > 0 ? i : -1).filter(i => i >= 0);
            if (playersWithCards.length === 1) {
              setTrickResult({ winnerIdx: playersWithCards[0], plays: [], diamondsCaptured: [] });
              setPhase("trickresult");
            }
          }
        } else {
          setCurrentTurn(nextTurn);
        }
        return;
      }

      // First trick: AI leader must play 2♣
      if (isFirstTrick && trickPlays.length === 0) {
        const twoClub = hand.find(c => c.rank==="2" && c.suit==="♣");
        if (twoClub) { submitPlay(currentPlayer, twoClub); return; }
      }
      const role = aiRoleForRound(currentPlayer, roundNum);
      const card = aiChooseCard(hand, role, trickPlays, ledSuit, { trumpBroken: diamondsBroken });
      if (card) {
        submitPlay(currentPlayer, card);
      } else {
        // No valid card found — skip this player's turn
        setCurrentTurn(t => t + 1);
      }
    }, 700 + Math.random()*400);

    return () => clearTimeout(timer);
  }, [phase, currentTurn, turnOrder]);

  }, [phase, kidnapState]);

  // ============================================================

  const playerHand = sortHand(hands[0] || []);
  const canPlay = isPlayerTurn && selectedCard;

  // Can player lead with a diamond? Only if broken or no other cards
  const canLeadDiamond = diamondsBroken || playerHand.filter(c=>!isDiamond(c)&&!c.isJoker).length===0;

  // Validate if selected card is legal to play
  const selectedIsLegal = selectedCard && (
    mustOpenWith2C
      ? (selectedCard.rank==="2" && selectedCard.suit==="♣")
      : selectedCard.isJoker
      ? true
      : trickPlays.length === 0
      ? (!isDiamond(selectedCard) || canLeadDiamond)
      : (

  );

  return (
    <div style={{

              {/* Fanned face-down cards for AI */}
              <div style={{display:"flex",position:"relative",height:22,marginLeft:2}}>
                {(hands[i]||[]).map((_,ci)=>(
                  <div key={ci} style={{

                  </div>

      </div>

      {/* TRICK AREA */}
      <div style={{

        {/* Led suit ABOVE cards */}
        {ledSuit&&(

          {(() => {
            // Compute fan layout to fit available width.
            // Available width = container width minus a safety margin for selected-card lift.
            const total = playerHand.length;
            const cardW = 80;
            const SAFETY = 20; // px of breathing room on each side
            const availW = (typeof window !== 'undefined' ? window.innerWidth : 360) - SAFETY * 2;
            // We want total spread = cardW + OVERLAP*(total-1) <= availW
            // → OVERLAP <= (availW - cardW) / (total-1)
            const maxOverlap = total > 1 ? Math.floor((availW - cardW) / (total - 1)) : 0;
            const OVERLAP = Math.min(22, Math.max(8, maxOverlap)); // clamp to [8, 22]
            const totalWidth = OVERLAP * (total - 1) + cardW;
            const startX = -totalWidth / 2;
            return playerHand.map((card, ci) => {
              const isLegal = mustOpenWith2C
                ? (card.rank==="2" && card.suit==="♣")
                : card.isJoker
                ? true
                : trickPlays.length === 0
                ? (!isDiamond(card) || canLeadDiamond)
                : (!ledSuit || card.suit===ledSuit || !playerHand.some(c=>!c.isJoker&&c.suit===ledSuit));
              const isSelected = selectedCard?.id === card.id;
              const xPos = startX + ci * OVERLAP;

              return (
                <div
                  key={card.id}
                  onClick={isPlayerTurn ? ()=>setSelectedCard(isSelected ? null : card) : undefined}
                  style={{
                    position:"absolute",
                    left:`calc(50% + ${xPos}px)`,
                    bottom: isSelected ? 20 : 0,
                    zIndex: isSelected ? total + 10 : ci,
                    cursor: isPlayerTurn ? "pointer" : "default",
                    transition:"bottom 0.15s ease",
                    filter: (!isPlayerTurn || !isLegal) ? "brightness(0.55)" : "none",
                  }}
                >
                  <CardComp
                    card={card}
                    selected={isSelected}
                    dimmed={false}
                    deckTheme={deckTheme}
                  />
                </div>
              );
            });
          })()}
          {playerHand.length===0 && (
            <div style={{color:"#00000044",fontSize:12,fontStyle:"italic"}}>No cards left</div>
          )}
          </div>
        </div>

        <div style={{display:"flex",justifyContent:"center",gap:10,marginTop:6}}>
          {selectedCard && isPlayerTurn && (
            <div style={{
              background:"#c9a84c11",border:"1px solid #c9a84c33",
              borderRadius:8,padding:"5px 12px",
              color:"#c9a84c88",fontSize:11,fontWeight:700,
              display:"flex",alignItems:"center",gap:6,
            }}>
              Playing: <strong style={{color:"#c9a84c"}}>{selectedCard.isJoker?"🃏 Joker":selectedCard.rank+selectedCard.suit}</strong>
              {!selectedIsLegal&&<span style={{color:"#ff6666",fontSize:10}}>{mustOpenWith2C?" ✗ must open with 2♣":" ✗ must follow "+ledSuit}</span>}
            </div>
          )}
          <GoldBtn
            onClick={()=>{ if(selectedCard&&selectedIsLegal) playCard(selectedCard); }}
            disabled={!canPlay||!selectedIsLegal}
          >
            {isPlayerTurn ? "Play Card" : "Waiting…"}
          </GoldBtn>
        </div>
      </div>

      {/* MODALS */}
      {phase==="kidnap"&&kidnapState&&kidnapState.jokerPlayerIdx===0&&(
        <KidnapModal
          hands={hands}
          jokerPlayerIdx={0}
          allNames={allNames}
          onSteal={handleKidnap}
          deckTheme={deckTheme}
        />
      )}

      {phase==="rescue"&&rescueState&&rescueState.acePlayerIdx===0&&(
        <RescueModal
          hands={hands}
          acePlayerIdx={0}
          allNames={allNames}
          onRescue={handleRescue}
          deckTheme={deckTheme}
        />
      )}

      {phase==="trickresult"&&trickResult&&(
        <TrickResultModal
          result={trickResult}
          allNames={allNames}
          onContinue={afterTrickResult}
          isGameOver={pendingFireworks || totalScores.some(s=>s>=WIN_SCORE)}
          isHandOver={trickResult?.americanFamily || hands.every(h=>h.length===0)}
        />
      )}

      {phase==="roundover"&&(
        <RoundOverModal
          scores={totalScores}
          allNames={allNames}
          roundScores={roundScores}
          onContinue={startNextRound}
        />
      )}

      {phase==="gameover"&&(
        <GameOverModal
          scores={totalScores}
          allNames={allNames}
          onRestart={()=>{ setScreen("menu"); }}
        />
      )}

      {showRules&&<RulesPanel onClose={()=>setShowRules(false)}/>}

      {/* CUTTING YOUR TEETH — interrupts immediately when a diamond is played */}
      {phase==="cuttingteeth_interrupt" && (
        <EventBox
          borderColor="#cc1111"
          emoji="💎"
          title="Cutting Your Teeth!"
          btnLabel="PROCEED"
          onContinue={() => {
            const cont = pendingPlayContinuation;
            setPendingPlayContinuation(null);
            setPhase("playing");
            if (cont) continuePlayFlow(cont.playerIdx, cont.card, cont.newPlays, cont.newHands);
          }}
        >
          <div style={{
            color:"#e2c97ecc", fontSize:14,
            fontFamily:"Georgia,serif", lineHeight:1.9,
          }}>
            Dimonds are broken<br/>
            <span style={{color:"#e2c97e",fontWeight:700}}>— dimonds become trump suit!</span>
          </div>
        </EventBox>
      )}

      {/* FIREWORKS */}
      {showFireworks && (
        <Fireworks onDone={()=>{ setShowFireworks(false); setPhase("gameover"); }}/>
      )}

      <style>{`
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
        @keyframes slideIn { from{opacity:0;transform:translateX(-50%) translateY(-10px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
        @keyframes pop { 0%{transform:scale(0.5);opacity:0} 60%{transform:scale(1.2)} 100%{transform:scale(1);opacity:1} }
        ::-webkit-scrollbar { width: 0; height: 0; background: transparent; }
        * { scrollbar-width: none; }
      `}</style>
    </div>
  );
}

const _container = document.getElementById("root");
const _root = ReactDOM.createRoot(_container);
_root.render(React.createElement(DiamondsGame));
</script>
</body>
</html>
