// ============================================================
function DiamondsGame() {
  const [screen, setScreen] = useState("menu"); // menu | game | gameover
  const [playerName, setPlayerName] = useState("You");
  const [nameInput, setNameInput] = useState("");
  const [showRules, setShowRules] = useState(false);
  const [deckTheme, setDeckTheme] = useState("skyscraper");
  const [soundOn, setSoundOn] = useState(true);

  // Keep the module-level sound flag in sync with React state
  useEffect(() => { setSoundEnabled(soundOn); }, [soundOn]);

  // Lock body scroll on menu, allow it during gameplay
  useEffect(() => {
    if (typeof document === "undefined") return;
    if (screen === "menu") {
      document.body.removeAttribute("data-scroll");
    } else {
      document.body.setAttribute("data-scroll", "1");
    }
  }, [screen]);

  // Game state
  const [hands, setHands] = useState([[],[],[],[]]);
  const [totalScores, setTotalScores] = useState([0,0,0,0]);
  const [roundScores, setRoundScores] = useState([0,0,0,0]);
  const [trickPlays, setTrickPlays] = useState([]); // [{playerIdx, card}]
  const [currentLeader, setCurrentLeader] = useState(0);
  const [currentTurn, setCurrentTurn] = useState(0); // index in turn order
  const [turnOrder, setTurnOrder] = useState([0,1,2,3]);
  const [selectedCard, setSelectedCard] = useState(null);
  const [dealing, setDealing] = useState(false); // true briefly at round start for deal-out animation
  const [flyingCards, setFlyingCards] = useState([]); // overlay cards animating between points
  const scorePanelRefs = useRef([null,null,null,null]); // DOM nodes of the 4 score tiles
  const trickAreaRef = useRef(null); // trick cards container
  const handAreaRef = useRef(null); // player's hand container
  const [phase, setPhase] = useState("playing"); // playing | kidnap | rescue | trickresult | roundover | gameover
  const [trickResult, setTrickResult] = useState(null);
  const [kidnapState, setKidnapState] = useState(null);
  const [rescueState, setRescueState] = useState(null);
  const [acesLowState, setAcesLowState] = useState(null); // { playerIdx, hands, plays, returnPhase, return* }
  const [acesLowOffered, setAcesLowOffered] = useState([false, false, false, false]);
  const [roundNum, setRoundNum] = useState(1);
  const [tricksPlayed, setTricksPlayed] = useState(0);
  const [isFirstTrick, setIsFirstTrick] = useState(true);
  const [gameLog, setGameLog] = useState([]);
  const [pendingAF, setPendingAF] = useState(false); // american family detected
  const [showFireworks, setShowFireworks] = useState(false);
  const [fireworksPlace, setFireworksPlace] = useState(1);
  const [theStealState, setTheStealState] = useState(null); // { playerIdx, hands }
  const [theStealOffered, setTheStealOffered] = useState([false,false,false,false]);
  const [dealRevealIdx, setDealRevealIdx] = useState(13); // cards at index < this are face-up
  const [robbinSummonState, setRobbinSummonState] = useState(null); // { jackPlayerIdx, jokerPlayerIdx, batmanHolderIdx, hands, resultObj, gameWon, newTotal }
  const [showAceCelebration, setShowAceCelebration] = useState(false);
  const [pendingFireworks, setPendingFireworks] = useState(false);
  const [diamondsBroken, setDiamondsBroken] = useState(false);
  const [pendingPlayContinuation, setPendingPlayContinuation] = useState(null); // CYT interrupt
  const allNames = [playerName, ...AI_NAMES];

  const isPlayerTurn = phase==="playing" && turnOrder[currentTurn]===0;
  const ledSuit = trickPlays.length > 0 && !trickPlays[0].card.isJoker ? trickPlays[0].card.suit : null;
  const mustOpenWith2C = isFirstTrick && trickPlays.length === 0 && isPlayerTurn;

  // Auto-skip human player if their hand is empty
  useEffect(() => {
    if (!isPlayerTurn || hands[0]?.length > 0) return;
    const timer = setTimeout(() => {
      const remaining = turnOrder.slice(currentTurn + 1).filter(p => hands[p]?.length > 0);
      if (remaining.length === 0 && trickPlays.length > 0) {
        resolveTrickComplete(trickPlays, hands);
      } else {
        setCurrentTurn(t => t + 1);
      }
    }, 300);
    return () => clearTimeout(timer);
  }, [isPlayerTurn, currentTurn]);

  // THE STEAL: check at the start of any player's turn (no cards played yet in the trick)
  useEffect(() => {
    if (phase !== "playing") return;
    if (trickPlays.length > 0) return;
    const cp = turnOrder[currentTurn];
    if (theStealOffered[cp]) return;
    if (!checkTheSteal(hands[cp] || [])) return;
    // Mark offered so it only fires once per round per player
    setTheStealOffered(prev => { const n=[...prev]; n[cp]=true; return n; });
    if (cp === 0) {
      // Human player — show THE STEAL modal
      setTheStealState({ playerIdx: 0, hands: hands.map(h=>[...h]) });
      setPhase("thesteal");
    } else {
      // AI player — auto Play On (keep going, +21 pts, discard the 3 cards)
      const stolenCards = hands[cp].filter(c => c.isJoker || isJackDiamond(c) || isBatman(c));
      const newHands = hands.map((h,i)=>i===cp ? h.filter(c=>!c.isJoker&&!isJackDiamond(c)&&!isBatman(c)) : h);
      setHands(newHands);
      setRoundScores(prev=>{ const n=[...prev]; n[cp]+=THE_STEAL_BONUS; return n; });
      addLog(`🌇 ${allNames[cp]} triggers THE STEAL! +${THE_STEAL_BONUS} pts. Playing on…`);
      soundTheSteal();
    }
  }, [phase, currentTurn, trickPlays.length]);

  // Auto-claim sweep: if any player (including human) starts a trick alone with cards,
  // they sweep all their remaining cards automatically — no manual play required.
  useEffect(() => {
    if (phase !== "playing") return;
    if (trickPlays.length > 0) return; // only at the start of a trick
    const playersWithCards = hands.map((h, i) => h.length > 0 ? i : -1).filter(i => i >= 0);
    if (playersWithCards.length !== 1) return;
    const solo = playersWithCards[0];
    const timer = setTimeout(() => {
      setTrickResult({ winnerIdx: solo, plays: [], diamondsCaptured: [], autoClaim: true });
      setPhase("trickresult");
    }, 400);
    return () => clearTimeout(timer);
  }, [phase, currentTurn, hands, trickPlays.length]);

  function addLog(msg) {
    setGameLog(prev => [msg, ...prev].slice(0,30));
  }

  // ---- Start a new round ----
  function startRound(existingScores) {
    const newHands = dealCards();
    const leader = findLeader(newHands);
    const order = [0,1,2,3].map(i=>(leader+i)%4);
    setHands(newHands);
    setTrickPlays([]);
    setCurrentLeader(leader);
    setCurrentTurn(0);
    setTurnOrder(order);
    setSelectedCard(null);
    setPhase("playing");
    setTrickResult(null);
    setKidnapState(null);
    setRescueState(null);
    setAcesLowState(null);
    setRobbinSummonState(null);
    setAcesLowOffered([false,false,false,false]);
    setTheStealOffered([false,false,false,false]);
    setRoundScores([0,0,0,0]);
    setTricksPlayed(0);
    setIsFirstTrick(true);
    setDiamondsBroken(false);
    setDealRevealIdx(-1);
    setDealing(true);
    setTimeout(()=>{
      setDealing(false);
      let idx = 0;
      const flipInterval = setInterval(()=>{
        idx++;
        setDealRevealIdx(idx);
        if (idx >= newHands[0].length) clearInterval(flipInterval);
      }, 110);
    }, 1150);
  }

  function startGame() {
    setTotalScores([0,0,0,0]);
    setRoundNum(1);
    setGameLog([]);
    setScreen("game");
    const newHands = dealCards();
    const leader = findLeader(newHands);
    const order = [0,1,2,3].map(i=>(leader+i)%4);
    setHands(newHands);
    setTrickPlays([]);
    setCurrentLeader(leader);
    setCurrentTurn(0);
    setTurnOrder(order);
    setSelectedCard(null);
    setPhase("playing");
    setTrickResult(null);
    setKidnapState(null);
    setRescueState(null);
    setAcesLowState(null);
    setRobbinSummonState(null);
    setAcesLowOffered([false,false,false,false]);
    setTheStealOffered([false,false,false,false]);
    setRoundScores([0,0,0,0]);
    setTricksPlayed(0);
    setIsFirstTrick(true);
    setDiamondsBroken(false);
    setDealRevealIdx(-1);
    setDealing(true);
    setTimeout(()=>{
      setDealing(false);
      let idx = 0;
      const flipInterval = setInterval(()=>{
        idx++;
        setDealRevealIdx(idx);
        if (idx >= newHands[0].length) clearInterval(flipInterval);
      }, 110);
    }, 1150);
  }

  // ---- Play a card ----
  function playCard(card) {
    if (!isPlayerTurn) return;
    // Joker is ALWAYS playable — no restrictions
    if (card.isJoker) { submitPlay(0, card); return; }
    if (mustOpenWith2C && !(card.rank==="2" && card.suit==="♣")) return;
    // Trump rule: can't lead with a diamond until diamonds are broken
    if (!diamondsBroken && trickPlays.length === 0 && isDiamond(card)) {
      const nonDiamonds = hands[0].filter(c => !isDiamond(c) && !c.isJoker);
      if (nonDiamonds.length > 0) return;
    }
    // Follow suit if possible
    if (ledSuit) {
      const hasSuit = hands[0].some(c => !c.isJoker && c.suit === ledSuit);
      if (hasSuit && card.suit !== ledSuit) return;
    }
    submitPlay(0, card);
  }

  function submitPlay(playerIdx, card) {
    soundCardPlay();

    const newPlays = [...trickPlays, { playerIdx, card }];
    const newHands = hands.map((h,i) => i===playerIdx ? h.filter(c=>c.id!==card.id) : h);
    setHands(newHands);
    setTrickPlays(newPlays);

    // Cutting Your Teeth — INTERRUPT the trick immediately on first diamond played
    const justBrokeDimonds = !diamondsBroken && isDiamond(card);
    if (justBrokeDimonds) {
      setDiamondsBroken(true);
      soundCuttingYourTeeth();
      addLog("♦ Cutting Your Teeth — Dimonds are now in play!");
      // Stash continuation; PROCEED on CYT modal will resume the trick flow
      setPendingPlayContinuation({ playerIdx, card, newPlays, newHands });
      setPhase("cuttingteeth_interrupt");
      return;
    }

    continuePlayFlow(playerIdx, card, newPlays, newHands);
  }

  function continuePlayFlow(playerIdx, card, newPlays, newHands) {
    // Check American Family for any player after each play
    for (let i=0; i<4; i++) {
      if (checkAmericanFamily(newHands[i])) {
        handleAmericanFamily(i, newHands, newPlays);
        return;
      }
    }

    // Check Aces Low — four aces gathered in one hand → offer cash-in
    for (let i=0; i<4; i++) {
      if (!acesLowOffered[i] && checkAcesLow(newHands[i])) {
        // Mark offered so we don't ask again later in the round
        setAcesLowOffered(prev => { const next = [...prev]; next[i] = true; return next; });
        // For AI: auto-decide. For human: open modal.
        if (i === 0) {
          // Stash continuation so PROCEED on the offer resumes the trick
          setAcesLowState({ playerIdx:i, hands:newHands, plays:newPlays, continuation:{playerIdx, card, newPlays, newHands} });
          setPhase("aceslow_offer");
          return;
        } else {
          // AI: hold if they have 3+ American Family cards in hand (pushing for the bigger 35pt set);
          // otherwise cash the 10 immediately.
          const familyIds = ["J♦","Q♦","K♦","A♦"];
          const familyCount = newHands[i].filter(c => familyIds.includes(c.id)).length;
          const aiCashesIn = familyCount < 3;
          if (aiCashesIn) {
            const newRoundScores = [...roundScores];
            newRoundScores[i] += ACES_LOW_BONUS;
            setRoundScores(newRoundScores);
            addLog(`✈️ ${allNames[i]} cashes in Aces Low (+${ACES_LOW_BONUS} pts)`);
            soundAcesLow();
            // Stash continuation so dismissing the event resumes the trick
            setAcesLowState({
              playerIdx:i, hands:newHands, plays:newPlays,
              continuation:{playerIdx, card, newPlays, newHands},
              cashed:true, points:ACES_LOW_BONUS,
            });
            setPhase("aceslow_event");
            return;
          } else {
            addLog(`✈️ ${allNames[i]} HOLDS Aces Low — pushing for bigger sets`);
            // No event box for AI holds — silent decision, play continues
          }
        }
      }
    }

    // AUTO-CLAIM: if everyone but one player is out of cards, that player
    // automatically wins all their remaining cards as solo tricks.
    const playersWithCards = newHands.map((h, i) => h.length > 0 ? i : -1).filter(i => i >= 0);
    if (playersWithCards.length === 1 && newPlays.length === 4) {
      // Trick fully played AND only one player has cards left → resolve this trick,
      // then auto-claim will trigger from afterTrickResult on the next round-end check.
      resolveTrickComplete(newPlays, newHands);
      return;
    }
    if (playersWithCards.length <= 1) {
      // Mid-trick or after this play, only one player has cards.
      // Resolve whatever plays we have now, then auto-claim remaining.
      resolveTrickComplete(newPlays, newHands);
      return;
    }

    if (newPlays.length === 4) {
      // Trick complete
      resolveTrickComplete(newPlays, newHands);
    } else {
      // Advance currentTurn, skipping any players with no cards
      let nextTurn = currentTurn + 1;
      while (nextTurn < 4 && newHands[turnOrder[nextTurn]]?.length === 0) {
        nextTurn++;
      }
      if (nextTurn >= 4) {
        // No more players have cards in this trick → resolve what we have
        resolveTrickComplete(newPlays, newHands);
      } else {
        setCurrentTurn(nextTurn);
        setTrickPlays(newPlays);
        setHands(newHands);
      }
    }
  }

  function handleAmericanFamily(playerIdx, currentHands, currentPlays) {
    const newRoundScores = [...roundScores];
    newRoundScores[playerIdx] += AMERICAN_FAMILY_BONUS;

    const newTotal = totalScores.map((s,i)=>s+(newRoundScores[i]||0));
    setRoundScores(newRoundScores);
    setTotalScores(newTotal);
    addLog(`🇺🇸 ${allNames[playerIdx]} completes The American Family! +${AMERICAN_FAMILY_BONUS} pts`);
    soundAmericanFamily();

    // Collect the family cards for display
    const familyCards = ["A♦","J♦","Q♦","K♦"].map(id =>
      [...currentHands[playerIdx], ...currentPlays.map(p=>p.card)].find(c=>c.id===id)
    ).filter(Boolean);

    setTrickResult({
      winnerIdx: playerIdx,
      americanFamily: true,
      familyCards,
      plays: currentPlays,
      diamondsCaptured: [],
    });
    setPhase("trickresult");
    // Note: pendingAF removed — afterTrickResult handles AF via the americanFamily flag
  }

  function resolveTrickComplete(plays, currentHands) {
    const result = resolveTrick(plays, diamondsBroken);
    const winner = result.winnerIdx;
    const trickCards = plays.map(p=>p.card);
    const capturedDiamonds = trickCards.filter(c=>isDiamond(c));
    const batmanBlocked = !!result.batmanWin;
    const batmanBlockedRobbin = !!result.batmanBlockedRobbin;
    const batmanBlockedJoker  = !!result.batmanBlockedJoker;

    const newRoundScores = [...roundScores];
    const pointsWon = capturedDiamonds.reduce((sum,c)=>sum+diamondPoints(c),0);
    newRoundScores[winner] += pointsWon;

    // Ace of Spades bonus — +35 for blocking The Joker OR Robbin Jack (or both)
    const aceBonus = batmanBlocked ? 35 : 0;
    if (batmanBlocked) {
      newRoundScores[winner] += aceBonus;
      if (batmanBlockedJoker && batmanBlockedRobbin) soundBlockBoth();
      else if (batmanBlockedRobbin) soundBlockRobbin();
      else soundAceSuccess();
    }

    // ACE OF SPADES RESCUE: A♠ played and NO Joker AND NO J♦ in trick → rescue fires
    const acePlay = plays.find(p => isBatman(p.card));
    const trickHasJoker   = plays.some(p => p.card.isJoker);
    const trickHasJackD   = plays.some(p => isJackDiamond(p.card));
    const aceRescueTriggered = acePlay && !trickHasJoker && !trickHasJackD;
    const acePlayerIdx = aceRescueTriggered ? acePlay.playerIdx : null;

    // ROBBIN JACK: J♦ in trick, no Batman → rob fires after normal trick resolution
    const jackDRobTriggered = !!result.jackDiamondRob && !batmanBlocked;
    const jackDPlayerIdx = jackDRobTriggered ? result.jackDiamondPlayerIdx : null;

    // Play sound based on outcome
    if (pointsWon > 0 && !batmanBlocked && !aceRescueTriggered && !jackDRobTriggered) soundDiamondTrick();

    // Logging
    if (batmanBlocked) {
      const what = batmanBlockedJoker && batmanBlockedRobbin
        ? "The Joker AND Robbin Jack"
        : batmanBlockedJoker ? "The Joker" : "Robbin Jack";
      addLog(`♠ ${allNames[winner]} (Ace of Spades) blocks ${what}! +${aceBonus} pts bonus!`);
    } else if (aceRescueTriggered) {
      addLog(`🗡️ ${allNames[acePlayerIdx]} played the Ace of Spades — preparing rescue...`);
    } else if (jackDRobTriggered) {
      addLog(`🎴 ${allNames[jackDPlayerIdx]} (Robbin Jack) prepares to rob...`);
    } else {
      addLog(`${allNames[winner]} wins trick (+${pointsWon}💎)`);
    }

    setRoundScores(newRoundScores);

    // Check if any player has hit 80 mid-trick
    const newTotal = totalScores.map((s,i)=>s+(newRoundScores[i]||0));
    const gameWon = newTotal.some(s=>s>=WIN_SCORE);

    const resultObj = {
      winnerIdx: winner,
      jokerWin: result.jokerWin,
      batmanBlocked,
      batmanBlockedJoker,
      batmanBlockedRobbin,
      jackDiamondRob: result.jackDiamondRob,
      jackDiamondPlayerIdx: result.jackDiamondPlayerIdx,
      plays,
      diamondsCaptured: capturedDiamonds,
    };

    if (result.jokerWin) {
      setTimeout(() => {
        const hasTargets = currentHands.some((h, i) => i !== winner && h.length > 0);
        if (!hasTargets) {
          addLog(`🃏 ${allNames[winner]} wins with the Joker (no cards left to kidnap)`);
          setTrickResult({ ...resultObj, jokerWin: true });
          const allEmpty = currentHands.every(h=>h.length===0);
          if (allEmpty || gameWon) {
            setTotalScores(newTotal);
            if (gameWon) setPendingFireworks(true);
          }
          setPhase("trickresult");
          return;
        }
        // Robin Gambit: J♦ in same trick + A♠ still available + J♦ player is human → show summon choice
        const jackDPlayerForSummon = result.jackDiamondRob ? result.jackDiamondPlayerIdx : undefined;
        const batmanHolderForSummon = currentHands.findIndex(h => h.some(c => isBatman(c)));
        if (jackDPlayerForSummon === 0 && batmanHolderForSummon !== -1) {
          setRobbinSummonState({ jackPlayerIdx: jackDPlayerForSummon, jokerPlayerIdx: winner, batmanHolderIdx: batmanHolderForSummon, hands: currentHands, resultObj, gameWon, newTotal });
          setPhase("robbinsummon");
          return;
        }
        setKidnapState({ jokerPlayerIdx: winner, hands: currentHands, resultObj });
        setPhase("kidnap");
      }, 600);
    } else if (jackDRobTriggered) {
      // Robbin Jack robs — uses same modal/flow as Kidnap but attributed to J♦ player
      setTimeout(() => {
        const hasTargets = currentHands.some((h, i) => i !== jackDPlayerIdx && h.length > 0);
        if (!hasTargets) {
          addLog(`🎴 ${allNames[jackDPlayerIdx]} (Robbin Jack) — no cards left to rob`);
          setTrickResult({ ...resultObj, jackDiamondRob: true });
          const allEmpty = currentHands.every(h=>h.length===0);
          if (allEmpty || gameWon) {
            setTotalScores(newTotal);
            if (gameWon) setPendingFireworks(true);
          }
          setPhase("trickresult");
          return;
        }
        setKidnapState({ jokerPlayerIdx: jackDPlayerIdx, isRobbinJack: true, hands: currentHands, resultObj });
        setPhase("kidnap");
      }, 600);
    } else if (aceRescueTriggered) {
      setTimeout(() => {
        const hasTargets = currentHands.some((h, i) => i !== acePlayerIdx && h.length > 0);
        if (!hasTargets) {
          addLog(`♠ ${allNames[acePlayerIdx]} played the Ace of Spades (no cards left to rescue)`);
          setTrickResult(resultObj);
          const allEmpty = currentHands.every(h=>h.length===0);
          if (allEmpty || gameWon) {
            setTotalScores(newTotal);
            if (gameWon) setPendingFireworks(true);
          }
          setPhase("trickresult");
          return;
        }
        setRescueState({ acePlayerIdx, hands: currentHands, resultObj });
        setPhase("rescue");
      }, 600);
    } else {
      setTimeout(() => {
        setTrickResult(resultObj);
        const allEmpty = currentHands.every(h=>h.length===0);
        if (allEmpty || gameWon) {
          setTotalScores(newTotal);
          if (gameWon) setPendingFireworks(true);
        }
        setPhase("trickresult");
      }, 600);
    }
  }

  function checkRoundOver(currentHands, currentRoundScores, lastWinner) {
    // No longer needed — handled inline
  }

  function handleKidnap(fromPlayer, cardIdx) {
    if (!kidnapState) return; // safety guard
    const currentHands = kidnapState.hands; // use snapshot, not stale closure
    const stolenCard = currentHands[fromPlayer][cardIdx];
    const jokerPlayerIdx = kidnapState.jokerPlayerIdx;

    const newHands = currentHands.map((h,i) => {
      if (i === fromPlayer) return h.filter((_,ci)=>ci!==cardIdx);
      if (i === jokerPlayerIdx) return [...h, stolenCard];
      return h;
    });

    const isRobbin = !!kidnapState.isRobbinJack;
    addLog(isRobbin
      ? `🎴 ${allNames[jokerPlayerIdx]} (Robbin Jack) robs from ${allNames[fromPlayer]}!`
      : `🃏 ${allNames[jokerPlayerIdx]} kidnaps from ${allNames[fromPlayer]}!`);
    soundJokerKidnaps();
    // Steal arc — card flies from victim to the thief
    flyCardBetweenPlayers(stolenCard, fromPlayer, jokerPlayerIdx);

    for (let i=0; i<4; i++) {
      if (checkAmericanFamily(newHands[i])) {
        setHands(newHands);
        // Show the Joker Kidnaps event box FIRST, then chain to American Family
        // on PROCEED. The pendingAmericanFamily payload is consumed in afterTrickResult.
        setTrickResult({
          ...kidnapState.resultObj,
          jokerWin: !isRobbin,
          jackDiamondRob: isRobbin,
          jackDiamondPlayerIdx: isRobbin ? jokerPlayerIdx : undefined,
          stolenCard,
          stolenFrom: fromPlayer,
          pendingAmericanFamily: {
            playerIdx: i,
            hands: newHands,
            plays: kidnapState.resultObj.plays,
          },
        });
        setKidnapState(null);
        setPhase("trickresult");
        return;
      }
    }

    setHands(newHands);
    const resultObj = { ...kidnapState.resultObj, jokerWin: !isRobbin, jackDiamondRob: isRobbin, jackDiamondPlayerIdx: isRobbin ? jokerPlayerIdx : undefined, stolenCard, stolenFrom: fromPlayer };

    // If Joker kidnapped AND J♦ was also in same trick, show Joker event first, then PROCEED → J♦ rob
    const pendingRobbinRob = !isRobbin && kidnapState.resultObj?.jackDiamondRob;
    const pendingRobbinIdx = kidnapState.resultObj?.jackDiamondPlayerIdx;
    if (pendingRobbinRob && pendingRobbinIdx !== undefined) {
      const hasTargets = newHands.some((h,i) => i !== pendingRobbinIdx && h.length > 0);
      if (hasTargets) {
        setTrickResult({ ...resultObj, pendingRobbinKidnap: { jackPlayerIdx: pendingRobbinIdx, hands: newHands } });
        setKidnapState(null);
        setPhase("trickresult");
        return;
      }
      addLog(`🎴 ${allNames[pendingRobbinIdx]} (Robbin Jack) — no cards left to rob`);
    }

    setTrickResult(resultObj);
    setKidnapState(null);
    setPhase("trickresult");

    const allEmpty = newHands.every(h=>h.length===0);
    if (allEmpty) {
      const newTotal = totalScores.map((s,i)=>s+(roundScores[i]||0));
      setTotalScores(newTotal);
      if (newTotal.some(s=>s>=WIN_SCORE)) setPendingFireworks(true);
    }
  }

  function handleKidnapSkip() {
    if (!kidnapState) return;
    const isRobbin = !!kidnapState.isRobbinJack;
    const jackPlayerIdx = kidnapState.jokerPlayerIdx;

    if (!isRobbin) {
      addLog(`🃏 ${allNames[jackPlayerIdx]} releases their kidnap.`);
      setTrickResult({ ...kidnapState.resultObj, jokerWin: true, jackDiamondRob: false });
      setKidnapState(null);
      setPhase("trickresult");
      return;
    }

    // Robbin Jack chose not to rob — Robin Gambit
    const isChainedAfterJoker = !!kidnapState.resultObj.jokerWin;
    const currentHands = kidnapState.hands;
    const batmanHolder = currentHands.findIndex(h => h.some(c => isBatman(c)));
    const aceAvailable = batmanHolder !== -1;

    if (aceAvailable && !isChainedAfterJoker) {
      // Summon A♠ for rescue — A♠ holder rescues, J♦ player gets +1 pt
      const newHands = currentHands.map((h,i) => i===batmanHolder ? h.filter(c=>!isBatman(c)) : h);
      addLog(`🎴 ${allNames[jackPlayerIdx]} summons The Ace of Spades! ${allNames[batmanHolder]} gets a rescue. +1 pt to Robin.`);
      soundAceRescue();
      setRoundScores(prev=>{ const n=[...prev]; n[jackPlayerIdx]+=1; return n; });
      setHands(newHands);
      setKidnapState(null);
      const rescueResultObj = { ...kidnapState.resultObj, jokerWin: false, jackDiamondRob: false, robbinSummon: true };
      const hasRescueTargets = newHands.some((h,i) => i !== batmanHolder && h.length > 0);
      if (!hasRescueTargets) {
        addLog(`♠ ${allNames[batmanHolder]} — no cards left to rescue.`);
        setTrickResult(rescueResultObj);
        setPhase("trickresult");
      } else {
        setRescueState({ acePlayerIdx: batmanHolder, hands: newHands, resultObj: rescueResultObj });
        setPhase("rescue");
      }
    } else {
      // A♠ already played — +1 pt consolation (unless chained after Joker who already acted)
      if (!isChainedAfterJoker) {
        addLog(`🎴 ${allNames[jackPlayerIdx]} (Robbin Jack) chooses not to rob. +1 pt for the attempt.`);
        setRoundScores(prev=>{ const n=[...prev]; n[jackPlayerIdx]+=1; return n; });
      } else {
        addLog(`🎴 ${allNames[jackPlayerIdx]} (Robbin Jack) chooses not to rob.`);
      }
      setTrickResult({ ...kidnapState.resultObj, jokerWin: isChainedAfterJoker, jackDiamondRob: false });
      setKidnapState(null);
      setPhase("trickresult");
    }
  }

  function handleRobbinSummonYes() {
    if (!robbinSummonState) return;
    const { jackPlayerIdx, jokerPlayerIdx, batmanHolderIdx, hands: currentHands, resultObj, gameWon, newTotal } = robbinSummonState;
    // Remove A♠ from holder's hand (summoned)
    const newHands = currentHands.map((h,i) => i===batmanHolderIdx ? h.filter(c=>!isBatman(c)) : h);
    setHands(newHands);
    setRoundScores(prev=>{ const n=[...prev]; n[batmanHolderIdx]+=35; return n; });
    addLog(`🎴 ${allNames[jackPlayerIdx]} summons The Ace of Spades! Joker BLOCKED! ${allNames[batmanHolderIdx]} gets +35! ${allNames[jackPlayerIdx]} wins the trick!`);
    soundBatmanBlocks();
    const updatedResult = { ...resultObj, winnerIdx: jackPlayerIdx, jokerWin: false, jackDiamondRob: false, batmanBlocked: true, batmanBlockedJoker: true, robbinSummon: true };
    setTrickResult(updatedResult);
    setRobbinSummonState(null);
    if (gameWon) { setTotalScores(newTotal); setPendingFireworks(true); }
    setPhase("trickresult");
  }

  function handleRobbinSummonNo() {
    if (!robbinSummonState) return;
    const { jokerPlayerIdx, hands: currentHands, resultObj } = robbinSummonState;
    setRobbinSummonState(null);
    setKidnapState({ jokerPlayerIdx, hands: currentHands, resultObj });
    setPhase("kidnap");
  }

  function handleTheStealEndRound() {
    if (!theStealState) return;
    const pi = theStealState.playerIdx;
    const newRound = [...roundScores];
    newRound[pi] += THE_STEAL_BONUS;
    const newTotal = totalScores.map((s,i) => s + newRound[i]);
    addLog(`🌇 THE STEAL — ${allNames[pi]} ends the round! +${THE_STEAL_BONUS} pts.`);
    soundTheSteal();
    setTheStealState(null);
    setPhase("playing");
    const gameOver = newTotal.some(s=>s>=WIN_SCORE);
    if (gameOver) {
      setTotalScores(newTotal);
      const sorted = [...newTotal].sort((a,b)=>b-a);
      const place = sorted.indexOf(newTotal[0]) + 1;
      setFireworksPlace(Math.max(1,Math.min(4,place)));
      setTimeout(()=>{ soundRoundWin(); setShowFireworks(true); }, 600);
    } else {
      setRoundScores(newRound);
      setTotalScores(newTotal);
      soundRoundWin();
      setPhase("roundover");
      setRoundNum(r=>r+1);
    }
  }

  function handleTheStealPlayOn() {
    if (!theStealState) return;
    const pi = theStealState.playerIdx;
    addLog(`🌇 THE STEAL — ${allNames[pi]} plays on. The trio stays in hand.`);
    soundTheSteal();
    setTheStealState(null);
    setPhase("playing");
  }

  // ---- Ace of Spades Rescue: A♠ wins trick with no Joker present → rescue a card ----
  function handleRescue(fromPlayer, cardIdx) {
    if (!rescueState) return;
    const currentHands = rescueState.hands;
    const rescuedCard = currentHands[fromPlayer][cardIdx];
    const acePlayerIdx = rescueState.acePlayerIdx;

    const newHands = currentHands.map((h,i) => {
      if (i === fromPlayer) return h.filter((_,ci)=>ci!==cardIdx);
      if (i === acePlayerIdx) return [...h, rescuedCard];
      return h;
    });

    addLog(`🗡️ ${allNames[acePlayerIdx]} rescues from ${allNames[fromPlayer]}!`);
    soundAceRescue();
    // Rescue arc — card flies from the other player to the Ace player
    flyCardBetweenPlayers(rescuedCard, fromPlayer, acePlayerIdx);

    // Check American Family on the Ace player's new hand
    for (let i=0; i<4; i++) {
      if (checkAmericanFamily(newHands[i])) {
        setHands(newHands);
        setTrickResult({
          ...rescueState.resultObj,
          aceRescued: true,
          aceRescuerIdx: acePlayerIdx,
          rescuedCard,
          rescuedFrom: fromPlayer,
          pendingAmericanFamily: {
            playerIdx: i,
            hands: newHands,
            plays: rescueState.resultObj.plays,
          },
        });
        setRescueState(null);
        setPhase("trickresult");
        return;
      }
    }

    setHands(newHands);
    const resultObj = { ...rescueState.resultObj, aceRescued: true, aceRescuerIdx: acePlayerIdx, rescuedCard, rescuedFrom: fromPlayer };
    setTrickResult(resultObj);
    setRescueState(null);
    setPhase("trickresult");

    const allEmpty = newHands.every(h=>h.length===0);
    if (allEmpty) {
      const newTotal = totalScores.map((s,i)=>s+(roundScores[i]||0));
      setTotalScores(newTotal);
      if (newTotal.some(s=>s>=WIN_SCORE)) setPendingFireworks(true);
    }
  }

  // ---- Aces Low: human chose CASH IT ----
  function acceptAcesLow() {
    if (!acesLowState) return;
    const { playerIdx, continuation } = acesLowState;
    const newRoundScores = [...roundScores];
    newRoundScores[playerIdx] += ACES_LOW_BONUS;
    setRoundScores(newRoundScores);
    addLog(`✈️ ${allNames[playerIdx]} cashes in Aces Low (+${ACES_LOW_BONUS} pts)`);
    soundAcesLow();
    setAcesLowState({ ...acesLowState, cashed:true, points:ACES_LOW_BONUS });
    setPhase("aceslow_event");
  }

  // ---- Aces Low: human chose HOLD ----
  function declineAcesLow() {
    if (!acesLowState) return;
    const { playerIdx, continuation } = acesLowState;
    addLog(`✈️ ${allNames[playerIdx]} HOLDS Aces Low — pushing for bigger sets`);
    setAcesLowState(null);
    setPhase("playing");
    // Resume the trick flow that was interrupted
    if (continuation) {
      continuePlayFlow(continuation.playerIdx, continuation.card, continuation.newPlays, continuation.newHands);
    }
  }

  // ---- Aces Low: dismiss the event box (cash-in completed), resume play ----
  function dismissAcesLowEvent() {
    if (!acesLowState) return;
    const { continuation } = acesLowState;
    setAcesLowState(null);
    setPhase("playing");
    if (continuation) {
      continuePlayFlow(continuation.playerIdx, continuation.card, continuation.newPlays, continuation.newHands);
    }
  }

  // AI picks a card to rescue — prioritize American Family completion, else highest value
  function aiChooseRescueTarget(currentHands, playerIdx) {
    const myHand = currentHands[playerIdx];
    const familyIds = ["J♦","Q♦","K♦","A♦"];
    const myFamily = myHand.filter(c => familyIds.includes(c.id));

    // P1: AmFamily completion
    if (myFamily.length === 3) {
      const missing = familyIds.find(id => !myFamily.some(c => c.id === id));
      for (let i=0; i<4; i++) {
        if (i === playerIdx) continue;
        const idx = currentHands[i].findIndex(c => c.id === missing);
        if (idx >= 0) return { fromPlayer:i, cardIdx:idx };
      }
    }
    if (myFamily.length === 2) {
      const missing = familyIds.filter(id => !myFamily.some(c => c.id === id));
      for (let i=0; i<4; i++) {
        if (i === playerIdx) continue;
        for (const m of missing) {
          const idx = currentHands[i].findIndex(c => c.id === m);
          if (idx >= 0) return { fromPlayer:i, cardIdx:idx };
        }
      }
    }
    // P2: highest-value card from any opponent
    let best = null;
    for (let i=0; i<4; i++) {
      if (i === playerIdx) continue;
      currentHands[i].forEach((c, ci) => {
        const score = c.isJoker ? 999 : (isDiamond(c) ? 100 + diamondPoints(c)*5 : cardScore(c));
        if (!best || score > best.score) best = { fromPlayer:i, cardIdx:ci, score };
      });
    }
    return best ? { fromPlayer:best.fromPlayer, cardIdx:best.cardIdx } : null;
  }

  function afterTrickResult() {
    // Delay before firing fireworks, to let the event's tune finish playing
    const FIREWORKS_DELAY = 1000;

    // Joker kidnapped AND J♦ rob pending — open J♦ modal on PROCEED
    if (trickResult?.pendingRobbinKidnap) {
      const { jackPlayerIdx, hands: savedHands } = trickResult.pendingRobbinKidnap;
      setKidnapState({ jokerPlayerIdx: jackPlayerIdx, isRobbinJack: true, hands: savedHands, resultObj: trickResult });
      setPhase("kidnap");
      setTrickResult(null);
      return;
    }

    // If the Joker Kidnaps event is queued with a pending AF, fire AF now.
    // (User just dismissed the kidnap box; show The American Family Together next.)
    if (trickResult?.pendingAmericanFamily) {
      const af = trickResult.pendingAmericanFamily;
      handleAmericanFamily(af.playerIdx, af.hands, af.plays);
      return;
    }

    // American Family win — end round immediately
    if (trickResult?.americanFamily) {
      const gameOver = totalScores.some(s=>s>=WIN_SCORE);
      if (gameOver) {
        const _sorted = [...totalScores].sort((a,b)=>b-a);
        const _place = _sorted.indexOf(totalScores[0]) + 1;
        setFireworksPlace(Math.max(1,Math.min(4,_place)));
        setTimeout(() => { soundRoundWin(); setShowFireworks(true); }, FIREWORKS_DELAY);
      } else {
        soundRoundWin();
        setPhase("roundover");
        setRoundNum(r=>r+1);
      }
      return;
    }

    // If fireworks were pending (game won mid-trick), fire now after modal dismissed
    if (pendingFireworks) {
      setPendingFireworks(false);
      const _sorted = [...totalScores].sort((a,b)=>b-a);
      const _place = _sorted.indexOf(totalScores[0]) + 1;
      setFireworksPlace(Math.max(1,Math.min(4,_place)));
      setTimeout(() => { soundRoundWin(); setShowFireworks(true); }, FIREWORKS_DELAY);
      return;
    }

    const allEmpty = hands.every(h=>h.length===0);
    if (allEmpty) {
      const newRoundScores = [...roundScores];
      let leftoverLog = [];
      for (let i=0; i<4; i++) {
        const leftover = hands[i].filter(c => isDiamond(c));
        const pts = leftover.reduce((s,c) => s+diamondPoints(c), 0);
        if (pts > 0) {
          newRoundScores[i] += pts;
          leftoverLog.push(`${allNames[i]} +${pts}💎`);
        }
      }
      if (leftoverLog.length > 0) {
        addLog(`Leftover dimonds scored: ${leftoverLog.join(", ")}`);
        setRoundScores(newRoundScores);
      }
      const newTotal = totalScores.map((s,i)=>s+(newRoundScores[i]||0));
      setTotalScores(newTotal);
      const gameOver = newTotal.some(s=>s>=WIN_SCORE);
      if (gameOver) {
        const _sorted = [...newTotal].sort((a,b)=>b-a);
        const _place = _sorted.indexOf(newTotal[0]) + 1;
        setFireworksPlace(Math.max(1,Math.min(4,_place)));
        setTimeout(() => { soundRoundWin(); setShowFireworks(true); }, FIREWORKS_DELAY);
      } else {
        soundRoundWin();
        setPhase("roundover");
        setRoundNum(r=>r+1);
      }
      return;
    }

    // AUTO-CLAIM: if only one player has cards left, they win all their remaining cards
    // (each remaining card scores its dimond value to that player; cards are not played out)
    const playersWithCards = hands.map((h, i) => h.length > 0 ? i : -1).filter(i => i >= 0);
    if (playersWithCards.length === 1) {
      const soloPlayer = playersWithCards[0];
      const soloCards = hands[soloPlayer];
      const dimondPts = soloCards.filter(c => isDiamond(c)).reduce((s,c) => s+diamondPoints(c), 0);
      const newRoundScores = [...roundScores];
      newRoundScores[soloPlayer] += dimondPts;
      if (dimondPts > 0) {
        addLog(`✨ ${allNames[soloPlayer]} sweeps ${soloCards.length} unopposed card${soloCards.length!==1?"s":""} (+${dimondPts}💎)`);
      } else {
        addLog(`✨ ${allNames[soloPlayer]} sweeps ${soloCards.length} unopposed card${soloCards.length!==1?"s":""}`);
      }
      setRoundScores(newRoundScores);
      // Empty all hands — round is functionally over
      setHands([[],[],[],[]]);

      const newTotal = totalScores.map((s,i)=>s+(newRoundScores[i]||0));
      setTotalScores(newTotal);
      const gameOver = newTotal.some(s=>s>=WIN_SCORE);
      if (gameOver) {
        const _sorted = [...newTotal].sort((a,b)=>b-a);
        const _place = _sorted.indexOf(newTotal[0]) + 1;
        setFireworksPlace(Math.max(1,Math.min(4,_place)));
        setTimeout(() => { soundRoundWin(); setShowFireworks(true); }, FIREWORKS_DELAY);
      } else {
        soundRoundWin();
        setPhase("roundover");
        setRoundNum(r=>r+1);
        setTrickResult(null);
      }
      return;
    }

    const winner = trickResult.winnerIdx;
    // Trick-to-winner sweep: capture card + target positions, spawn flying overlays
    sweepTrickToWinner(trickPlays, winner);
    const newOrder = [0,1,2,3].map(i=>(winner+i)%4);
    setTurnOrder(newOrder);
    setCurrentTurn(0);
    setTrickPlays([]);
    setSelectedCard(null);
    setTricksPlayed(t=>t+1);
    setIsFirstTrick(false);
    // Show Cutting Your Teeth BEFORE resuming play if it was just triggered
    setPhase("playing");
    setTrickResult(null);
  }

  // Animate the trick's cards gathering toward the winner's score panel, then fading.
  function sweepTrickToWinner(plays, winnerIdx) {
    if (typeof window === "undefined") return;
    const trickEl = trickAreaRef.current;
    const panelEl = scorePanelRefs.current[winnerIdx];
    if (!trickEl || !panelEl) return;
    const slots = Array.from(trickEl.children); // each played card's wrapper
    const panelRect = panelEl.getBoundingClientRect();
    const toX = panelRect.left + panelRect.width/2;
    const toY = panelRect.top + panelRect.height/2;
    const flyers = [];
    plays.forEach((p, idx) => {
      const slot = slots[idx];
      if (!slot) return;
      const r = slot.getBoundingClientRect();
      flyers.push({
        id: `${p.playerIdx}-${p.card.id}-${Date.now()}`,
        card: p.card,
        fromX: r.left + r.width/2,
        fromY: r.top + r.height/2,
        toX, toY,
      });
    });
    if (flyers.length === 0) return;
    setFlyingCards(flyers);
    // Clear the flyers after the animation completes
    setTimeout(() => setFlyingCards([]), 650);
  }

  // Anchor point for a player: their score panel for AI/others; the hand area for the human.
  function playerAnchor(idx) {
    if (idx === 0 && handAreaRef.current) {
      const r = handAreaRef.current.getBoundingClientRect();
      return { x: r.left + r.width/2, y: r.top + r.height*0.35 };
    }
    const el = scorePanelRefs.current[idx];
    if (el) {
      const r = el.getBoundingClientRect();
      return { x: r.left + r.width/2, y: r.top + r.height/2 };
    }
    return null;
  }

  // Fly a single card from one player's anchor to another's (kidnap / rescue arc).
  function flyCardBetweenPlayers(card, fromIdx, toIdx, durMs=650) {
    if (typeof window === "undefined") return;
    const from = playerAnchor(fromIdx);
    const to = playerAnchor(toIdx);
    if (!from || !to) return;
    setFlyingCards([{
      id: `arc-${card.id}-${Date.now()}`,
      card,
      fromX: from.x, fromY: from.y,
      toX: to.x, toY: to.y,
      arc: true,
    }]);
    setTimeout(() => setFlyingCards([]), durMs);
  }

  function finishRound(fromAF) {
    const gameOver = totalScores.some(s=>s>=WIN_SCORE);
    setPhase(gameOver ? "gameover" : "roundover");
    setRoundNum(r=>r+1);
    setPendingAF(false);
  }

  function startNextRound() {
    startRound(totalScores);
    setRoundNum(r=>r);
  }

  // ---- AI turns ----
  useEffect(() => {
    if (phase !== "playing") return;
    const currentPlayer = turnOrder[currentTurn];
    if (currentPlayer === undefined || currentPlayer === 0) return; // human's turn or out of bounds

    const timer = setTimeout(() => {
      const hand = hands[currentPlayer];

      // If AI has no cards, skip their turn — advance to next player with cards
      if (!hand || hand.length === 0) {
        // Find next player in turn order who has cards
        let nextTurn = currentTurn + 1;
        while (nextTurn < 4 && (hands[turnOrder[nextTurn]]?.length || 0) === 0) {
          nextTurn++;
        }
        if (nextTurn >= 4) {
          // No one else has cards — resolve whatever plays we have, or fall through to auto-claim
          if (trickPlays.length > 0) {
            resolveTrickComplete(trickPlays, hands);
          } else {
            // No plays AND no players with cards — auto-claim path: pretend a trick just ended
            // by setting a synthetic trickResult so afterTrickResult fires the auto-claim
            const playersWithCards = hands.map((h, i) => h.length > 0 ? i : -1).filter(i => i >= 0);
            if (playersWithCards.length === 1) {
              setTrickResult({ winnerIdx: playersWithCards[0], plays: [], diamondsCaptured: [] });
              setPhase("trickresult");
            }
          }
        } else {
          setCurrentTurn(nextTurn);
        }
        return;
      }

      // First trick: AI leader must play 2♣
      if (isFirstTrick && trickPlays.length === 0) {
        const twoClub = hand.find(c => c.rank==="2" && c.suit==="♣");
        if (twoClub) { submitPlay(currentPlayer, twoClub); return; }
      }
      const role = aiRoleForRound(currentPlayer, roundNum);
      const card = aiChooseCard(hand, role, trickPlays, ledSuit, { trumpBroken: diamondsBroken });
      if (card) {
        submitPlay(currentPlayer, card);
      } else {
        // No valid card found — skip this player's turn
        setCurrentTurn(t => t + 1);
      }
    }, 700 + Math.random()*400);

    return () => clearTimeout(timer);
  }, [phase, currentTurn, turnOrder]);

  // AI kidnap
  useEffect(() => {
    if (phase !== "kidnap" || !kidnapState) return;
    const jokerPlayer = kidnapState.jokerPlayerIdx;
    if (jokerPlayer === 0) return; // human handles it via KidnapModal

    const timer = setTimeout(() => {
      const target = aiChooseKidnapTarget(kidnapState.hands, jokerPlayer);
      if (target) {
        handleKidnap(target.fromPlayer, target.cardIdx);
      } else {
        // No valid target — show result directly (preserve rob vs kidnap)
        const isRobbin = !!kidnapState.isRobbinJack;
        setTrickResult({ ...kidnapState.resultObj, jokerWin: !isRobbin, jackDiamondRob: isRobbin });
        setKidnapState(null);
        setPhase("trickresult");
      }
    }, 900);
    return () => clearTimeout(timer);
  }, [phase, kidnapState]);

  // AI rescue (Ace of Spades wins trick without a Joker)
  useEffect(() => {
    if (phase !== "rescue" || !rescueState) return;
    const acePlayer = rescueState.acePlayerIdx;
    if (acePlayer === 0) return; // human handles it via RescueModal

    const timer = setTimeout(() => {
      const target = aiChooseRescueTarget(rescueState.hands, acePlayer);
      if (target) {
        handleRescue(target.fromPlayer, target.cardIdx);
      } else {
        // No valid target — show result directly
        setTrickResult(rescueState.resultObj);
        setRescueState(null);
        setPhase("trickresult");
      }
    }, 900);
    return () => clearTimeout(timer);
  }, [phase, rescueState]);

  // ============================================================
  // RENDER: MENU
  // ============================================================
  if (screen === "menu") {

    const buttons = (

  // ============================================================
  // RENDER: GAME TABLE
  // ============================================================
  const playerHand = sortHand(hands[0] || []);
  const isDesktop = typeof window !== 'undefined' && window.innerWidth > 768; // big cards + side button
  const canPlay = isPlayerTurn && selectedCard;

  // Can player lead with a diamond? Only if broken or no other cards
  const canLeadDiamond = diamondsBroken || playerHand.filter(c=>!isDiamond(c)&&!c.isJoker).length===0;

  // Validate if selected card is legal to play
  const selectedIsLegal = selectedCard && (
    mustOpenWith2C
      ? (selectedCard.rank==="2" && selectedCard.suit==="♣")
      : selectedCard.isJoker
      ? true
      : trickPlays.length === 0
      ? (!isDiamond(selectedCard) || canLeadDiamond)

              border:`1px solid ${soundOn ? VM.tealLight+"55" : "#66666655"}`,

              padding:"5px 7px",
              fontSize:14,
              lineHeight:1,
              color:soundOn ? VM.tealLight : "#888",
              cursor:"pointer",
              fontFamily:"inherit",
              minHeight:34,
              touchAction:"manipulation",

      {/* SCORES */}
      <div style={{
        display:"flex",gap:4,padding:"3px 10px",
        borderBottom:"1px solid #ffffff0a",flexShrink:0,
        overflowX:"auto",
      }}>
        {allNames.map((n,i)=>{
          const isLeading = i===turnOrder[currentTurn] && phase==="playing";
          const total = totalScores[i]||0;
          const pct = Math.min(100, Math.round(total/WIN_SCORE*100));
          return (
            <div key={n} ref={el => scorePanelRefs.current[i] = el} style={{
              background: isLeading?"rgba(75,195,175,0.16)":"rgba(255,255,255,0.04)",
              border:`1px solid ${isLeading?VM.tealLight+"66":"rgba(75,195,175,0.10)"}`,
              borderRadius:10,padding:"3px 8px",
              textAlign:"center",flex:1,minWidth:56,
              transition:"all 0.2s",
              boxShadow: isLeading?`0 0 16px ${VM.tealLight}22`:"none",
            }}>
              <div style={{fontSize:9,color:VM.tealLight+"aa",letterSpacing:1,marginBottom:1,fontFamily:FONT_UI}}>{n.slice(0,7)}</div>
              <AnimatedNumber value={total} style={{
                fontSize:20,fontWeight:800,fontFamily:FONT_DISPLAY,
                color:isLeading?VM.gold:"#ffffffcc",
                lineHeight:1.1,display:"block",
              }}/>
              {/* +N round-running display removed — was confusing because the big total
                  doesn't change until round end. Round-end events show points earned. */}
              <div style={{height:5,lineHeight:1}}/>
              {/* Progress bar toward 80 */}
              <div style={{
                marginTop:3,height:3,borderRadius:2,
                background:"#ffffff11",overflow:"hidden",
              }}>
                <div style={{
                  height:"100%",borderRadius:2,
                  width:`${pct}%`,
                  background: pct>=75?VM.gold:pct>=50?`linear-gradient(90deg,${VM.tealMid},${VM.gold})`:VM.tealMid,
                  transition:"width 0.4s ease",
                }}/>
              </div>
            </div>
          );
        })}
      </div>

      {/* AI OPPONENTS */}
      <div style={{display:"flex",gap:6,padding:"4px 12px",flexShrink:0}}>
        {[1,2,3].map(i=>{
          const isActive = turnOrder[currentTurn]===i && phase==="playing";
          return (
            <div key={i} style={{
              flex:1,background:isActive?"rgba(75,195,175,0.14)":"rgba(255,255,255,0.04)",
              border:`1px solid ${isActive?VM.tealLight+"55":"rgba(75,195,175,0.10)"}`,
              borderRadius:10,padding:"4px 8px",transition:"all 0.2s",
              boxShadow: isActive?`0 0 14px ${VM.tealLight}1f`:"none",
            }}>
              <div style={{display:"flex",alignItems:"center",gap:4,marginBottom:2}}>
                <span style={{fontSize:14}}>{AI_PERSONAS[i-1].emoji}</span>
                <span style={{fontSize:10,color:"#ffffffcc",fontWeight:700,fontFamily:FONT_UI}}>{AI_NAMES[i-1]}</span>
                {isActive&&<span style={{fontSize:8,color:VM.tealLight,marginLeft:"auto",animation:"pulse 1s infinite",fontFamily:FONT_UI}}>thinking…</span>}
              </div>
              {/* Fanned face-down cards for AI */}
              <div style={{display:"flex",position:"relative",height:18,marginLeft:2}}>
                {(hands[i]||[]).map((_,ci)=>(
                  <div key={ci} style={{
                    position:"absolute",left:ci*7,
                    width:14,height:20,borderRadius:2,
                    border:"1.5px solid #fff",
                    boxShadow:"0 1px 3px #00000033",
                    zIndex:ci,
                    overflow:"hidden",
                    imageRendering:"pixelated",
                  }}>
                    <PixelCardBack theme={deckTheme} w={14} h={20}/>
                  </div>
                ))}
              </div>
            </div>
          );
        })}
      </div>

      {/* TRICK AREA — flexes to fill leftover vertical space; centered content */}
      <div style={{
        display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
        padding:"2px 12px 2px",
        background:`radial-gradient(ellipse at 50% 50%,${VM.tealLight}0d,transparent 70%)`,
        flex:"1 1 auto",
        minHeight: 168, // never smaller than this (label + ledSuit + cards)
        boxSizing:"border-box",
      }}>
        <div style={{color:VM.tealLight+"77",fontSize:9,letterSpacing:3,marginBottom:2,textTransform:"uppercase",fontFamily:FONT_UI,height:13,lineHeight:"13px"}}>Current Trick</div>
        {/* Led suit row — always present (reserves space); content shown only when ledSuit set */}
        <div style={{height:22,marginBottom:7,display:"flex",alignItems:"center",justifyContent:"center"}}>
          {ledSuit && (
            <div style={{color:VM.tealLight,fontSize:11,fontWeight:700,fontFamily:FONT_UI}}>
              Led suit: <span style={{fontSize:16}}>{ledSuit}</span>
            </div>
          )}
        </div>
        {/* Cards row — fixed height matches a mobile card (115) + name label (~14) */}
        <div ref={trickAreaRef} style={{display:"flex",gap:10,justifyContent:"center",height:130,alignItems:"center",flexWrap:"nowrap"}}>
          {trickPlays.length===0 ? (
            <div style={{color:"#ffffff1a",fontSize:12,fontStyle:"italic",fontFamily:FONT_UI}}>Waiting for first card…</div>
          ) : (
            trickPlays.map((p,i)=>(
              <div key={`${p.playerIdx}-${p.card.id}`} style={{
                textAlign:"center",
                animation:"cardLand 0.28s cubic-bezier(0.2,0.8,0.3,1)",
              }}>
                <CardComp card={p.card} played/>
                <div style={{color:VM.tealLight+"99",fontSize:9,marginTop:4,letterSpacing:1,fontFamily:FONT_UI}}>{allNames[p.playerIdx]}</div>
              </div>
            ))
          )}
        </div>
      </div>

      {/* SPACER — small visual gap; fan wrapper's paddingTop provides headroom for the lifted card */}
      <div style={{ height:6, flexShrink:0 }} />

      {/* PLAYER HAND — fixed-height block so the row never jumps */}
      <div style={{
        flexShrink:0,
        display:"flex",flexDirection:"column",
        padding: isDesktop ? "4px 10px 8px" : "4px 10px 16px",
        height: isDesktop ? 236 : 250,
        position:"relative",
        boxSizing:"border-box",
      }}>
        <div style={{
          color: isPlayerTurn?VM.tealLight:"#ffffff44",
          fontSize:9,letterSpacing:2,
          textTransform:"uppercase",textAlign:"center",marginBottom:2,
          fontWeight:700, flexShrink:0, fontFamily:FONT_UI,
          height:14, lineHeight:"14px",
        }}>
          {isPlayerTurn ? mustOpenWith2C ? "Play the 2♣ to open" : "Your Turn — Tap a Card" : `${allNames[turnOrder[currentTurn]]}'s Turn`}
        </div>

        {/* FANNED HAND */}
        <div ref={handAreaRef} style={{
          overflowX:"hidden",
          overflowY:"visible",
          paddingTop: isDesktop?44:36, // headroom for the lifted selected card
          flexShrink:0,
        }}>
          <div style={{
            position:"relative",
            height: isDesktop?160:125, // fit card height so tops aren't clipped
            width:"100%",
            display:"flex",
            alignItems:"flex-end",
            justifyContent:"center",
          }}>
          {(() => {
            // Compute fan layout based on the STARTING hand size (always 13 at deal time),
            // not the current hand size. This way overlap stays constant as cards are played,
            // and the row doesn't slide/expand on each play.
            const total = playerHand.length;
            const cardW = 80;
            const SAFETY = 20; // px of breathing room on each side
            const STARTING_HAND_SIZE = 14;
            const availW = (typeof window !== 'undefined' ? window.innerWidth : 360) - SAFETY * 2;
            // Lock overlap to what it would be at full hand size (13 cards).
            const maxOverlap = Math.floor((availW - cardW) / (STARTING_HAND_SIZE - 1));
            const OVERLAP = Math.min(22, Math.max(8, maxOverlap));
            const totalWidth = OVERLAP * (total - 1) + cardW;
            const startX = -totalWidth / 2;
            const selIdx = playerHand.findIndex(c => c.id === selectedCard?.id);
            return playerHand.map((card, ci) => {
              const isLegal = mustOpenWith2C
                ? (card.rank==="2" && card.suit==="♣")
                : card.isJoker
                ? true
                : trickPlays.length === 0
                ? (!isDiamond(card) || canLeadDiamond)
                : (!ledSuit || card.suit===ledSuit || !playerHand.some(c=>!c.isJoker&&c.suit===ledSuit));
              const isSelected = selectedCard?.id === card.id;
              // Neighbor spread: cards near the selected one ease outward to make room.
              let spread = 0;
              if (selIdx >= 0 && !isSelected) {
                const dist = ci - selIdx;
                const mag = Math.max(0, 10 - Math.abs(dist) * 3); // falls off with distance
                spread = dist > 0 ? mag : -mag;
              }
              const xPos = startX + ci * OVERLAP + spread;
              const showGlow = isPlayerTurn && isLegal && !isSelected;

              return (
                <div
                  key={card.id}
                  onClick={isPlayerTurn ? () => {
                    if (isSelected && isLegal && isDesktop) { playCard(card); }
                    else { setSelectedCard(isSelected ? null : card); }
                  } : undefined}
                  style={{
                    position:"absolute",
                    left:`calc(50% + ${xPos}px)`,
                    bottom: isSelected ? 20 : 0,
                    zIndex: isSelected ? total + 10 : ci,
                    cursor: isPlayerTurn ? "pointer" : "default",
                    transition:"bottom 0.15s ease, left 0.18s ease, filter 0.2s ease",
                    touchAction:"manipulation",
                    filter: (!isPlayerTurn || !isLegal)
                      ? "brightness(0.55)"
                      : showGlow
                      ? "drop-shadow(0 0 0 rgba(75,195,175,0))"
                      : "none",
                    animation: dealing
                      ? `dealIn 0.42s cubic-bezier(0.2,0.8,0.3,1) ${ci*0.06}s both`
                      : ci === dealRevealIdx - 1
                      ? "cardFlip 0.18s ease-out"
                      : showGlow ? `legalRipple 2.4s ease-in-out ${ci*0.12}s infinite` : "none",
                    // deck origin: cards fly up from bottom-center
                    "--deal-dx": `${-xPos*0.5}px`,
                    "--deal-dy": "120px",
                    "--deal-rot": `${(ci-6)*1.5}deg`,
                  }}
                >
                  <CardComp
                    card={card}
                    selected={isSelected}
                    faceDown={ci >= dealRevealIdx}
                    dimmed={false}
                    deckTheme={deckTheme}
                  />
                </div>
              );
            });
          })()}
          {playerHand.length===0 && (
            <div style={{color:"#00000044",fontSize:12,fontStyle:"italic"}}>No cards left</div>
          )}
          </div>
        </div>

        <div style={isDesktop
          ? {position:"absolute",right:20,top:"54%",transform:"translateY(-50%)",display:"flex",flexDirection:"column",gap:8,alignItems:"center",zIndex:50}
          : {display:"flex",justifyContent:"center",gap:10,marginTop:6,alignItems:"center",flexShrink:0,flexWrap:"wrap"}}>
          {selectedCard && isPlayerTurn && (
            <div style={{
              background:VM.tealLight+"14",border:`1px solid ${VM.tealLight}33`,
              borderRadius:8,padding:"5px 12px",
              color:VM.tealLight+"aa",fontSize:11,fontWeight:700,fontFamily:FONT_UI,
              display:"flex",alignItems:"center",gap:6,
            }}>
              Playing: <strong style={{color:VM.tealLight}}>{selectedCard.isJoker?"🃏 Joker":selectedCard.rank+selectedCard.suit}</strong>
              {!selectedIsLegal&&<span style={{color:"#ff6666",fontSize:10}}>{mustOpenWith2C?" ✗ must open with 2♣":" ✗ must follow "+ledSuit}</span>}
            </div>
          )}
          <GoldBtn
            onClick={()=>{ if(selectedCard&&selectedIsLegal) playCard(selectedCard); }}
            disabled={!canPlay||!selectedIsLegal}
          >
            {isPlayerTurn ? "Play Card" : "Waiting…"}
          </GoldBtn>
        </div>
        {/* Safe-area spacer — clears iPhone home indicator */}
        <div style={{height:"env(safe-area-inset-bottom, 0px)",flexShrink:0}}/>
      </div>

      {/* MODALS */}
      {phase==="kidnap"&&kidnapState&&kidnapState.jokerPlayerIdx===0&&(
        <KidnapModal
          hands={hands}
          jokerPlayerIdx={0}
          allNames={allNames}
          onSteal={handleKidnap}
          onSkip={kidnapState.isRobbinJack ? handleKidnapSkip : undefined}
          deckTheme={deckTheme}
          isRobbinJack={!!kidnapState.isRobbinJack}
        />
      )}

      {phase==="thesteal" && theStealState && (
        <Modal>
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:48,marginBottom:4}}>🌇</div>
            <div style={{color:"#c9a84c",fontSize:11,letterSpacing:3,textTransform:"uppercase",marginBottom:4}}>Special Event</div>
            <h2 style={{color:"#fff",margin:"0 0 8px",fontSize:22,fontFamily:FONT_DISPLAY,fontWeight:800}}>THE STEAL</h2>
            <p style={{color:"#ffffff88",fontSize:13,margin:"0 0 6px"}}>
              You hold the Joker, Robbin Jack, and Ace of Spades.
            </p>
            <p style={{color:VM.gold,fontSize:14,fontWeight:700,margin:"0 0 4px"}}>
              End the Round → +{THE_STEAL_BONUS} pts
            </p>
            <p style={{color:"#ffffff55",fontSize:12,margin:"0 0 20px"}}>
              Play On → keep all cards, no bonus
            </p>
            <div style={{display:"flex",flexDirection:"column",gap:10,alignItems:"center"}}>
              <GoldBtn onClick={handleTheStealEndRound}>
                End the Round 🏁 (+{THE_STEAL_BONUS} pts)
              </GoldBtn>
              <GoldBtn onClick={handleTheStealPlayOn} secondary>
                Play On — Keep the Cards
              </GoldBtn>
            </div>
          </div>
        </Modal>
      )}

      {phase==="robbinsummon" && robbinSummonState && robbinSummonState.jackPlayerIdx === 0 && (
        <Modal>
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:44,marginBottom:4}}>🎴</div>
            <div style={{color:"#c9a84c",fontSize:11,letterSpacing:3,textTransform:"uppercase",marginBottom:4}}>Robin's Choice</div>
            <h2 style={{color:"#fff",margin:"0 0 8px",fontSize:20,fontFamily:FONT_DISPLAY,fontWeight:800}}>Summon The Ace of Spades?</h2>
            <p style={{color:"#ffffff88",fontSize:13,margin:"0 0 4px"}}>
              Block the Joker and win this trick yourself.
            </p>
            <p style={{color:VM.gold,fontSize:12,margin:"0 0 20px"}}>
              {allNames[robbinSummonState.batmanHolderIdx]} receives +35 pts. You win the trick.
            </p>
            <div style={{display:"flex",flexDirection:"column",gap:10,alignItems:"center"}}>
              <GoldBtn onClick={handleRobbinSummonYes}>Summon The Ace ♠</GoldBtn>
              <GoldBtn onClick={handleRobbinSummonNo} secondary>Let the Joker Win</GoldBtn>
            </div>
          </div>
        </Modal>
      )}

      {phase==="rescue"&&rescueState&&rescueState.acePlayerIdx===0&&(
        <RescueModal
          hands={hands}
          acePlayerIdx={0}
          allNames={allNames}
          onRescue={handleRescue}
          deckTheme={deckTheme}
        />
      )}

      {/* Aces Low — offer modal (only when it's the human's choice) */}
      {phase==="aceslow_offer" && acesLowState && acesLowState.playerIdx === 0 && (
        <div style={{
          position:"fixed", inset:0,
          background:"rgba(4,18,15,0.78)",
          display:"flex", alignItems:"center", justifyContent:"center",
          zIndex:200, padding:16,
          backdropFilter:"blur(4px)", WebkitBackdropFilter:"blur(4px)",
        }}>
          <div style={{
            background:"linear-gradient(155deg,#0f3c38,#08231f)",
            border:`2.5px solid #0a0a0a`,
            borderRadius:20, padding:"28px 32px",
            maxWidth:400, width:"100%",
            boxShadow:`0 0 40px #00000088, 0 20px 60px #000000cc`,
            textAlign:"center",
            display:"flex", flexDirection:"column", alignItems:"center",
          }}>
            <div style={{fontSize:40, marginBottom:8, lineHeight:1}}>✈️</div>
            <div style={{
              color:VM.goldBright,
              fontSize:13, fontWeight:900,
              letterSpacing:3, textTransform:"uppercase",
              fontFamily:FONT_DISPLAY, marginBottom:16,
              textShadow:`0 0 12px ${VM.gold}44`,
            }}>Aces Low</div>
            <div style={{
              width:"100%",
              display:"flex", flexDirection:"column",
              alignItems:"center", gap:12,
            }}>
              <div style={{color:"#fff",fontSize:18,fontWeight:800,fontFamily:FONT_DISPLAY}}>
                You've gathered all four aces.
              </div>
              <div style={{color:"#e2c97ecc",fontSize:13,fontFamily:FONT_UI,fontStyle:"italic",lineHeight:1.5}}>
                Cash in for <strong style={{color:VM.gold,fontStyle:"normal"}}>+{ACES_LOW_BONUS} pts</strong>,<br/>
                or hold them for a chance at bigger sets.
              </div>
            </div>
            <div style={{display:"flex", gap:10, marginTop:20}}>
              <button onClick={declineAcesLow} style={{
                background:"transparent",
                color:VM.tealLight,
                border:`1.5px solid ${VM.tealLight}66`,
                borderRadius:10, padding:"12px 22px",
                fontSize:13, fontWeight:900, cursor:"pointer",
                letterSpacing:2, textTransform:"uppercase",
                fontFamily:FONT_DISPLAY,
              }}>Hold</button>
              <button onClick={acceptAcesLow} style={{
                background:`linear-gradient(135deg,${VM.gold},#c9a84c)`,
                color:"#0a2320", border:"none", borderRadius:10,
                padding:"12px 28px", fontSize:13,
                fontWeight:900, cursor:"pointer",
                letterSpacing:2, textTransform:"uppercase",
                fontFamily:FONT_DISPLAY,
                boxShadow:`0 4px 14px ${VM.gold}33`,
              }}>Cash It +{ACES_LOW_BONUS}</button>
            </div>
          </div>
        </div>
      )}

      {/* Aces Low — cash-in event box (after cashing, before play resumes) */}
      {phase==="aceslow_event" && acesLowState && (
        <EventBox
          borderColor="#0a0a0a"
          emoji="✈️"
          title="Aces Low!"
          btnLabel="PROCEED"
          onContinue={dismissAcesLowEvent}
        >
          <div style={{color:"#fff",fontSize:22,fontWeight:800,fontFamily:FONT_DISPLAY}}>
            {allNames[acesLowState.playerIdx]}
          </div>
          <div style={{color:"#e2c97ecc",fontSize:13,fontFamily:FONT_UI,fontStyle:"italic"}}>
            Four aces gathered — cashed in for the bonus.
          </div>
          <div style={{
            background:"rgba(10,10,10,0.4)", border:"1px solid #ffffff22",
            borderRadius:10, padding:"8px 20px", display:"inline-block",
          }}>
            <span style={{color:VM.gold,fontSize:16,fontWeight:800,fontFamily:FONT_DISPLAY}}>+{ACES_LOW_BONUS} pts ✈️</span>
          </div>
        </EventBox>
      )}

      {phase==="trickresult"&&trickResult&&(
        <TrickResultModal
          result={trickResult}
          allNames={allNames}
          onContinue={afterTrickResult}
          isGameOver={pendingFireworks || totalScores.some(s=>s>=WIN_SCORE)}
          isHandOver={trickResult?.americanFamily || hands.every(h=>h.length===0)}
        />
      )}

      {phase==="roundover"&&(
        <RoundOverModal
          scores={totalScores}
          allNames={allNames}
          roundScores={roundScores}
          onContinue={startNextRound}
        />
      )}

      {phase==="gameover"&&(
        <GameOverModal
          scores={totalScores}
          allNames={allNames}
          onRestart={()=>{ setScreen("menu"); }}
        />
      )}

      {showRules&&<RulesPanel onClose={()=>setShowRules(false)}/>}

      {/* CUTTING YOUR TEETH — interrupts immediately when a diamond is played */}
      {phase==="cuttingteeth_interrupt" && (
        <EventBox
          borderColor="#cc1111"
          emoji="💎"
          title="Cutting Your Teeth!"
          btnLabel="PROCEED"
          onContinue={() => {
            const cont = pendingPlayContinuation;
            setPendingPlayContinuation(null);
            setPhase("playing");
            if (cont) continuePlayFlow(cont.playerIdx, cont.card, cont.newPlays, cont.newHands);
          }}
        >
          <div style={{
            color:"#e2c97ecc", fontSize:14,
            fontFamily:FONT_UI, lineHeight:1.9,
          }}>
            Dimonds are broken<br/>
            <span style={{color:"#e2c97e",fontWeight:700}}>— dimonds become trump suit!</span>
          </div>
        </EventBox>
      )}

      {/* FIREWORKS */}
      {showFireworks && (
        <Fireworks onDone={()=>{ setShowFireworks(false); setPhase("gameover"); }} place={fireworksPlace}/>
      )}

      <style>{`
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
        @keyframes slideIn { from{opacity:0;transform:translateX(-50%) translateY(-10px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
        @keyframes pop { 0%{transform:scale(0.5);opacity:0} 60%{transform:scale(1.2)} 100%{transform:scale(1);opacity:1} }
        /* Card lands into the trick — drops in from above with a slight settle */
        @keyframes cardLand {
          0% { opacity:0; transform:translateY(-46px) scale(1.08); }
          70% { opacity:1; transform:translateY(3px) scale(1.0); }
          100% { opacity:1; transform:translateY(0) scale(1.0); }
        }
        /* Legal-card hint — a soft teal glow that breathes */
        @keyframes legalGlow {
          0%,100% { box-shadow:0 2px 10px #00000033, 0 0 0px rgba(75,195,175,0); }
          50% { box-shadow:0 2px 10px #00000033, 0 0 14px rgba(75,195,175,0.55); }
        }
        @keyframes legalRipple {
          0%,100% { filter: drop-shadow(0 0 0 rgba(75,195,175,0)); }
          50% { filter: drop-shadow(0 0 6px rgba(75,195,175,0.6)); }
        }
        /* Trick cards sweep away toward the winner */
        @keyframes trickSweep {
          0% { opacity:1; transform:scale(1) translate(0,0); }
          100% { opacity:0; transform:scale(0.6) translate(0,-40px); }
        }
        /* Deal-out — card flies in from the deck origin */
        @keyframes dealIn {
          from { opacity:0; transform:translate(var(--deal-dx,0), var(--deal-dy,-200px)) scale(0.7) rotate(var(--deal-rot,0deg)); }
          to { opacity:1; transform:translate(0,0) scale(1) rotate(0deg); }
        }
        @keyframes cardFlip {
          0%   { transform: rotateY(90deg) scaleX(0.1); opacity:0.5; }
          100% { transform: rotateY(0deg)  scaleX(1);   opacity:1; }
        }
        ::-webkit-scrollbar { width: 0; height: 0; background: transparent; }
        * { scrollbar-width: none; }
      `}</style>
    </div>
  );
}

const _root = ReactDOM.createRoot(_container);
_root.render(React.createElement(DiamondsGame));
