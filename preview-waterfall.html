<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>2nd Place — Firework Waterfall Bridge</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
const C   = document.getElementById("c");
const ctx = C.getContext("2d");
const W   = 900;
const H   = 560;
C.width   = W;
C.height  = H;

// ── Layout ─────────────────────────────────────────────────────────────────────
const WATER_Y = 360;
const DECK_Y  = 248;
const DECK_H  = 14;
const TWR_W   = 48;
const LTX     = 208;
const RTX     = 692;
const TT_Y    = DECK_Y - 158;
const SPAN_L  = LTX + TWR_W/2 + 14;
const SPAN_R  = RTX - TWR_W/2 - 14;
const SPAN_W  = SPAN_R - SPAN_L;

// Catenary sag control point
const CABLE_CX = (LTX + RTX) / 2;
const CABLE_CY = TT_Y + 6 + 46;

// ── Typed-array particle pool ──────────────────────────────────────────────────
const N   = 4200;
const PX  = new Float32Array(N);
const PY  = new Float32Array(N);
const PVX = new Float32Array(N);
const PVY = new Float32Array(N);
const PL  = new Float32Array(N);
const PD  = new Float32Array(N);
const PSZ = new Float32Array(N);
const PST = new Uint8Array(N);   // 1=stream column, 0=scatter

// 10 stream column positions
const COLS = Array.from({length:10}, (_,i) => SPAN_L + (i/9)*SPAN_W);
let slot = 0;

function resetP(i) {
  const s = Math.random() < 0.26;
  PST[i] = s ? 1 : 0;
  PX[i]  = s
    ? COLS[Math.floor(Math.random()*COLS.length)] + (Math.random()-0.5)*10
    : SPAN_L + Math.random()*SPAN_W;
  PY[i]  = DECK_Y + DECK_H + Math.random()*3;
  PVX[i] = (Math.random()-0.5) * (s ? 0.65 : 3.4);
  PVY[i] = s ? 3.2 + Math.random()*4.5 : 0.8 + Math.random()*3.0;
  PL[i]  = 1.0;
  PD[i]  = s ? 0.0038 + Math.random()*0.006 : 0.007 + Math.random()*0.017;
  PSZ[i] = s ? 1.9 + Math.random()*1.5 : 0.6 + Math.random()*1.9;
}

// Warm-start: fill pool at random life stages so waterfall is dense from frame 1
for (let i = 0; i < N; i++) {
  resetP(i);
  PL[i] = Math.random();
  PY[i] = DECK_Y + DECK_H + Math.random() * (WATER_Y - DECK_Y - DECK_H - 5);
}

function spawnBatch() {
  for (let k = 0; k < 72; k++) { resetP(slot % N); slot++; }
}

// Color: white-hot → gold → orange → deep red
function pR(l) {
  const t = 1-l;
  if (t < 0.12) return 255;
  if (t < 0.65) return 255;
  return Math.round(255 - (t-0.65)/0.35*88);
}
function pG(l) {
  const t = 1-l;
  if (t < 0.12) return 255;
  if (t < 0.38) { const s=(t-0.12)/0.26; return Math.round(255-s*52); }
  if (t < 0.65) { const s=(t-0.38)/0.27; return Math.round(203-s*98); }
  return Math.round(105-(t-0.65)/0.35*105);
}
function pB(l) {
  const t = 1-l;
  if (t < 0.10) return 215;
  if (t < 0.22) return Math.round(215*(1-(t-0.10)/0.12));
  return 0;
}

// ── Smoke ──────────────────────────────────────────────────────────────────────
const smk = [];
function spawnSmoke() {
  if (smk.length < 80 && Math.random() < 0.26)
    smk.push({ x:SPAN_L+Math.random()*SPAN_W, y:DECK_Y-3, vx:(Math.random()-0.5)*0.45,
               vy:-(0.28+Math.random()*0.7), r:10+Math.random()*16,
               a:0, d:0.0022+Math.random()*0.003 });
}

// ── Stars (deterministic) ──────────────────────────────────────────────────────
const STARS = Array.from({length:100}, (_,i) => ({
  x: ((i*193+43) % (W-24))+12,
  y: ((i*317+71) % (WATER_Y-100))+8,
  r: 0.22 + (i%4)*0.22,
  a: 0.45 + (i%3)*0.2,
}));

// ── Scene ──────────────────────────────────────────────────────────────────────
function drawScene(ts) {
  // Sky
  const sk = ctx.createLinearGradient(0, 0, 0, WATER_Y);
  sk.addColorStop(0,    "#010310");
  sk.addColorStop(0.52, "#060d20");
  sk.addColorStop(1,    "#0b172e");
  ctx.fillStyle = sk; ctx.fillRect(0, 0, W, WATER_Y);

  // Stars (twinkle)
  STARS.forEach(s => {
    ctx.globalAlpha = s.a * (0.6 + 0.4*Math.sin(ts/1900+s.x*0.04));
    ctx.fillStyle = "#cce0ff";
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Horizon city glow
  const hg = ctx.createLinearGradient(0, WATER_Y-55, 0, WATER_Y+5);
  hg.addColorStop(0, "rgba(0,0,0,0)");
  hg.addColorStop(0.55, "rgba(255,195,85,0.05)");
  hg.addColorStop(1,   "rgba(255,210,105,0.12)");
  ctx.fillStyle = hg; ctx.fillRect(0, WATER_Y-55, W, 60);

  // Water
  const wt = ctx.createLinearGradient(0, WATER_Y, 0, H);
  wt.addColorStop(0, "#071020");
  wt.addColorStop(1, "#020408");
  ctx.fillStyle = wt; ctx.fillRect(0, WATER_Y, W, H-WATER_Y);

  // Water ripples
  ctx.lineWidth = 1;
  for (let wy = WATER_Y+14; wy < H; wy += 16) {
    const wa = 0.024 + 0.014*Math.sin(ts/1050+wy/22);
    ctx.strokeStyle = `rgba(200,150,50,${wa.toFixed(3)})`;
    ctx.beginPath();
    ctx.moveTo(40, wy);
    ctx.bezierCurveTo(W*0.3, wy+1.5, W*0.7, wy-1.5, W-40, wy);
    ctx.stroke();
  }

  // Embankments
  ctx.fillStyle = "#060b18";
  ctx.fillRect(0, WATER_Y-9, LTX-TWR_W*1.35, 13);
  ctx.fillRect(RTX+TWR_W*0.35, WATER_Y-9, W-(RTX+TWR_W*0.35), 13);

  // Back-stay cables
  ctx.strokeStyle = "#495870"; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(18, DECK_Y-22); ctx.lineTo(LTX, TT_Y+6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W-18, DECK_Y-22); ctx.lineTo(RTX, TT_Y+6); ctx.stroke();

  // Main catenary span
  ctx.beginPath();
  ctx.moveTo(LTX, TT_Y+6);
  ctx.quadraticCurveTo(CABLE_CX, CABLE_CY, RTX, TT_Y+6);
  ctx.stroke();

  // Hanger cables
  ctx.strokeStyle = "rgba(70,88,110,0.58)"; ctx.lineWidth = 1;
  for (let hx = SPAN_L+8; hx <= SPAN_R-8; hx += 19) {
    const nt = (hx-LTX)/(RTX-LTX);
    const cy = (1-nt)*(1-nt)*(TT_Y+6) + 2*(1-nt)*nt*CABLE_CY + nt*nt*(TT_Y+6);
    ctx.beginPath(); ctx.moveTo(hx, cy); ctx.lineTo(hx, DECK_Y); ctx.stroke();
  }

  // Towers
  drawTower(LTX); drawTower(RTX);

  // Bridge deck
  const dk = ctx.createLinearGradient(0, DECK_Y, 0, DECK_Y+DECK_H);
  dk.addColorStop(0, "#283248"); dk.addColorStop(1, "#111828");
  ctx.fillStyle = dk; ctx.fillRect(26, DECK_Y, W-52, DECK_H);
  ctx.fillStyle = "rgba(100,125,165,0.16)";
  ctx.fillRect(26, DECK_Y, W-52, 2);
  ctx.fillStyle = "rgba(0,0,0,0.45)";
  ctx.fillRect(SPAN_L-8, DECK_Y+DECK_H, SPAN_W+16, 5);
}

function drawTower(cx) {
  const x = cx - TWR_W/2, y = TT_Y, btm = DECK_Y + DECK_H;
  const tg = ctx.createLinearGradient(x, 0, x+TWR_W, 0);
  tg.addColorStop(0, "#1c2542"); tg.addColorStop(0.45,"#253252"); tg.addColorStop(1,"#141c30");
  ctx.fillStyle = tg;

  // Tower silhouette (tapers to pointed pinnacle)
  ctx.beginPath();
  ctx.moveTo(x-5, btm);
  ctx.lineTo(x+TWR_W+5, btm);
  ctx.lineTo(x+TWR_W+3, y+TWR_W*1.5);
  ctx.lineTo(x+TWR_W+1, y+32);
  ctx.lineTo(cx+4, y+14);
  ctx.lineTo(cx+1, y);       // pinnacle right
  ctx.lineTo(cx-1, y);       // pinnacle left
  ctx.lineTo(cx-4, y+14);
  ctx.lineTo(x-1, y+32);
  ctx.lineTo(x-3, y+TWR_W*1.5);
  ctx.closePath();
  ctx.fill();

  // Gothic arch (dark cutout)
  const aH = (btm-y)*0.29, aY = y+(btm-y)*0.42, aW = TWR_W*0.47;
  ctx.fillStyle = "rgba(2,5,14,0.93)";
  ctx.beginPath();
  ctx.moveTo(cx-aW/2, aY+aH);
  ctx.lineTo(cx-aW/2, aY+15);
  ctx.quadraticCurveTo(cx-aW/2, aY, cx, aY);
  ctx.quadraticCurveTo(cx+aW/2, aY, cx+aW/2, aY+15);
  ctx.lineTo(cx+aW/2, aY+aH);
  ctx.closePath(); ctx.fill();

  // Crenellations
  ctx.fillStyle = "#1b2440";
  for (let bx = x+5; bx < x+TWR_W-4; bx += 12) ctx.fillRect(bx, y-9, 5, 9);

  // Cable saddle
  ctx.fillStyle = "#3c4e68";
  ctx.beginPath(); ctx.arc(cx, TT_Y+6, 5, 0, 6.283); ctx.fill();

  // Stone courses
  ctx.strokeStyle = "rgba(34,48,72,0.5)"; ctx.lineWidth = 1;
  for (let sy = y+28; sy < btm; sy += 16) {
    ctx.beginPath(); ctx.moveTo(x-2, sy); ctx.lineTo(x+TWR_W+2, sy); ctx.stroke();
  }
}

// ── Glow bloom ────────────────────────────────────────────────────────────────
function drawGlow(intensity) {
  if (intensity <= 0) return;
  const iv = Math.min(1, intensity);
  const g = ctx.createRadialGradient(W/2, DECK_Y+55, 10, W/2, DECK_Y+55, 430);
  g.addColorStop(0,    `rgba(255,148,28,${(0.26*iv).toFixed(3)})`);
  g.addColorStop(0.28, `rgba(215,65,8,${(0.15*iv).toFixed(3)})`);
  g.addColorStop(0.62, `rgba(120,18,2,${(0.07*iv).toFixed(3)})`);
  g.addColorStop(1,    "rgba(0,0,0,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // Deck edge lit from below
  const dg = ctx.createLinearGradient(0, DECK_Y, 0, DECK_Y+DECK_H+4);
  dg.addColorStop(0, `rgba(255,162,52,${(0.20*iv).toFixed(3)})`);
  dg.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = dg;
  ctx.fillRect(SPAN_L-24, DECK_Y, SPAN_W+48, DECK_H+4);
}

// ── Water reflection ───────────────────────────────────────────────────────────
function drawReflection(ts) {
  ctx.save();
  ctx.globalCompositeOperation = "screen";
  // Sample every 3rd particle for perf
  for (let i = 0; i < N; i += 3) {
    if (PL[i] < 0.08) continue;
    const ry = WATER_Y + (PY[i] - WATER_Y) * 0.40;
    if (ry > H || ry < WATER_Y - 5) continue;
    const wb = Math.sin(ts/800 + PY[i]/26) * 3.8;
    ctx.beginPath();
    ctx.arc(PX[i]+wb, ry, PSZ[i]*PL[i]*0.72, 0, 6.283);
    ctx.fillStyle = `rgba(${pR(PL[i])},${pG(PL[i])},${pB(PL[i])},${(PL[i]*0.22).toFixed(2)})`;
    ctx.fill();
  }
  ctx.restore();

  // Bright column reflections (only stream particles)
  ctx.save();
  ctx.globalCompositeOperation = "screen";
  for (let i = 0; i < N; i++) {
    if (!PST[i] || PL[i] < 0.12) continue;
    const ry = WATER_Y + (PY[i]-WATER_Y)*0.38;
    if (ry > H || ry < WATER_Y-5) continue;
    const wb = Math.sin(ts/800 + PY[i]/26)*4;
    ctx.beginPath();
    ctx.arc(PX[i]+wb, ry, PSZ[i]*PL[i]*0.9, 0, 6.283);
    ctx.fillStyle = `rgba(${pR(PL[i])},${pG(PL[i])},${pB(PL[i])},${(PL[i]*0.35).toFixed(2)})`;
    ctx.fill();
  }
  ctx.restore();

  // Glow stripe at surface
  const sg = ctx.createLinearGradient(0, WATER_Y, 0, WATER_Y+100);
  sg.addColorStop(0, "rgba(255,108,14,0.15)");
  sg.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = sg;
  ctx.fillRect(SPAN_L-70, WATER_Y, SPAN_W+140, 100);
}

// ── Vignette ───────────────────────────────────────────────────────────────────
function drawVignette() {
  const v = ctx.createRadialGradient(W/2, H/2, H*0.28, W/2, H/2, H*0.82);
  v.addColorStop(0, "rgba(0,0,0,0)");
  v.addColorStop(1, "rgba(0,0,0,0.55)");
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

// ── Main loop ──────────────────────────────────────────────────────────────────
function loop(ts) {
  ctx.clearRect(0, 0, W, H);

  drawScene(ts);

  // Glow intensity from live particle count
  let alive = 0;
  for (let i = 0; i < N; i++) if (PL[i] > 0.06) alive++;
  drawGlow(alive / 2400);

  // Smoke
  spawnSmoke();
  ctx.save();
  for (let i = smk.length-1; i >= 0; i--) {
    const s = smk[i];
    s.x+=s.vx; s.y+=s.vy; s.r+=0.26;
    s.a = Math.min(0.20, s.a+0.007);
    const life = s.a - s.d; s.a = life;
    if (life <= 0) { smk.splice(i,1); continue; }
    ctx.globalAlpha = life * 0.85;
    ctx.fillStyle = "#2e2418";
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // Spawn + update particles
  spawnBatch();
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (let i = 0; i < N; i++) {
    if (PL[i] <= 0) continue;
    PX[i] += PVX[i];
    PY[i] += PVY[i];
    PVY[i] += 0.046;
    PVX[i] *= 0.996;
    PL[i]  -= PD[i];
    if (PL[i] <= 0) { PL[i] = 0; continue; }

    const sz = PSZ[i] * Math.max(0.1, PL[i]);
    ctx.beginPath();
    ctx.arc(PX[i], PY[i], sz, 0, 6.283);
    ctx.fillStyle = `rgba(${pR(PL[i])},${pG(PL[i])},${pB(PL[i])},${Math.min(0.95,PL[i]).toFixed(2)})`;
    ctx.fill();

    // Stream trails
    if (PST[i] && PL[i] > 0.28 && PVY[i] > 0) {
      ctx.beginPath();
      ctx.moveTo(PX[i], PY[i]);
      ctx.lineTo(PX[i]-PVX[i]*5, PY[i]-PVY[i]*4);
      ctx.strokeStyle = `rgba(${pR(PL[i])},${pG(PL[i])},${pB(PL[i])},${(PL[i]*0.65).toFixed(2)})`;
      ctx.lineWidth = sz * 0.45;
      ctx.stroke();
    }
  }
  ctx.restore();

  drawReflection(ts);
  drawVignette();

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
