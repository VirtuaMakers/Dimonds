<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>2nd Place — Firework Waterfall Bridge</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
const C   = document.getElementById("c");
const ctx = C.getContext("2d");
const W   = 900;
const H   = 560;
C.width   = W;
C.height  = H;

// ── Layout ─────────────────────────────────────────────────────────────────────
const WATER_Y = 365;
const DECK_Y  = 245;
const DECK_H  = 14;
const TWR_W   = 50;
const LTX     = 208;
const RTX     = 692;
const TT_Y    = DECK_Y - 162;
const SPAN_L  = LTX + TWR_W/2 + 14;
const SPAN_R  = RTX - TWR_W/2 - 14;
const SPAN_W  = SPAN_R - SPAN_L;

const CABLE_CX = (LTX + RTX) / 2;
const CABLE_CY = TT_Y + 6 + 48;

// ── Particle pool (typed arrays) ───────────────────────────────────────────────
const N   = 4200;
const PX  = new Float32Array(N);
const PY  = new Float32Array(N);
const PVX = new Float32Array(N);
const PVY = new Float32Array(N);
const PL  = new Float32Array(N);
const PD  = new Float32Array(N);
const PSZ = new Float32Array(N);
const PST = new Uint8Array(N);  // 1 = stream column

const COLS = Array.from({length:10}, (_,i) => SPAN_L + (i/9)*SPAN_W);
let slot = 0;

function resetP(i) {
  const s = Math.random() < 0.27;
  PST[i] = s ? 1 : 0;
  PX[i]  = s ? COLS[Math.floor(Math.random()*COLS.length)] + (Math.random()-0.5)*10
             : SPAN_L + Math.random()*SPAN_W;
  PY[i]  = DECK_Y + DECK_H + Math.random()*3;
  PVX[i] = (Math.random()-0.5) * (s ? 0.65 : 3.4);
  PVY[i] = s ? 3.0 + Math.random()*4.5 : 0.8 + Math.random()*3.0;
  PL[i]  = 1.0;
  PD[i]  = s ? 0.0038 + Math.random()*0.006 : 0.007 + Math.random()*0.017;
  PSZ[i] = s ? 1.9 + Math.random()*1.5 : 0.6 + Math.random()*1.9;
}

// Warm-start: fill at random life/position so waterfall is full from frame 1
for (let i = 0; i < N; i++) {
  resetP(i);
  PL[i] = Math.random();
  PY[i] = DECK_Y + DECK_H + Math.random() * (WATER_Y - DECK_Y - DECK_H - 8);
}

function spawnBatch() {
  for (let k = 0; k < 72; k++) { resetP(slot % N); slot++; }
}

// ── Silver → red color progression ────────────────────────────────────────────
// Fresh sparks: bright silver-white. Mid-life: crimson red. Dying: deep dark red.
function pR(l) {
  const t = 1-l;
  if (t < 0.64) return 255;
  return Math.round(255 - (t-0.64)/0.36 * 108);  // 255 → 147 (dark red)
}
function pG(l) {
  const t = 1-l;
  if (t < 0.16) return 255;                                          // silver-white
  if (t < 0.36) return Math.round(255-(t-0.16)/0.20*228);           // → red-ish (255→27)
  if (t < 0.68) return Math.round(27-(t-0.36)/0.32*27);             // → pure red (27→0)
  return 0;
}
function pB(l) {
  const t = 1-l;
  if (t < 0.16) return 255;                                          // silver-white
  if (t < 0.30) return Math.round(255-(t-0.16)/0.14*255);           // → 0
  return 0;
}

// ── Smoke puffs ────────────────────────────────────────────────────────────────
const smk = [];
function spawnSmoke() {
  if (smk.length < 80 && Math.random() < 0.26)
    smk.push({ x:SPAN_L+Math.random()*SPAN_W, y:DECK_Y-4, vx:(Math.random()-0.5)*0.45,
               vy:-(0.28+Math.random()*0.7), r:10+Math.random()*16, a:0,
               d:0.0022+Math.random()*0.003 });
}

// ── Stars (deterministic) ──────────────────────────────────────────────────────
const STARS = Array.from({length:100}, (_,i) => ({
  x:((i*193+43)%(W-24))+12, y:((i*317+71)%(WATER_Y-105))+8,
  r:0.22+(i%4)*0.22, a:0.45+(i%3)*0.2,
}));

// ── Scene ──────────────────────────────────────────────────────────────────────
function drawScene(ts) {
  // Sky
  const sk = ctx.createLinearGradient(0, 0, 0, WATER_Y);
  sk.addColorStop(0,    "#01030f");
  sk.addColorStop(0.52, "#060c1e");
  sk.addColorStop(1,    "#0a152c");
  ctx.fillStyle = sk; ctx.fillRect(0, 0, W, WATER_Y);

  // Stars
  STARS.forEach(s => {
    ctx.globalAlpha = s.a * (0.6+0.4*Math.sin(ts/1900+s.x*0.04));
    ctx.fillStyle = "#cce0ff";
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Horizon city glow
  const hg = ctx.createLinearGradient(0, WATER_Y-52, 0, WATER_Y+5);
  hg.addColorStop(0, "rgba(0,0,0,0)");
  hg.addColorStop(0.6,"rgba(240,180,80,0.05)");
  hg.addColorStop(1,  "rgba(255,200,100,0.11)");
  ctx.fillStyle = hg; ctx.fillRect(0, WATER_Y-52, W, 57);

  // ── Water ──
  const wt = ctx.createLinearGradient(0, WATER_Y, 0, H);
  wt.addColorStop(0, "#060e1c");
  wt.addColorStop(1, "#020407");
  ctx.fillStyle = wt; ctx.fillRect(0, WATER_Y, W, H-WATER_Y);

  // Water ripples (drawn before towers so towers sit ON water surface)
  ctx.lineWidth = 1;
  for (let wy = WATER_Y+12; wy < H; wy += 16) {
    const wa = 0.022 + 0.013*Math.sin(ts/1050+wy/22);
    ctx.strokeStyle = `rgba(185,140,50,${wa.toFixed(3)})`;
    ctx.beginPath();
    ctx.moveTo(38, wy);
    ctx.bezierCurveTo(W*0.3, wy+1.5, W*0.7, wy-1.5, W-38, wy);
    ctx.stroke();
  }

  // Shore embankments (narrow, on each extreme — towers are river piers)
  ctx.fillStyle = "#060a16";
  ctx.fillRect(0, WATER_Y-10, 82, 14);
  ctx.fillRect(W-82, WATER_Y-10, 82, 14);

  // ── Cables ──
  ctx.strokeStyle = "#48586e"; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(16, DECK_Y-22); ctx.lineTo(LTX, TT_Y+6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W-16, DECK_Y-22); ctx.lineTo(RTX, TT_Y+6); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(LTX, TT_Y+6);
  ctx.quadraticCurveTo(CABLE_CX, CABLE_CY, RTX, TT_Y+6);
  ctx.stroke();

  // Hanger cables
  ctx.strokeStyle = "rgba(68,86,108,0.58)"; ctx.lineWidth = 1;
  for (let hx = SPAN_L+8; hx <= SPAN_R-8; hx += 19) {
    const nt = (hx-LTX)/(RTX-LTX);
    const cy = (1-nt)*(1-nt)*(TT_Y+6) + 2*(1-nt)*nt*CABLE_CY + nt*nt*(TT_Y+6);
    ctx.beginPath(); ctx.moveTo(hx, cy); ctx.lineTo(hx, DECK_Y); ctx.stroke();
  }

  // ── Towers (rise from river, anchored into water) ──
  drawTower(LTX);
  drawTower(RTX);

  // Water surface re-drawn over tower bases so they disappear into the river
  ctx.save();
  [LTX, RTX].forEach(tx => {
    const tw = TWR_W + 14;
    const wg = ctx.createLinearGradient(0, WATER_Y-2, 0, WATER_Y+28);
    wg.addColorStop(0,   "rgba(6,14,28,0.0)");
    wg.addColorStop(0.25,"rgba(6,14,28,0.65)");
    wg.addColorStop(1,   "#060e1c");
    ctx.fillStyle = wg;
    ctx.fillRect(tx-tw/2, WATER_Y-2, tw, 30);
  });
  ctx.restore();

  // ── Bridge deck ──
  const dk = ctx.createLinearGradient(0, DECK_Y, 0, DECK_Y+DECK_H);
  dk.addColorStop(0, "#26304a"); dk.addColorStop(1, "#111826");
  ctx.fillStyle = dk; ctx.fillRect(26, DECK_Y, W-52, DECK_H);
  ctx.fillStyle = "rgba(95,120,162,0.16)"; ctx.fillRect(26, DECK_Y, W-52, 2);
  ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillRect(SPAN_L-8, DECK_Y+DECK_H, SPAN_W+16, 5);
}

function drawTower(cx) {
  const x   = cx - TWR_W/2;
  const y   = TT_Y;
  // Base goes into water — this is the full river pier height
  const btm = WATER_Y + 22;

  const tg = ctx.createLinearGradient(x, 0, x+TWR_W, 0);
  tg.addColorStop(0, "#1b2440"); tg.addColorStop(0.45,"#232e50"); tg.addColorStop(1,"#131c2e");

  // Full tower silhouette: pinnacle at top, widens at deck, straight pier to water
  ctx.fillStyle = tg;
  ctx.beginPath();
  ctx.moveTo(cx-1, y);              // pinnacle tip
  ctx.lineTo(cx+4, y+14);
  ctx.lineTo(x+TWR_W+1, y+32);
  ctx.lineTo(x+TWR_W+3, y+TWR_W*1.4);
  ctx.lineTo(x+TWR_W+5, DECK_Y);   // widest at deck level
  ctx.lineTo(x+TWR_W+5, btm);      // pier straight down into water
  ctx.lineTo(x-5, btm);
  ctx.lineTo(x-5, DECK_Y);
  ctx.lineTo(x-3, y+TWR_W*1.4);
  ctx.lineTo(x-1, y+32);
  ctx.lineTo(cx-4, y+14);
  ctx.closePath();
  ctx.fill();

  // Gothic arch (above deck, in upper tower section)
  const aH = (DECK_Y-y)*0.28;
  const aY = y + (DECK_Y-y)*0.44;
  const aW = TWR_W*0.47;
  ctx.fillStyle = "rgba(2,5,14,0.93)";
  ctx.beginPath();
  ctx.moveTo(cx-aW/2, aY+aH);
  ctx.lineTo(cx-aW/2, aY+15);
  ctx.quadraticCurveTo(cx-aW/2, aY, cx, aY);
  ctx.quadraticCurveTo(cx+aW/2, aY, cx+aW/2, aY+15);
  ctx.lineTo(cx+aW/2, aY+aH);
  ctx.closePath(); ctx.fill();

  // Crenellations at pinnacle
  ctx.fillStyle = "#1b2440";
  for (let bx = x+5; bx < x+TWR_W-4; bx += 12) ctx.fillRect(bx, y-9, 5, 9);

  // Cable saddle
  ctx.fillStyle = "#3a4c65";
  ctx.beginPath(); ctx.arc(cx, TT_Y+6, 5, 0, 6.283); ctx.fill();

  // Stone courses — above AND below deck, down to water
  ctx.strokeStyle = "rgba(32,46,70,0.52)"; ctx.lineWidth = 1;
  for (let sy = y+28; sy < WATER_Y-8; sy += 15) {
    ctx.beginPath(); ctx.moveTo(x-3, sy); ctx.lineTo(x+TWR_W+3, sy); ctx.stroke();
  }
}

// ── Red glow bloom from waterfall ──────────────────────────────────────────────
function drawGlow(intensity) {
  if (intensity <= 0) return;
  const iv = Math.min(1, intensity);
  const g = ctx.createRadialGradient(W/2, DECK_Y+60, 12, W/2, DECK_Y+60, 440);
  g.addColorStop(0,    `rgba(240,35,15,${(0.26*iv).toFixed(3)})`);
  g.addColorStop(0.28, `rgba(190,12,5,${(0.16*iv).toFixed(3)})`);
  g.addColorStop(0.62, `rgba(100,5,2,${(0.07*iv).toFixed(3)})`);
  g.addColorStop(1,    "rgba(0,0,0,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // Deck edge lit from below in red
  const dg = ctx.createLinearGradient(0, DECK_Y, 0, DECK_Y+DECK_H+4);
  dg.addColorStop(0, `rgba(230,40,20,${(0.22*iv).toFixed(3)})`);
  dg.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = dg;
  ctx.fillRect(SPAN_L-26, DECK_Y, SPAN_W+52, DECK_H+4);
}

// ── Water reflection: blurry ellipses at surface, sparks disappear into water ─
function drawReflection(ts) {
  ctx.save();
  ctx.globalCompositeOperation = "screen";
  const FADE_DIST = 120; // px above water where reflection fades in

  // Every 2nd particle — only those approaching the surface
  for (let i = 0; i < N; i += 2) {
    if (PL[i] < 0.07) continue;
    const above = WATER_Y - PY[i];  // distance above water (positive = above)
    if (above < 0 || above > FADE_DIST) continue;

    const prox = 1 - above / FADE_DIST;   // 0=far above, 1=at surface
    const wb   = Math.sin(ts/780 + PX[i]/28) * 4.5;
    // Reflection stays very close to water surface
    const ry   = WATER_Y + above * 0.04;
    // Widens into a blurry horizontal smear as it hits the surface
    const eW   = PSZ[i] * (1.5 + prox * 3.5);
    const eH   = PSZ[i] * (0.45 + prox * 0.7);
    const a    = Math.min(0.28, PL[i] * prox * 0.38);

    ctx.beginPath();
    ctx.ellipse(PX[i]+wb, ry, eW, eH, 0, 0, 6.283);
    ctx.fillStyle = `rgba(${pR(PL[i])},${pG(PL[i])},${pB(PL[i])},${a.toFixed(2)})`;
    ctx.fill();
  }
  ctx.restore();

  // Red glow stripe at the water surface (collective reflection)
  const sg = ctx.createLinearGradient(0, WATER_Y, 0, WATER_Y+80);
  sg.addColorStop(0,   "rgba(210,25,12,0.20)");
  sg.addColorStop(0.30,"rgba(170,12,6,0.10)");
  sg.addColorStop(1,   "rgba(0,0,0,0)");
  ctx.fillStyle = sg;
  ctx.fillRect(SPAN_L-75, WATER_Y, SPAN_W+150, 80);
}

// ── Vignette ───────────────────────────────────────────────────────────────────
function drawVignette() {
  const v = ctx.createRadialGradient(W/2, H/2, H*0.28, W/2, H/2, H*0.82);
  v.addColorStop(0, "rgba(0,0,0,0)");
  v.addColorStop(1, "rgba(0,0,0,0.58)");
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

// ── Main loop ──────────────────────────────────────────────────────────────────
function loop(ts) {
  ctx.clearRect(0, 0, W, H);

  drawScene(ts);

  let alive = 0;
  for (let i = 0; i < N; i++) if (PL[i] > 0.06) alive++;
  drawGlow(alive / 2400);

  // Smoke
  spawnSmoke();
  ctx.save();
  for (let i = smk.length-1; i >= 0; i--) {
    const s = smk[i];
    s.x+=s.vx; s.y+=s.vy; s.r+=0.26;
    s.a = Math.min(0.18, s.a+0.007) - s.d;
    if (s.a <= 0) { smk.splice(i,1); continue; }
    ctx.globalAlpha = s.a * 0.88;
    ctx.fillStyle = "#2c2218";
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // Spawn + update particles; sparks vanish AT water surface
  spawnBatch();
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (let i = 0; i < N; i++) {
    if (PL[i] <= 0) continue;
    PX[i] += PVX[i];
    PY[i] += PVY[i];
    PVY[i] += 0.046;
    PVX[i] *= 0.996;

    // Sparks disappear INTO the water surface — no particles below WATER_Y
    if (PY[i] >= WATER_Y) { PL[i] = 0; continue; }

    PL[i] -= PD[i];
    if (PL[i] <= 0) { PL[i] = 0; continue; }

    const sz = PSZ[i] * Math.max(0.1, PL[i]);
    ctx.beginPath();
    ctx.arc(PX[i], PY[i], sz, 0, 6.283);
    ctx.fillStyle = `rgba(${pR(PL[i])},${pG(PL[i])},${pB(PL[i])},${Math.min(0.95,PL[i]).toFixed(2)})`;
    ctx.fill();

    // Stream trails
    if (PST[i] && PL[i] > 0.28 && PVY[i] > 0) {
      ctx.beginPath();
      ctx.moveTo(PX[i], PY[i]);
      ctx.lineTo(PX[i]-PVX[i]*5, PY[i]-PVY[i]*4);
      ctx.strokeStyle = `rgba(${pR(PL[i])},${pG(PL[i])},${pB(PL[i])},${(PL[i]*0.62).toFixed(2)})`;
      ctx.lineWidth = sz * 0.45;
      ctx.stroke();
    }
  }
  ctx.restore();

  drawReflection(ts);
  drawVignette();

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
