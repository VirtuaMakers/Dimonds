<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>8-bit Winner — Dimonds 1st Place Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #050810;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: monospace;
      user-select: none;
    }
    #wrap {
      position: relative;
      border: 2px solid #ffd70033;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 0 32px #ffd70018;
    }
    canvas {
      display: block;
      width: 320px;
      height: 320px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #label {
      margin-top: 12px;
      color: #ffd70066;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="80" height="80"></canvas>
</div>
<div id="label">1st place · tap to replay</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
const W = 80, H = 80;

// ── Palette ────────────────────────────────────────────────────────
const BG = '#050810';
const GOLD  = ['#ffffff','#fffde0','#ffd700','#ffbb00','#ff9900','#cc7700','#884400'];
const STARS = ['#ffffff','#ffffcc','#ffee88','#ffcc44','#ff8800'];
const COINS = ['#ffd700','#ffee44','#ffffff','#ffbb00','#cc8800'];

// ── Pixel helpers ─────────────────────────────────────────────────
function px(x, y, c) {
  ctx.fillStyle = c;
  ctx.fillRect(Math.floor(x), Math.floor(y), 1, 1);
}
function px2(x, y, c) {
  ctx.fillStyle = c;
  ctx.fillRect(Math.floor(x), Math.floor(y), 2, 2);
}

// ── 3×5 pixel font ────────────────────────────────────────────────
const GLYPHS = {
  'W': [0b10001,0b10001,0b10101,0b11011,0b10001],
  'I': [0b111,0b010,0b010,0b010,0b111],
  'N': [0b10001,0b11001,0b10101,0b10011,0b10001],
  'E': [0b111,0b100,0b110,0b100,0b111],
  'R': [0b110,0b101,0b110,0b101,0b101],
  '!': [0b1,0b1,0b1,0b0,0b1],
  ' ': [0,0,0,0,0],
  'Y': [0b101,0b101,0b010,0b010,0b010],
  'O': [0b010,0b101,0b101,0b101,0b010],
  'U': [0b101,0b101,0b101,0b101,0b010],
  'W': [0b10001,0b10001,0b10101,0b11011,0b10001],
  '1': [0b010,0b110,0b010,0b010,0b111],
  'S': [0b011,0b100,0b010,0b001,0b110],
  'T': [0b111,0b010,0b010,0b010,0b010],
  'P': [0b110,0b101,0b110,0b100,0b100],
  'L': [0b100,0b100,0b100,0b100,0b111],
  'A': [0b010,0b101,0b111,0b101,0b101],
  'C': [0b011,0b100,0b100,0b100,0b011],
};
const GLYPH_W = { default: 3, 'W': 5, 'N': 5, 'M': 5 };
function glyphWidth(ch) { return (GLYPH_W[ch] ?? GLYPH_W.default); }

function drawGlyph(chr, x, y, color) {
  const g = GLYPHS[chr];
  if (!g) return;
  const w = glyphWidth(chr);
  for (let row = 0; row < 5; row++) {
    for (let col = w - 1; col >= 0; col--) {
      if ((g[row] >> col) & 1) px(x + (w - 1 - col), y + row, color);
    }
  }
}
function drawLabel(text, x, y, color) {
  let cx = x;
  for (const ch of text) {
    drawGlyph(ch, cx, y, color);
    cx += glyphWidth(ch) + 1;
  }
}
function labelWidth(text) {
  return text.split('').reduce((sum, ch) => sum + glyphWidth(ch) + 1, -1);
}

// ── Particle system ───────────────────────────────────────────────
let particles = [];
function spawn(x, y, vx, vy, color, life, decay, grav, type) {
  particles.push({ x, y, vx, vy, color, life, decay, grav, type });
}

// ── Star burst ────────────────────────────────────────────────────
function spawnBurst(cx, cy, size, palette, count) {
  for (let i = 0; i < count; i++) {
    const a = (i / count) * Math.PI * 2;
    const s = size * (0.7 + Math.random() * 0.6);
    const ci = Math.floor(Math.random() * palette.length);
    spawn(cx, cy, Math.cos(a)*s, Math.sin(a)*s - 0.1,
      palette[ci], 1.0, 0.04 + Math.random()*0.03, 0.015, 'star');
    // inner ring, half speed
    if (i % 2 === 0) {
      spawn(cx, cy, Math.cos(a)*s*0.45, Math.sin(a)*s*0.45 - 0.05,
        palette[0], 0.9, 0.05, 0.012, 'dot');
    }
  }
}

// ── Coin arc ──────────────────────────────────────────────────────
function spawnCoinArc(fromX, fromY, toX, toY, count) {
  for (let i = 0; i < count; i++) {
    const t = i / count;
    const vx = (toX - fromX) * 0.025 + (Math.random()-0.5)*0.4;
    const vy = -2.5 - Math.random()*1.5;
    const c = COINS[Math.floor(Math.random()*COINS.length)];
    spawn(fromX + (Math.random()-0.5)*6, fromY, vx, vy, c,
      1.0, 0.025, 0.12, 'coin');
  }
}

// ── Ground shimmer row ────────────────────────────────────────────
let groundShimmer = [];
function resetGround() {
  groundShimmer = [];
  for (let x = 0; x < W; x++) {
    groundShimmer.push({ phase: Math.random()*Math.PI*2, speed: 0.15+Math.random()*0.1 });
  }
}

// ── Scene segments ─────────────────────────────────────────────────
const SEG = [
  { t:0,    fn: 'coinFountain' },
  { t:900,  fn: 'burst1' },
  { t:1800, fn: 'burst2' },
  { t:2700, fn: 'burst3' },
  { t:3400, fn: 'burst4' },
  { t:4000, fn: 'burst5' },
];
let firedSegs = new Set();

function fireSegment(name, elapsed) {
  if (name === 'coinFountain') {
    for (let i = 0; i < 3; i++) {
      setTimeout(() => {
        spawnCoinArc(W*0.5, H*0.75, W*0.5, H*0.1, 8);
      }, i*220);
    }
  } else if (name === 'burst1') {
    spawnBurst(20, 28, 1.8, GOLD, 16);
  } else if (name === 'burst2') {
    spawnBurst(60, 22, 2.0, GOLD, 20);
  } else if (name === 'burst3') {
    spawnBurst(40, 18, 2.4, STARS, 24);
    // secondary smaller
    setTimeout(() => spawnBurst(40, 18, 1.2, GOLD, 12), 180);
  } else if (name === 'burst4') {
    spawnBurst(15, 35, 1.6, GOLD, 14);
    spawnBurst(65, 30, 1.6, GOLD, 14);
  } else if (name === 'burst5') {
    // grand finale — 3 simultaneous
    spawnBurst(30, 20, 2.6, STARS, 28);
    spawnBurst(50, 16, 2.0, GOLD, 20);
    setTimeout(() => spawnBurst(40, 25, 3.0, ['#ffffff','#ffffaa','#ffd700','#ff9900'], 32), 120);
  }
}

// ── Draw particle ─────────────────────────────────────────────────
function drawParticle(p) {
  const ix = Math.floor(p.x), iy = Math.floor(p.y);
  if (ix < 0 || ix >= W || iy < 0 || iy >= H) return;
  if (p.type === 'coin') {
    // Coin: vertical slit that squishes as it spins
    const phase = p.life * 8;
    const w = Math.max(1, Math.round(Math.abs(Math.sin(phase)) * 2));
    ctx.fillStyle = p.color;
    ctx.fillRect(ix, iy - 1, w, 3);
    if (p.life > 0.6) { ctx.fillStyle = '#ffffff88'; ctx.fillRect(ix, iy - 1, 1, 1); }
  } else if (p.type === 'star' && p.life > 0.5) {
    px(ix, iy, p.color);
    px(ix+1, iy, GOLD[0]); px(ix-1, iy, GOLD[0]);
    px(ix, iy-1, GOLD[0]);
  } else {
    px(ix, iy, p.color);
  }
}

// ── Stars in sky (background) ─────────────────────────────────────
const bgStars = Array.from({length:18}, () => ({
  x: Math.random()*W, y: Math.random()*(H*0.75),
  phase: Math.random()*Math.PI*2, s: Math.random()<0.3 ? 2 : 1
}));

// ── Crown pixel art (at top) ──────────────────────────────────────
function drawCrown(cx, y) {
  // base
  for (let x = cx-8; x <= cx+8; x++) px(x, y+4, GOLD[2]);
  for (let x = cx-8; x <= cx+8; x++) px(x, y+3, GOLD[2]);
  // teeth
  px(cx-8, y+1, GOLD[2]); px(cx-8, y+2, GOLD[2]);
  px(cx,   y,   GOLD[2]); px(cx, y+1, GOLD[2]); px(cx, y+2, GOLD[2]);
  px(cx+8, y+1, GOLD[2]); px(cx+8, y+2, GOLD[2]);
  // gems
  px(cx-8, y, GOLD[0]);
  px(cx, y-1, GOLD[0]);
  px(cx+8, y, GOLD[0]);
  // highlights
  px(cx-7, y+1, GOLD[1]);
  px(cx-1, y, GOLD[1]);
  px(cx+7, y+1, GOLD[1]);
}

// ── Main loop ─────────────────────────────────────────────────────
const TOTAL_MS = 6500;
const FPS = 12;
const FRAME_MS = 1000 / FPS;
let t0 = null, lastFrame = 0, frame = 0, running = false, rafId = null;

function render(elapsed) {
  // Background
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, W, H);

  // Twinkling bg stars
  const ft = elapsed * 0.003;
  for (const s of bgStars) {
    const brightness = 0.3 + 0.7 * Math.abs(Math.sin(s.phase + ft));
    const col = Math.floor(brightness * 180);
    ctx.fillStyle = `rgb(${col},${col},${Math.min(255, col+30)})`;
    ctx.fillRect(Math.floor(s.x), Math.floor(s.y), s.s, s.s);
  }

  // Ground line — golden shimmer
  const gt = elapsed * 0.005;
  for (let x = 0; x < W; x++) {
    const g = groundShimmer[x];
    const bright = 0.3 + 0.5 * Math.abs(Math.sin(g.phase + gt * g.speed * 3));
    const ci = Math.floor(bright * (GOLD.length - 1));
    ctx.fillStyle = GOLD[ci];
    ctx.fillRect(x, H - 8, 1, 1);
    ctx.fillStyle = GOLD[Math.min(GOLD.length-1, ci+1)];
    ctx.fillRect(x, H - 7, 1, 1);
  }

  // Crown
  drawCrown(W/2, 6);

  // "1ST PLACE" label
  const text1 = '1ST';
  const w1 = labelWidth(text1);
  drawLabel(text1, Math.floor((W - w1)/2), 18, GOLD[2]);

  const text2 = 'PLACE';
  const w2 = labelWidth(text2);
  // Shimmer effect: alternate two gold shades each frame
  const shimCol = frame % 2 === 0 ? GOLD[1] : GOLD[2];
  drawLabel(text2, Math.floor((W - w2)/2), 25, shimCol);

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += p.grav;
    p.vx *= 0.97;
    p.life -= p.decay;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    // fade color
    if (p.life < 0.25) {
      const dimmed = Math.floor(p.life * 4 * 255);
      ctx.fillStyle = `rgb(${dimmed},${Math.floor(dimmed*0.8)},0)`;
      px(Math.floor(p.x), Math.floor(p.y), ctx.fillStyle);
    } else {
      drawParticle(p);
    }
  }

  // Fire scene segments
  for (const seg of SEG) {
    if (elapsed >= seg.t && !firedSegs.has(seg.fn)) {
      firedSegs.add(seg.fn);
      fireSegment(seg.fn, elapsed);
    }
  }

  // Ambient coin rain after 2s
  if (elapsed > 2000 && elapsed < TOTAL_MS - 500 && frame % 3 === 0) {
    if (Math.random() < 0.4) {
      const rx = 5 + Math.random() * (W - 10);
      spawn(rx, -2, (Math.random()-0.5)*0.3, 0.6 + Math.random()*0.4,
        COINS[Math.floor(Math.random()*COINS.length)],
        1.0, 0.02, 0.04, 'coin');
    }
  }

  // "YOU WIN!" flash after 3.5s
  if (elapsed > 3500) {
    const alpha = Math.sin((elapsed - 3500) * 0.005) * 0.5 + 0.5;
    const col = frame % 4 < 2 ? GOLD[0] : GOLD[2];
    const win = 'YOU WIN!';
    const ww = labelWidth(win);
    drawLabel(win, Math.floor((W - ww)/2), 55, col);
  }

  frame++;
}

function loop(ts) {
  if (!running) return;
  if (!t0) t0 = ts;
  const elapsed = ts - t0;
  if (elapsed >= TOTAL_MS) { running = false; return; }
  if (ts - lastFrame >= FRAME_MS) {
    lastFrame = ts;
    render(elapsed);
  }
  rafId = requestAnimationFrame(loop);
}

function start() {
  particles = [];
  firedSegs = new Set();
  t0 = null; lastFrame = 0; frame = 0; running = true;
  resetGround();
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  if (rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(loop);
}

canvas.addEventListener('click', start);
canvas.addEventListener('touchend', e => { e.preventDefault(); start(); });
start();
</script>
</body>
</html>
