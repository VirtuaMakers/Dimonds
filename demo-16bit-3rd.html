<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>16-bit Cosmic Burst — Dimonds 3rd Place</title>
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:#02040c; display:flex; flex-direction:column; align-items:center;
           justify-content:center; min-height:100vh; font-family:monospace; user-select:none; }
    #wrap { border:2px solid #0066cc33; border-radius:4px; overflow:hidden;
            box-shadow:0 0 50px #00448820, 0 0 10px #0066cc30; }
    canvas { display:block; width:320px; height:320px;
             image-rendering:pixelated; image-rendering:crisp-edges; }
    #label { margin-top:12px; color:#0088cc88; font-size:10px; letter-spacing:2px; text-transform:uppercase; }
  </style>
</head>
<body>
<div id="wrap"><canvas id="c" width="160" height="160"></canvas></div>
<div id="label">3rd place · tap to replay</div>
<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
ctx.imageSmoothingEnabled=false;
const W=160,H=160;

const SKY =['#02040c','#030610','#040814','#050a1a','#060c20'];
const BLUE=['#ffffff','#cceeff','#66ccff','#2299ee','#1166cc','#004499','#002266'];
const CYAN=['#ffffff','#aaffee','#00eeff','#00bbcc','#008899','#005566'];
const ELEC=['#ffffff','#eeffff','#aaffff','#44eeff','#00ccff','#0099cc'];
const NEBULA=['#0a0830','#0c0a38','#0e0c40','#080630','#06051c'];

function px(x,y,c){ctx.fillStyle=c;ctx.fillRect(x|0,y|0,1,1);}
function fill(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x|0,y|0,w,h);}

// 5×7 font
const F={'3':[0b11110,0b00001,0b00001,0b01110,0b00001,0b00001,0b11110],
'R':[0b11110,0b10001,0b10001,0b11110,0b10010,0b10001,0b10001],
'D':[0b11110,0b10001,0b10001,0b10001,0b10001,0b10001,0b11110],
' ':[0,0,0,0,0,0,0],'P':[0b11110,0b10001,0b10001,0b11110,0b10000,0b10000,0b10000],
'L':[0b10000,0b10000,0b10000,0b10000,0b10000,0b10000,0b11111],
'A':[0b01110,0b10001,0b10001,0b11111,0b10001,0b10001,0b10001],
'C':[0b01111,0b10000,0b10000,0b10000,0b10000,0b10000,0b01111],
'E':[0b11111,0b10000,0b10000,0b11110,0b10000,0b10000,0b11111],
'G':[0b01111,0b10000,0b10000,0b10111,0b10001,0b10001,0b01111],
'T':[0b11111,0b00100,0b00100,0b00100,0b00100,0b00100,0b00100],
'O':[0b01110,0b10001,0b10001,0b10001,0b10001,0b10001,0b01110],
'!':[0b00100,0b00100,0b00100,0b00100,0b00100,0b00000,0b00100],
'N':[0b10001,0b11001,0b10101,0b10011,0b10001,0b10001,0b10001],
'I':[0b01110,0b00100,0b00100,0b00100,0b00100,0b00100,0b01110],
'W':[0b10001,0b10001,0b10001,0b10101,0b10101,0b11011,0b10001],
'S':[0b01111,0b10000,0b10000,0b01110,0b00001,0b00001,0b11110]};
function drawChar(ch,x,y,fg,sh){
  const g=F[ch]; if(!g) return;
  for(let r=0;r<7;r++) for(let c=4;c>=0;c--) if((g[r]>>c)&1){
    if(sh){ctx.fillStyle=sh;ctx.fillRect(x+(4-c)+1,y+r+1,1,1);}
    px(x+(4-c),y+r,fg);
  }
}
function drawText(t,x,y,fg,sh){let cx=x;for(const ch of t){drawChar(ch,cx,y,fg,sh);cx+=6;}}
function tw(t){return t.length*6-1;}

// ── Background ────────────────────────────────────────────────────
// Nebula wisps (static, per-pixel random)
const nebula=[];
for(let i=0;i<220;i++){
  nebula.push({x:Math.random()*W,y:Math.random()*H,
    r:Math.random()<0.1?3:Math.random()<0.3?2:1,
    c:NEBULA[Math.floor(Math.random()*NEBULA.length)]+''+
      Math.floor(Math.random()*50+10).toString(16).padStart(2,'0')});
}
const STARS=Array.from({length:80},()=>({
  x:Math.random()*W,y:Math.random()*H,
  r:Math.random()<0.1?2:1,phase:Math.random()*Math.PI*2,spd:0.015+Math.random()*0.04,
  col:['#ffffff','#cceeff','#ddeeff'][Math.floor(Math.random()*3)],
}));
// Distant planet (upper right)
const PLANET_X=130,PLANET_Y=25,PLANET_R=12;

function drawBG(elapsed){
  // Sky
  for(let y=0;y<H;y++){
    const bi=Math.min(SKY.length-1,(y/H*(SKY.length-1))|0);
    ctx.fillStyle=SKY[bi]; ctx.fillRect(0,y,W,1);
  }
  // Nebula
  for(const n of nebula){ ctx.fillStyle=n.c; ctx.fillRect(n.x|0,n.y|0,n.r,n.r); }
  // Stars
  const st=elapsed*0.002;
  for(const s of STARS){
    const b=0.3+0.7*Math.abs(Math.sin(s.phase+st*s.spd));
    if(b<0.15) continue;
    const a=(b*255|0).toString(16).padStart(2,'0');
    ctx.fillStyle=s.col+a; ctx.fillRect(s.x|0,s.y|0,s.r,s.r);
  }
  // Distant planet
  for(let dy=-PLANET_R;dy<=PLANET_R;dy++){
    const hw=Math.floor(Math.sqrt(PLANET_R*PLANET_R-dy*dy));
    for(let dx=-hw;dx<=hw;dx++){
      const dist=Math.sqrt(dx*dx+dy*dy)/PLANET_R;
      const r=Math.floor(20+dist*30), g2=Math.floor(30+dist*40), b=Math.floor(60+dist*50);
      ctx.fillStyle=`rgb(${r},${g2},${b})`;
      ctx.fillRect((PLANET_X+dx)|0,(PLANET_Y+dy)|0,1,1);
    }
  }
  // Planet ring
  for(let dx=-PLANET_R-4;dx<=PLANET_R+4;dx++){
    ctx.fillStyle='#334466'; ctx.fillRect((PLANET_X+dx)|0,PLANET_Y|0,1,1);
    ctx.fillStyle='#223355'; ctx.fillRect((PLANET_X+dx)|0,PLANET_Y+1|0,1,1);
  }
}

// ── Particles ─────────────────────────────────────────────────────
let particles=[], rings=[], lightning=[];

function spawn(x,y,vx,vy,pal,life,decay,grav,type){
  const c=Array.isArray(pal)?pal[Math.floor(Math.random()*pal.length)]:pal;
  particles.push({x,y,vx,vy,color:c,pal,life,decay,grav,type,age:0});
}
function spawnRing(cx,cy,pal){
  rings.push({cx,cy,r:0,maxR:32,pal,life:1.0});
}

// ── Burst ─────────────────────────────────────────────────────────
function kirbyBurst(cx,cy,pal,size){
  // 8-ray primary + 8 midpoint secondary = 16 total beams
  for(let i=0;i<16;i++){
    const a=(i/16)*Math.PI*2;
    const spd=size*(0.8+Math.random()*0.4);
    // Leading beam
    spawn(cx,cy,Math.cos(a)*spd,Math.sin(a)*spd,pal,1.0,0.020,0,'beam');
    // Trail
    spawn(cx,cy,Math.cos(a)*spd*0.6,Math.sin(a)*spd*0.6,pal,0.85,0.028,0,'beam2');
    spawn(cx,cy,Math.cos(a)*spd*0.35,Math.sin(a)*spd*0.35,pal,0.70,0.035,0,'beam2');
  }
  // Scatter
  for(let i=0;i<80;i++){
    const a=Math.random()*Math.PI*2, s=0.2+Math.random()*size*1.4;
    spawn(cx,cy,Math.cos(a)*s,Math.sin(a)*s-(s*0.15),pal,1.0,0.022+Math.random()*0.02,0.035,'spark');
  }
  // Flash
  spawn(cx,cy,0,0,['#ffffff'],0.8,0.09,0,'flash');
  spawnRing(cx,cy,pal);
  // Second ring delayed via life offset
  rings.push({cx,cy,r:6,maxR:40,pal,life:0.9});
  // Lightning streaks
  for(let i=0;i<8;i++){
    const a=(i/8)*Math.PI*2;
    const len=8+Math.random()*16;
    lightning.push({
      x:cx,y:cy,
      x2:cx+Math.cos(a)*len,y2:cy+Math.sin(a)*len,
      life:0.8+Math.random()*0.3, decay:0.15,
      col:pal[0]||'#ffffff',
    });
  }
}

// ── Speed lines ───────────────────────────────────────────────────
let speedLines=[];
function spawnSpeedLines(cx,cy){
  for(let i=0;i<12;i++){
    const a=(i/12)*Math.PI*2;
    const len=20+Math.random()*30;
    speedLines.push({
      x1:cx+Math.cos(a)*4, y1:cy+Math.sin(a)*4,
      x2:cx+Math.cos(a)*len, y2:cy+Math.sin(a)*len,
      life:1.0,decay:0.12,col:BLUE[2],
    });
  }
}

// ── Show sequence ─────────────────────────────────────────────────
const SHOW=[
  {t:300,  fn:()=>{kirbyBurst(38,90,BLUE,1.4); spawnSpeedLines(38,90);}},
  {t:1100, fn:()=>{kirbyBurst(122,70,CYAN,1.6); spawnSpeedLines(122,70);}},
  {t:2000, fn:()=>{
    kirbyBurst(80,50,[...BLUE.slice(0,2),...CYAN.slice(1,3),'#ffffff'],2.0);
    spawnSpeedLines(80,50);
    setTimeout(()=>kirbyBurst(80,50,ELEC,1.3),220);
  }},
  {t:3600, fn:()=>{
    kirbyBurst(40,75,BLUE,1.2); kirbyBurst(120,75,BLUE,1.2);
    setTimeout(()=>kirbyBurst(80,48,[...ELEC,...CYAN.slice(0,2)],2.2),300);
    setTimeout(()=>spawnSpeedLines(80,48),300);
  }},
];
let firedShow=new Set();

// ── Drift stars (afterglow) ───────────────────────────────────────
let driftStars=[];
function spawnDrift(cx,cy,pal){
  for(let i=0;i<12;i++){
    driftStars.push({
      x:cx+(Math.random()-0.5)*10, y:cy+(Math.random()-0.5)*10,
      vy:-(0.1+Math.random()*0.2), life:1.0,
      color:pal[Math.floor(Math.random()*(pal.length-1))],
    });
  }
}

// ── Main render ───────────────────────────────────────────────────
const TOTAL=7500, FPS=16, FRAME=1000/FPS;
let t0=null,lastF=0,frame=0,running=false,rafId=null;

function render(elapsed){
  drawBG(elapsed);

  // Show segments
  for(const seg of SHOW)
    if(elapsed>=seg.t&&!firedShow.has(seg.t)){
      firedShow.add(seg.t);
      seg.fn();
      // spawn drift on each burst
      setTimeout(()=>{
        const cx=seg.t<500?38:seg.t<1500?122:80;
        const cy=seg.t<500?90:seg.t<1500?70:50;
        spawnDrift(cx,cy,BLUE);
      },200);
    }

  // Lightning
  for(let i=lightning.length-1;i>=0;i--){
    const l=lightning[i];
    l.life-=l.decay;
    if(l.life<=0){lightning.splice(i,1);continue;}
    const a=(l.life*255|0).toString(16).padStart(2,'0');
    ctx.fillStyle=l.col+a;
    // Draw jagged line with 3 segments
    const mx=(l.x+l.x2)/2+(Math.random()-0.5)*5, my=(l.y+l.y2)/2+(Math.random()-0.5)*5;
    for(let t=0;t<10;t++){
      const tt=t/10, x1t=l.x+tt*(mx-l.x)|0, y1t=l.y+tt*(my-l.y)|0;
      ctx.fillRect(x1t,y1t,1,1);
    }
    for(let t=0;t<10;t++){
      const tt=t/10, x1t=mx+tt*(l.x2-mx)|0, y1t=my+tt*(l.y2-my)|0;
      ctx.fillRect(x1t,y1t,1,1);
    }
  }

  // Speed lines
  for(let i=speedLines.length-1;i>=0;i--){
    const sl=speedLines[i];
    sl.life-=sl.decay;
    if(sl.life<=0){speedLines.splice(i,1);continue;}
    const a=(sl.life*180|0).toString(16).padStart(2,'0');
    ctx.fillStyle=sl.col+a;
    for(let t=0;t<12;t++){
      const tt=t/12;
      ctx.fillRect((sl.x1+tt*(sl.x2-sl.x1))|0,(sl.y1+tt*(sl.y2-sl.y1))|0,1,1);
    }
  }

  // Rings
  for(let i=rings.length-1;i>=0;i--){
    const rg=rings[i];
    rg.r+=1.4; rg.life-=0.04;
    if(rg.life<=0||rg.r>rg.maxR){rings.splice(i,1);continue;}
    const a=(rg.life*255|0).toString(16).padStart(2,'0');
    const ri=rg.r|0;
    ctx.fillStyle=(rg.pal[0]||'#ffffff')+a;
    for(let ang=0;ang<360;ang+=3){
      const rad=ang*Math.PI/180;
      ctx.fillRect((rg.cx+Math.cos(rad)*ri)|0,(rg.cy+Math.sin(rad)*ri)|0,1,1);
    }
    // Inner ring
    if(rg.r>8){
      ctx.fillStyle=(rg.pal[2]||rg.pal[0])+a;
      const ri2=(rg.r*0.55)|0;
      for(let ang=0;ang<360;ang+=5){
        const rad=ang*Math.PI/180;
        ctx.fillRect((rg.cx+Math.cos(rad)*ri2)|0,(rg.cy+Math.sin(rad)*ri2)|0,1,1);
      }
    }
  }

  // Particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.age++; p.x+=p.vx; p.y+=p.vy; p.vy+=p.grav; p.vx*=0.988; p.life-=p.decay;
    if(p.life<=0){particles.splice(i,1);continue;}
    const ix=p.x|0,iy=p.y|0;
    if(ix<0||ix>=W||iy<0||iy>=H) continue;
    if(p.type==='flash'){
      const sz=Math.ceil(p.life*6);
      ctx.fillStyle=p.color+'cc'; ctx.fillRect(ix-sz,iy-sz,sz*2,sz*2);
    } else if(p.type==='beam'){
      px(ix,iy,p.color);
      if(p.life>0.5){
        const c2=Array.isArray(p.pal)?p.pal[2]||p.pal[0]:p.color;
        ctx.fillStyle=c2+'aa';
        ctx.fillRect(ix+1,iy,1,1);ctx.fillRect(ix-1,iy,1,1);ctx.fillRect(ix,iy-1,1,1);
      }
    } else {
      px(ix,iy,p.color);
      if(p.life>0.7){
        ctx.fillStyle=(Array.isArray(p.pal)?p.pal[1]||p.color:p.color)+'88';
        ctx.fillRect(ix+1,iy,1,1);
      }
    }
  }

  // Drift stars (afterglow floaters)
  for(let i=driftStars.length-1;i>=0;i--){
    const s=driftStars[i];
    s.y+=s.vy; s.life-=0.008;
    if(s.life<=0){driftStars.splice(i,1);continue;}
    const a=(s.life*255|0).toString(16).padStart(2,'0');
    ctx.fillStyle=s.color+a; ctx.fillRect(s.x|0,s.y|0,1,1);
    if(s.life>0.6){
      ctx.fillStyle=BLUE[0]+((s.life*100|0).toString(16).padStart(2,'0'));
      ctx.fillRect((s.x-1)|0,s.y|0,1,1); ctx.fillRect((s.x+1)|0,s.y|0,1,1);
      ctx.fillRect(s.x|0,(s.y-1)|0,1,1);
    }
  }

  // Ambient cosmic sparkles
  if(frame%3===0&&Math.random()<0.4){
    spawn(Math.random()*W,Math.random()*H,
      (Math.random()-0.5)*0.15,-0.05-Math.random()*0.1,
      BLUE,0.6+Math.random()*0.5,0.03,0,'spark');
  }

  // Title
  const title='3RD PLACE';
  const ttw=tw(title);
  const tc=frame%3===0?BLUE[1]:frame%3===1?CYAN[2]:BLUE[0];
  drawText(title,((W-ttw)/2)|0,6,tc,'#001133');

  // "GREAT EFFORT!" after 2nd burst
  if(elapsed>1600){
    const msg='NOT DONE!', mw=tw(msg);
    const mc=frame%4<2?CYAN[2]:ELEC[3];
    drawText(msg,((W-mw)/2)|0,H-14,mc,'#001133');
  }

  frame++;
}

function loop(ts){
  if(!running) return;
  if(!t0) t0=ts;
  const el=ts-t0;
  if(el>=TOTAL){running=false;return;}
  if(ts-lastF>=FRAME){lastF=ts;render(el);}
  rafId=requestAnimationFrame(loop);
}
function start(){
  particles=[];rings=[];lightning=[];speedLines=[];driftStars=[];
  firedShow=new Set();
  t0=null;lastF=0;frame=0;running=true;
  if(rafId) cancelAnimationFrame(rafId);
  rafId=requestAnimationFrame(loop);
}
canvas.addEventListener('click',start);
canvas.addEventListener('touchend',e=>{e.preventDefault();start();});
start();
</script>
</body>
</html>
